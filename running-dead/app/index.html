<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="러닝데드">
<meta name="theme-color" content="#1f1f23">
<link rel="manifest" href="manifest.webmanifest">

<title>러닝데드</title>
<style>html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1f1f23; -webkit-text-size-adjust: 100%; }</style>
</head>
<body>
<style>
  /* 한 화면짜리 테스트 — 캔버스가 화면을 꽉 채우고, 누른 자리에만 조이스틱이 뜬다 (궁수의 전설식) */
  :root {
    --ground: #999999;                     /* 유니티 테스트 바닥 (0.6 회색) */
    --joy-fill: rgba(255, 255, 255, 0.16);
    --joy-ring: rgba(255, 255, 255, 0.7);
    --knob: rgba(255, 255, 255, 0.92);
    --label: rgba(0, 0, 0, 0.38);
    --near: #7fd4ff;                       /* 근접 거리 원 */
    --domain: #4d7cff;                     /* 지배 거리 원 (실선) */
    --fight: #ff7a59;                      /* 공격 지배 거리 원 (점선) */
    --btn-bg: rgba(20, 22, 26, 0.5);
    --btn-fg: #ffffff;
    --note-bg: rgba(20, 22, 26, 0.82);
    --note-fg: #ffffff;
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html { box-sizing: border-box; height: 100%; overflow: hidden; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: #1f1f23; font-family: var(--font);   /* 게임 밖으로 보이는 데가 있어도 어둡게 (v128) */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }   /* 받은 화면 전체를 게임으로 — 아래 빈 띠가 안 남게 (v128) */
  #view { display: block; width: 100%; height: 100%; }
  .item { position: absolute; width: 54px; height: 54px; margin: 0 0 -27px -27px; border-radius: 50%; touch-action: none; cursor: pointer; z-index: 5;
    background: conic-gradient(var(--c) calc(var(--p) * 1%), rgba(255, 255, 255, 0.16) 0); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); }   /* 기술 버튼 (v190) — 둘레 = 다시 채우는 게이지 */
  .item .core { position: absolute; inset: 5px; border-radius: 50%; background: rgba(22, 22, 28, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; pointer-events: none; }
  .item .ic { font-size: 15px; line-height: 1; }
  .item .n { font: 800 17px/1 var(--font); margin-top: 1px; }
  .item.empty .core { opacity: 0.6; }
  .item.pop { animation: itempop 0.35s ease-out; }
  @keyframes itempop { 0% { transform: scale(1.6); } 100% { transform: scale(1); } }
  #acq { position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(9% + env(safe-area-inset-top, 0px)); box-sizing: border-box; transition: opacity 0.25s; touch-action: none; }   /* 기술 획득 (v190) — 화면을 눌러야 닫힌다 */
  #acq .big { font-size: 96px; line-height: 1; }
  #acq .t { margin-top: 16px; font: 800 24px/1.2 var(--font); color: #fff; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8); }
  #acq .ds { margin: 18px 22px 0; max-width: 340px; padding: 14px 16px; border-radius: 12px; background: rgba(20, 20, 26, 0.75); color: #fff; font: 600 15px/1.5 var(--font); word-break: keep-all; }   /* 기술 자세한 설명 (v226) */
  #acq .ds li { margin: 0 0 4px 18px; }
  #acq .ds ul { margin: 0; padding: 0; }
  #acq .ds .main { font: 800 19px/1.45 var(--font); color: #fff; }   /* v273: 본 설명이 더 크고 흰색 */
  #acq .ds .up { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.15); color: rgba(220, 205, 160, 0.75); font: 500 13px/1.45 var(--font); }   /* 강화 설명은 작고 옅게 */
  #acq .ds .up b { color: #fff; }
  #acq.dud .big { font: 900 104px/1 var(--font); color: #ff4d3a; text-shadow: 0 0 22px rgba(255, 77, 58, 0.55), 0 4px 12px rgba(0, 0, 0, 0.85); animation: dudpop 0.5s cubic-bezier(.2, 1.6, .4, 1); }   /* v288: 꽝 금고 */
  #acq.dud .t { margin-top: 24px; font-size: 28px; }
  @keyframes dudpop { 0% { transform: scale(0.2) rotate(-14deg); } 100% { transform: scale(1) rotate(0deg); } }
  #acq .h { margin-top: 10px; font: 600 13px/1 var(--font); color: rgba(255, 255, 255, 0.7); }
  .fly { position: absolute; z-index: 21; pointer-events: none; line-height: 1; transform: translate(-50%, -50%); }
  #stars .s { display: inline-block; width: 0.62em; font-weight: 900; text-align: center; font-size: 22px; }   /* v193: 수배 단계 = 보라 느낌표 */
  #stars .s.off { opacity: 0.5; }   /* v425: 빈 느낌표 살짝 밝게 (0.3 → 0.5) */
  #stars .cap { display: block; margin: 0 0 3px; font: 800 11px/1 var(--font); color: #e2c2fb; white-space: nowrap; }   /* v424: '경보단계'를 느낌표 줄 위 가운데로 */   /* v307: 느낌표 줄 왼쪽에 '경보단계' (느낌표 줄은 가운데 그대로) */
  #stars .lv { display: block; margin-top: 2px; min-height: 11px; font: 800 11px/1 var(--font); font-style: normal; color: #e2c2fb; }   /* 수배 단계 이름 (v194) */
  #stars .s.hit { animation: starhit 0.2s ease-out; }
  @keyframes starhit { 0% { transform: scale(1.9); } 60% { transform: scale(0.85); } 100% { transform: scale(1); } }
  #lvbox { position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; z-index: 4; }   /* 레벨·경험치 (v201) */
  #lvbox .lv { font: 800 12px/1 var(--font); color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); }   /* v307: 15 → 12px */
  #lvbox .bar { margin-top: 3px; width: 66px; height: 5px; border-radius: 3px;   /* v307: 84×6 → 66×5 */ background: rgba(255, 255, 255, 0.18); overflow: hidden; }
  #lvbox .bar i { display: block; height: 100%; width: 0; background: #7fd4ff; transition: width 0.25s; }
  #lvbox .xp { display: none; }   /* v283: 경험치 숫자 숨김 — 게이지 바만 */
  #lvbox.up .lv { animation: lvup 0.6s ease-out; }
  @keyframes lvup { 0% { transform: scale(1.8); color: #7fd4ff; } 100% { transform: scale(1); } }
  .toast { position: absolute; left: 50%; bottom: calc(220px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30; padding: 10px 16px; border-radius: 10px; background: rgba(20, 20, 26, 0.88); color: #fff; font: 700 15px/1 var(--font); pointer-events: none; transition: opacity 0.3s; white-space: nowrap; }   /* v275 */
  .pbadge, #vest { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(6px + env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; border-radius: 12px; background: rgba(22, 22, 28, 0.85); border: 2px solid #8fa3b8;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; pointer-events: auto; cursor: pointer; touch-action: none; z-index: 4; }   /* 방탄복 (v201) — 패시브, 왼쪽 아래. v284: 누르면 설명창 */
  .pbadge .ic, #vest .ic { font-size: 20px; line-height: 1; }
  .pbadge .pc, #vest .pc { font: 700 10px/1 var(--font); margin-top: 2px; color: #cfe0f0; }
  #pick { position: absolute; inset: 0; z-index: 22; background: rgba(0, 0, 0, 0.7); display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: calc(18vh + env(safe-area-inset-top, 0px)); box-sizing: border-box; touch-action: none; transition: opacity 0.3s; }   /* 레벨업 카드 고르기 (v201) */
  #pick .hd { font: 900 28px/1 var(--font); color: #7fd4ff; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8); }
  #pick .sub { margin-top: 6px; font: 600 13px/1 var(--font); color: rgba(255, 255, 255, 0.75); }
  #pick .cards { display: flex; gap: 8px; margin-top: 18px; padding: 0 10px; }
  #pick .card { width: 112px; min-height: 150px; box-sizing: border-box; padding: 12px 8px; border-radius: 14px; background: linear-gradient(#2b2b36, #1c1c24); border: 2px solid #4a4a5a; color: #fff; text-align: center; transition: transform 0.15s, border-color 0.15s, opacity 0.3s; }
  #pick .card .ic { font-size: 34px; line-height: 1.1; }
  #pick .card .nm { margin-top: 12px; font: 800 15px/1.15 var(--font); }
  #pick .card .ds { margin-top: 10px; font: 600 12px/1.35 var(--font); color: rgba(255, 255, 255, 0.78); word-break: keep-all; }
  #pick .card .vl { margin-top: 8px; font: 700 11px/1.35 var(--font); color: #7fd4ff; word-break: keep-all; }
  #pick .card.on { border-color: #7fd4ff; transform: translateY(-8px) scale(1.04); box-shadow: 0 0 18px rgba(127, 212, 255, 0.45); }
  #pick .card.gone { opacity: 0; transform: scale(0.8); }
  #pick .card.win { transform: scale(1.18); border-color: #ffd34d; box-shadow: 0 0 28px rgba(255, 211, 77, 0.7); }
  #pick .ok { margin-top: 22px; padding: 12px 38px; border: 0; border-radius: 12px; background: #7fd4ff; color: #10202a; font: 800 17px/1 var(--font); opacity: 0.35; transition: opacity 0.15s; }
  #pick .ok.ready { opacity: 1; }
  #win { position: absolute; inset: 0; z-index: 30; background: rgba(10, 4, 18, 0); display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; transition: background 0.5s; overflow: hidden; }   /* 승리 (v201) */
  #win.on { background: rgba(10, 4, 18, 0.72); }
  #win .vt { font: 900 56px/1 var(--font); letter-spacing: 3px; color: #e9c6ff; text-shadow: 0 0 18px #b44ee6, 0 0 40px #b44ee6; transform: scale(0.2); opacity: 0; transition: transform 0.5s cubic-bezier(.2,1.6,.4,1), opacity 0.3s; }
  #win.on .vt { transform: scale(1); opacity: 1; }
  #win .vs { margin-top: 14px; font: 700 15px/1 var(--font); color: #fff; opacity: 0; transition: opacity 0.4s 0.4s; }
  #win.on .vs { opacity: 0.9; }
  #win .bang { position: absolute; left: 50%; top: 45%; font: 900 26px/1 var(--font); color: #b44ee6; text-shadow: 0 0 8px rgba(180, 78, 230, 0.9); transform: translate(-50%, -50%); transition: transform 1.1s ease-out, opacity 1.1s ease-in; }
  #goal { position: absolute; left: 0; right: 0; top: calc(15% + env(safe-area-inset-top, 0px)); z-index: 23; text-align: center; pointer-events: none; opacity: 0; transform: translateY(-12px) scale(0.9); transition: opacity 0.35s, transform 0.35s; }   /* 시작 목표 (v202) */
  #goal.on { opacity: 1; transform: none; }
  #goal .ok { margin-top: 26px; padding: 12px 40px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.92); color: #15151c; font: 800 17px/1 var(--font); pointer-events: auto; }   /* 확인 (v218) */
  #goal .g3 { margin-top: 14px; display: flex; justify-content: center; gap: 22px; font: 900 40px/1 var(--font); color: #d58cff; text-shadow: 0 0 10px rgba(180, 78, 230, 0.9), 0 2px 4px #000; }   /* 경찰서 수만큼 느낌표 (v214) */
  #goal .g1 { font: 600 14px/1 var(--font); color: rgba(255, 255, 255, 0.8); letter-spacing: 2px; }
  #goal .g2 { margin-top: 10px; padding: 0 16px; font: 900 34px/1.2 var(--font); color: #fff; text-shadow: 0 0 14px #b44ee6, 0 3px 8px rgba(0, 0, 0, 0.8); word-break: keep-all; }
  .rank { position: absolute; left: 0; right: 0; top: calc(11% + env(safe-area-inset-top, 0px)); z-index: 18; text-align: center; pointer-events: none; animation: rankin 4.8s ease-out forwards; }   /* v279: 약 4초 동안 또렷하게 떠 있다 */   /* v278: 동료 수 칭호 — 게임은 계속, 위쪽에 크게 팡 */
  .rank .rt { font: 900 44px/1 var(--font); white-space: nowrap; color: #fff; letter-spacing: 2px;   /* v390: 66 → 44px (2/3), 한 줄 */ text-shadow: 0 0 14px #ff5a3c, 0 0 36px #ff2a00, 0 4px 10px rgba(0, 0, 0, 0.8); }
  .rank .rd { margin-top: 12px; padding: 0 16px; font: 800 30px/1.3 var(--font);   /* v390: 20 → 30px (1.5배) */ color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9); word-break: keep-all; }
  .rank .rbox { display: inline-block; max-width: calc(100% - 24px); box-sizing: border-box; padding: 14px 16px 16px; border-radius: 16px; background: rgba(0, 0, 0, 0.55); }   /* v420: 칭호 글자 뒤 반투명 검은 판 */
  .rank.squad { animation-duration: 3s; }   /* v420: 특수부대 출동 — 3초 */
  .rank.squad .rt { color: #ff4a3a; text-shadow: 0 0 14px rgba(255, 40, 0, 0.9), 0 4px 10px rgba(0, 0, 0, 0.8); }
  @keyframes rankin { 0% { opacity: 0; transform: scale(2.2); } 6% { opacity: 1; transform: scale(0.92); } 10% { transform: scale(1.04); } 13% { transform: scale(1); } 90% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1); } }
  #tut { position: absolute; inset: 0; z-index: 22; box-sizing: border-box; touch-action: none; }   /* 처음 만난 적 소개 (v202) — 글·닫기만 (어둠은 v221부터 게임 화면 안에서) */
  #stage.hiDim > :not(#view):not(#tut) { filter: brightness(0.55); transition: filter 0.25s ease-out; }   /* 발견 연출 (v221): 화면 UI는 검은 막 45%와 같은 진하기로 — 게임 화면은 WebGL 안에서 어둠판을 깔고 대상만 그 위에 그린다 */
  #tut .nm { position: absolute; left: 0; right: 0; text-align: center; font: 900 36px/1 var(--font); text-shadow: 0 0 2px #000, 0 3px 10px rgba(0, 0, 0, 0.9); animation: tutpop 0.35s cubic-bezier(.2,1.6,.4,1); }   /* 이름 (v204) */
  #tut .say { position: absolute; left: 0; right: 0; padding: 0 24px; font: 800 24px/1.35 var(--font); color: #fff; text-align: center; text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8); word-break: keep-all; }
  #tut .close { position: absolute; left: 50%; transform: translateX(-50%); padding: 12px 40px; border: 0; border-radius: 12px; background: rgba(255, 255, 255, 0.92); color: #15151c; font: 800 17px/1 var(--font); }   /* 닫기 (v216) */
  #tut .h { margin-top: 14px; font: 600 13px/1 var(--font); color: rgba(255, 255, 255, 0.65); }
  @keyframes tutpop { 0% { transform: scale(0.2); } 100% { transform: scale(1); } }
  .hold { position: absolute; z-index: 40; width: 96px; height: 96px; margin: -48px 0 0 -48px;   /* v215: 1.5배 */ border-radius: 50%; pointer-events: none;
    background: conic-gradient(#ffffff calc(var(--p) * 1%), rgba(255, 255, 255, 0.18) 0); box-shadow: 0 0 12px rgba(0, 0, 0, 0.5); }   /* 꾹 누르기 원 게이지 (v212) */
  .hold::after { content: ''; position: absolute; inset: 10px; border-radius: 50%; background: rgba(20, 20, 26, 0.35); }   /* 가운데는 비쳐 보이게 — 뒤 글이 가려지지 않게 (v215) */
  #smell { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }   /* 후각 표시 (v180) — 게임 화면 위, 다른 UI 아래 */
  #joy {
    position: absolute; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; width: 124px; height: 124px; margin-left: -62px;
    border: 2px solid var(--joy-ring); border-radius: 50%; background: var(--joy-fill); pointer-events: none;
    opacity: 0.55; transition: opacity 0.12s;   /* 화면 아래 가운데 고정 — 안 만질 땐 흐리게 (v96) */
  }
  #joy.on { opacity: 1; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--knob);
  }
  #ver { display: none !important; }   /* v283: 버전 표시 숨김 (요소는 남겨 둔다) */
  #ver {
    position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));   /* 전체 화면일 때 노치·상태 표시줄 아래로 (v127) */
    font: 600 12px/1 var(--font); color: rgba(255, 255, 255, 0.6); pointer-events: none;   /* 시야 밖이 어두워서 밝은 글씨 */
  }
  #stars {   /* 수배 별 + 다음 출동까지 (v113) */
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none;
    font: 700 19px/1 var(--font); color: #b44ee6;   /* v170: 별 = 보라 (경찰서 색) */ text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); white-space: nowrap;
  }
  #stars i { display: block; margin-top: 4px; font: 600 11px/1 var(--font); font-style: normal; color: rgba(255, 255, 255, 0.75); }
  #minimap {   /* 미니맵 (v123) — 지도 전체. 못 가 본 곳은 까맣게, 가 본 곳은 흐리게, 지금 보이는 곳은 밝게. 경찰서(보라)·나(빨강)만 표시 */
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));   /* '처음부터' 버튼이 있던 자리로 (v130) */
    width: 85px; height: 91px; border-radius: 5px; outline: 1px solid rgba(255, 255, 255, 0.25);   /* 크기는 지도 비율에 맞춰 스크립트가 정한다 */
    background: #24242a; pointer-events: none;   /* 못 가 본 곳 — v129에 반투명으로 했다가 밝은 바닥 위에서 가 본 곳과 구분이 안 돼서 v140에 다시 불투명 (v125 색) */
  }
  #legend {
    position: absolute; top: calc(32px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));   /* v423: 버튼이 빠져서 레벨 바로 밑으로 */   /* 위 가운데 수배 별과 안 겹치게 (v113) */
    display: flex; align-items: center; gap: 5px;
    font: 600 12px/1 var(--font); color: rgba(255, 255, 255, 0.75); pointer-events: none;   /* 어둠 위라 밝은 글씨 */
  }
  #legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
  #legend .near { background: var(--near); }
  #legend .domain { background: var(--domain); }
  #legend .fight { height: 0; border-top: 3px dashed var(--fight); border-radius: 0; }
  #legend .gap { margin-left: 6px; }
  .okBtn {   /* v244: 모든 확인 버튼 = 조이스틱 자리에 조이스틱 크기 동그라미. 떠 있는 동안 조이스틱은 숨긴다 */
    position: fixed !important; left: 50% !important; top: auto !important; bottom: calc(56px + env(safe-area-inset-bottom, 0px)) !important;
    width: 124px !important; height: 124px !important; margin: 0 0 0 -62px !important; padding: 0 !important; border-radius: 50% !important; transform: none !important;
    z-index: 45; font: 800 22px/1 var(--font) !important; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55); border: 0; background: rgba(255, 255, 255, 0.94); color: #15151c; pointer-events: auto; touch-action: manipulation; }
  #stage.okOn #joy { visibility: hidden; }

  (function () {

  // ── 근처 찾기 칸 (v177) — 걸음마다 좀비·시민을 4칸 네모 칸에 나눠 담는다. 근처를 찾을 땐 둘레 칸만 본다 (지도 전체 330명을 매번 훑지 않게) ──
  const G_CELL = 4;
  let G_W = 0, G_H = 0, zCells = [], cCells = [];
  const seBuf = [], nzBuf = [], ncBuf = [], poBuf = [], viBuf = [], lzBuf = [];
  const gUsed = [];
  const gCol = (x) => Math.max(0, Math.min(G_W - 1, Math.floor((x - MM.x0) / G_CELL)));
  const gRow = (z) => Math.max(0, Math.min(G_H - 1, Math.floor((z - MM.z0) / G_CELL)));
  function buildGrids() {
    if (!G_W) {
      G_W = Math.ceil((MM.x1 - MM.x0) / G_CELL) + 1; G_H = Math.ceil((MM.z1 - MM.z0) / G_CELL) + 1;
      zCells = Array.from({ length: G_W * G_H }, () => []); cCells = Array.from({ length: G_W * G_H }, () => []);
    }
    for (const i of gUsed) { zCells[i].length = 0; cCells[i].length = 0; }   // 지난번에 담았던 칸만 비운다
    gUsed.length = 0;
    for (const b of bodies) {
      const L = isZombie(b) ? zCells : b.kind === 'citizen' ? cCells : null;
      if (!L) continue;
      const i = gRow(b.foot.z) * G_W + gCol(b.foot.x);
      if (!zCells[i].length && !cCells[i].length) gUsed.push(i);
      L[i].push(b);
    }
  }
  function nearIn(cells, x, z, r, out) {     // (x, z) 둘레 r(+여유)에 걸치는 칸의 몸들 — 거리는 부르는 쪽이 다시 잰다
    out.length = 0;
    if (!G_W) return out;
    const c0 = gCol(x - r - 0.5), c1 = gCol(x + r + 0.5), r0 = gRow(z - r - 0.5), r1 = gRow(z + r + 0.5);
    for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) { const L = cells[rr * G_W + cc]; for (let i = 0; i < L.length; i++) out.push(L[i]); }
    return out;
  }
  function sense(c) {
    const reach = c.state === 'panic' ? c.sight : c.sense;   // 패닉 중엔 인지거리가 시야만큼 늘어난다
    const seen = [];
    let near = Infinity, nearZ = null;
    for (const z of nearIn(zCells, c.foot.x, c.foot.z, c.sight, seBuf)) {   // 둘레 칸의 좀비만 (v177)
      if (!isZombie(z)) continue;
      if (z.space !== c.space && !(linked(c.space, z.space) && hSeen(z))) continue;   // v296: 다른 공간 — 사람 편 누가 보고 있고 문으로 이어져 있으면 반응
      const d = Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);

      if (d < near) { near = d; nearZ = z; c.lastSeen.copy(z.foot); c.lastSeenSpeed = z.speed; }
      if (d <= reach) seen.push(z);
    }
    if (c.state === 'panic') {
      if (cornered(c) && c.space && c.space.doors.length) { enterSuper(c); return; }   // 구석에 몰렸다 → 초패닉 (v430: 열린 문이 없는 건물이면 안 함 — 전엔 여기서 게임이 멈췄다)
      if (seen.length) { c.timer = c.panicLen; c.flee.copy(fleeDir(c, seen)); }   // 볼 때마다 패닉 시간 처음부터
      else if (nearWall(c, c.sense * WALL_SENSE)) c.flee.copy(fleeDir(c, [{ foot: c.lastSeen, speed: c.lastSeenSpeed }]));   // 벽에 다가가면 마지막에 본 좀비와 그 벽을 피해 다시 고른다 (패닉 시간은 그대로)
    } else if (seen.length) {
      if (charges(c)) enterFight(c, nearZ);  // 공격형: 가장 가까운 좀비에게 덤빈다
      else enterPanic(c, seen);
    }
    else if (near <= c.sight) { if (c.state !== 'alert') { enterAlert(c); if (c.police) { c.spot = nearZ; c.spotR = c.sight; } } }   // 경찰은 경계할 때 본 좀비를 기억한다 (시야가 줄어들어도 그걸 쫓게, v159)
    else if (c.state === 'alert') enterNormal(c);
  }

  // 도망 방향 = 미리 뛰어 보기. 방향마다 LOOK초 뛰어 본다고 치고(벽에 막히면 거기서 멈춘다), 좀비는 전부 자기 속도로 똑바로 쫓아온다고 친다.
  // 그동안 좀비가 가장 가까이 붙는 거리가 제일 넉넉한 방향을 고른다 (가까운 좀비일수록 점수를 크게 깎는다).
  // 건물 안에선 문 쪽으로 뚫린 방향만 멀리 뛸 수 있다 — 그쪽이 좋으면 우연히 문 밖으로 빠져나간다.
  // 가장 가까운 벽이 인지거리의 1/4 안이면 그 벽(의 가장 가까운 점)도 안 움직이는 좀비로 치고 피한다 — 구석에 몰리지 않고 사방으로 튄다
  const fleeV = new THREE.Vector2();
  function fleeDir(c, spots) {
    const wall = nearWall(c, c.sense * WALL_SENSE);
    if (wall) spots = [...spots, wall];
    const sp = c.vel.length();
    let best = -Infinity, bx = 1, bz = 0;
    for (let k = 0; k < DIRS; k++) {
      const a = (k / DIRS) * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
      const room = wallRay(c.foot.x, c.foot.z, dx, dz, PANIC_SPEED * LOOK + BODY) - BODY;   // 이 방향으로 벽까지 뛸 수 있는 거리
      let worst = Infinity;
      for (const z of spots) {
        for (let s = 1; s <= 4; s++) {
          const t = LOOK * s / 4, run = Math.max(0, Math.min(PANIC_SPEED * t, room));
          const m = Math.hypot(z.foot.x - c.foot.x - dx * run, z.foot.z - c.foot.z - dz * run) - z.speed * t;
          if (m < worst) worst = m;
        }
      }
      if (sp > 0.1) worst += 0.1 * (dx * c.vel.x + dz * c.vel.y) / sp;   // 뛰던 방향에 아주 조금 더 — 왔다 갔다 방지
      worst += Math.random() * 1e-3;                                       // 딱 같으면 아무 쪽이나
      if (worst > best) { best = worst; bx = dx; bz = dz; }
    }
    return fleeV.set(bx, bz);
  }

  // ── 초패닉 — 건물 안에서 패닉 중 구석에 몰리면 들어간다. 좀비가 어디 있든 안 보고, 문까지 벽을 따라 도는 길이 짧은 쪽으로 벽을 타고 돌아
  //    문으로 나간다. 문 밖으로 나가면 보통 패닉으로 돌아간다 (그 뒤로는 활동 영역 제한이 풀린 시민) ──
  const cornered = (c) => {
    const B = c.space;
    return !!B && Math.min(c.foot.x - B.x0, B.x1 - c.foot.x) < CORNER && Math.min(c.foot.z - B.z0, B.z1 - c.foot.z) < CORNER;
  };
  // 벽 따라 한 바퀴 = 벽에서 0.6칸 안쪽 네모의 둘레. 자리는 북서 모서리에서 시계 방향(북 → 동 → 남 → 서)으로 잰 거리 u로 나타낸다
  const rimOf = (B) => ({ x0: B.x0 + 0.6, z0: B.z0 + 0.6, x1: B.x1 - 0.6, z1: B.z1 - 0.6 });
  function rimU(R, x, z) {                    // 둘레에서 (x, z)에 가장 가까운 자리의 u
    const W = R.x1 - R.x0, H = R.z1 - R.z0;
    x = Math.max(R.x0, Math.min(R.x1, x)); z = Math.max(R.z0, Math.min(R.z1, z));
    const n = z - R.z0, e = R.x1 - x, s = R.z1 - z, w = x - R.x0, k = Math.min(n, e, s, w);
    return k === n ? x - R.x0 : k === e ? W + (z - R.z0) : k === s ? W + H + (R.x1 - x) : 2 * W + H + (R.z1 - z);
  }
  function rimAt(R, u) {                      // u → 둘레 위 자리
    const W = R.x1 - R.x0, H = R.z1 - R.z0, L = 2 * (W + H);
    u = ((u % L) + L) % L;
    if (u < W) return [R.x0 + u, R.z0];
    if (u < W + H) return [R.x1, R.z0 + (u - W)];
    if (u < 2 * W + H) return [R.x1 - (u - W - H), R.z1];
    return [R.x0, R.z1 - (u - 2 * W - H)];
  }
  function enterSuper(c) {
    const B = c.space, R = rimOf(B), L = 2 * (R.x1 - R.x0 + R.z1 - R.z0);
    c.door = B.doors.reduce((a, o) => Math.hypot(o.cx - c.foot.x, o.cz - c.foot.z) < Math.hypot(a.cx - c.foot.x, a.cz - c.foot.z) ? o : a);   // 가장 가까운 문
    const cw = (rimU(R, c.door.cx, c.door.cz) - rimU(R, c.foot.x, c.foot.z) + L) % L;   // 시계 방향으로 돌면 문까지 둘레 거리
    c.spin = cw <= L / 2 ? 1 : -1;            // 짧은 쪽으로 돈다
    c.state = 'super';
    c.notice = 0;
  }
  function superPanic(c) {
    const B = c.space;
    if (!B) { enterPanic(c, null, true); c.tick = 0; return; }   // 문 밖으로 나왔다 → 보통 패닉 (마지막에 본 좀비를 피해)
    const R = rimOf(B), W = R.x1 - R.x0, H = R.z1 - R.z0, L = 2 * (W + H), D = c.door;
    const up = rimU(R, c.foot.x, c.foot.z), ud = rimU(R, D.cx, D.cz);
    const left = (c.spin > 0 ? ud - up : up - ud) + L * 2;   // 문까지 남은 둘레 거리
    const rest = left % L;
    if (rest < 0.8) { toward(c, D.cx + D.nx * 1.5, D.cz + D.nz * 1.5, PANIC_SPEED); return; }   // 문 앞 → 똑바로 밖으로
    let step = rest;                          // 다음 모서리까지 (문이 더 가까우면 문 자리까지)
    for (const cu of [0, W, W + H, 2 * W + H]) {
      const d = ((c.spin > 0 ? cu - up : up - cu) + L * 2) % L;
      if (d > 0.05 && d < step) step = d;
    }
    const [tx, tz] = rimAt(R, up + c.spin * (step + 0.05));
    const dx = tx - c.foot.x, dz = tz - c.foot.z, d = Math.hypot(dx, dz) || 1;
    wantV.set(dx / d * PANIC_SPEED, dz / d * PANIC_SPEED);
  }

  // 속도를 원하는 속도 쪽으로 step만큼만 바꾼다 = 가감속
  function steer(v, want, step) {
    const dx = want.x - v.x, dz = want.y - v.y, d = Math.hypot(dx, dz);
    if (d <= step) v.copy(want);
    else { v.x += dx / d * step; v.y += dz / d * step; }
  }

  const wantV = new THREE.Vector2();
  function knockStep(b, dt) {                 // 차에 치여 날아가는 중 — 그 방향으로 튕겨 가다가 점점 느려져 멈춘다 (v137)
    b.vel.set(b.knockVX, b.knockVZ);
    const f = Math.exp(-4 * dt);
    b.knockVX *= f; b.knockVZ *= f;
    b.knockT -= dt;
    if (b.knockT <= 0 || Math.hypot(b.knockVX, b.knockVZ) < 0.3) {
      b.knockT = 0; b.knockSlide = false;
      b.vel.set(0, 0);
      if (b.knockDie) { b.knockDie = false; dying.push(b); }   // 멈췄는데 죽었다 → 사라진다
      else if (b.kind === 'citizen' && b.maxHp > 0 && b.hp <= 0 && !b.police && b.state !== 'panic' && b.state !== 'held') {   // 체력이 다한 수비형·공격형 → 놀라서 도망 (때려서 0이 됐을 때와 같다)
        b.lastSeen.copy(b.foot); enterPanic(b, null, true); b.tick = 0;
      }
    }
  }
  const GUARD_PACE = 0.8;      // 수비형 이동 속도 배율 (v150에 20% 내림) — 걷기·배회·패닉·초패닉 전부
  const LURED_FORCE = MY_FORCE * 1.5;   // 돈다발로 달려가는 사람의 미는 힘(무게) = 나의 1.5배 (v196) — 유혹이 풀리면 원래대로
  const INFECT_DECAY = 0.1;   // 저장된 감염 게이지가 빠지는 속도 — 꽉 찬 게이지(100)가 10초에 0 (v213)
  function updateCitizen(c, dt) {
    if (c.sniper) sniperSpeed(c, dt);        // v411: 저격수 실제 이동 속도 (고립 판단)
    if (c.infect > 0 && c.state !== 'held') c.infect = Math.max(0, c.infect - INFECT_DECAY * dt);
    c.force = c.state === 'lured' ? LURED_FORCE : 1;
    if (c.boostT > 0) {                      // 경찰서에서 출동해 막 나온 경찰: 3배로 늘어난 인지거리·시야가 4초에 걸쳐 원래대로 (v158)
      c.boostT = Math.max(0, c.boostT - dt);
      const k = 1 + (SORTIE_SENSE - 1) * c.boostT / SORTIE_SENSE_T;
      c.sense = c.boostSense * k;
      c.sight = c.boostSight * k;
    }
    if (c.knockT > 0) { knockStep(c, dt); return; }
    if (c.dropT > 0) {                       // 경찰차에서 막 내린 경찰: 늘어난 인지거리가 3초에 걸쳐 원래대로 (v114)
      c.dropT = Math.max(0, c.dropT - dt);
      c.sense = c.baseSense * (1 + (DROP_SENSE - 1) * c.dropT / DROP_SENSE_T);
    }
    if (c.state === 'held') { c.vel.set(0, 0); return; }   // 물리는 중엔 꼼짝 못 한다
    if (c.stunT > 0) { c.stunT -= dt; c.vel.set(0, 0); return; }
    if (c.burstN > 0 && (c.burstT -= dt) <= 0) soldierBullet(c);   // v410: 군인 연사 진행   // 감전 (v190) — 2초 동안 아무것도 못 한다 (맞기는 한다)
    // v235: 돈다발 알아채기는 뿌리는 순간 한 번만 (useItem 현금) — 나중에 돈다발을 보는 사람은 안 홀린다
    if (c.state === 'lured') { luredStep(c, dt); return; }
    if (c.lureAlert) {                        // 돈다발 쪽을 보며 경계 — 끝나면 유혹 (그 사이 맞으면 풀린다)
      steer(c.vel, wantV.set(0, 0), ACCEL * dt);
      if ((c.timer -= dt) <= 0) { c.lureAlert = false; if (seeCash(c, c.sight * cashK())) enterLured(c); else enterNormal(c); }
      return;
    }
    if (c.state === 'evade') { sniperEvade(c, dt); return; }   // v396: 저격수 회피
    if (c.state === 'fight') {               // 수비형: 제자리에서 맞서 싸운다 / 공격형: 쫓아가서 때린다 / 경찰: 제자리에서 쏜다
      if (c.police) policeFight(c, dt); else if (c.attacker) attackerFight(c, dt); else guardFight(c, dt);
      return;
    }
    if (c.state === 'super') {               // 초패닉: 주변을 안 보고 벽을 타고 문으로
      wantV.set(0, 0);
      superPanic(c);
      if (c.guard) wantV.multiplyScalar(GUARD_PACE);
      steer(c.vel, wantV, ACCEL * dt);
      return;
    }
    if ((c.tick -= dt) <= 0) { c.tick += TICK; if (!c.recall) sense(c); }   // v410: 복귀 중인 군인은 적을 무시

    wantV.set(0, 0);
    if (c.state === 'alert') {
      if ((c.timer -= dt) <= 0) { if (charges(c)) enterFight(c, null); else enterPanic(c); }   // 경계가 끝나면 공격형은 패닉 대신 덤빈다
    } else if (c.state === 'panic') {
      if (c.notice > 0) c.notice -= dt;
      wantV.copy(c.flee).multiplyScalar(PANIC_SPEED);
      if ((c.timer -= dt) <= 0) enterRest(c);
    } else if (c.state === 'rest') {
      if ((c.timer -= dt) <= 0) enterNormal(c);
    } else if (c.police && c.calls.length) {                 // 경찰 출동: 배회하지 않고 들를 사건 자리 중 가장 가까운 곳으로 뛰어간다
      let k = 0, d = Infinity;
      c.calls.forEach((s, i) => { const e = Math.hypot(s.x - c.foot.x, s.y - c.foot.z); if (e < d) { d = e; k = i; } });
      const s = c.heading = c.calls[k];
      if (d < ARRIVE) {                                      // 도착 → 목록에서 지우고, 이제부터 새 사건도 받는다
        c.calls.splice(k, 1);
        c.heading = null;
        if (!c.station) c.onDuty = true;                    // 경찰서 경찰(호출로 나온)은 사건을 안 받는다
        if (!c.calls.length) enterNormal(c);                 // 더 들를 곳이 없으면 그 근처를 배회
      } else toward(c, s.x, s.y, Math.min(copSpeed(c), d * 3));   // 건물 안이면 문으로 들어간다
    } else if (c.soldier && masterOf(c)) {             // v410: 군인 — 주인 저격수 둘레 자기 자리로
      soldierFollow(c);
    } else if (c.police && !c.station && !c.post && isZombie(me)) {     // 들를 사건 자리가 더 없는 경찰은 주인공(나)을 쫓는다 — 보이면 경계 → 싸움 (v89). 경찰서 경찰은 제자리 배회
      toward(c, me.foot.x, me.foot.z, PANIC_SPEED * POLICE_PACE);   // v410: 추적은 늘 경찰·군인 속도 (저격수도 타겟이 없을 땐 군인 속도)
    } else if (c.goal) {                                     // 일반: 영역 안 한 곳으로 걷기
      const d = Math.hypot(c.goal.x - c.foot.x, c.goal.y - c.foot.z);
      if (d < 0.1) { c.goal = null; c.back = false; c.timer = rand(...IDLE_TIME); }
      else toward(c, c.goal.x, c.goal.y, Math.min((c.back ? WALK_SPEED : CIT_WANDER) * (c.police ? POLICE_PACE : 1), d * 3));
    } else if ((c.timer -= dt) <= 0) c.goal = pickGoal(c.area);   // 일반: 서 있다가 다음 곳으로
    if (c.guard) wantV.multiplyScalar(GUARD_PACE);   // 수비형은 모든 이동이 20% 느리다 (v150)
    steer(c.vel, wantV, accelOf(c) * dt);
  }

  // ── 싸움 ──
  // 수비형 (처음 맞으면 싸움 시작): 상대를 한 놈 정하면 그놈하고만 싸운다 — 다른 좀비가 같이 때려도 상대를 안 바꾼다.

  function soldierLeash(c, dt) {              // v410: 내 동료가 나를 따르는 것과 같은 지배 거리 규칙

    if (b.tracer) { scene.remove(b.tracer); b.tracer.material.dispose(); b.tracer = null; }
    if (b.tracer2) { scene.remove(b.tracer2); b.tracer2.material.dispose(); b.tracer2 = null; }
    b.vel.set(0, 0);
    b.mode = 'free';                          // free = 조작·대기, pounce = 덮치러 가는 중, bite = 무는 중
    b.target = null;
    if (b.boostT > 0) { b.sense = b.boostSense; b.sight = b.boostSight; b.boostT = 0; }   // 출동 직후 늘어난 시야는 좀비가 되면 원래대로 (v158)
    b.sense = me && me.sense ? me.sense : b.sight;   // 동료 인지거리(= 시야) = 나와 똑같이 (v183 — 전엔 시민 때 자기 시야)
    b.speed = SPEED * legK();                 // 튼튼한 다리 = 이동 속도 (v256)
    b.attack = allyAttack();
    b.tick = Math.random() * ZOMBIE_TICK;
    b.pick = null;
    b.slotA = 0;                              // 내 주변에서 맡은 방향 칸의 가운데 (assignSlots가 정한다)
    b.slotOff = 0;                            // 지금 자리 방향 = 칸 가운데에서 이만큼 비켜서
    b.slotK = rand(0.5, 1.5);                 // 지금 자리 거리 = 근접 거리(부대 크기만큼 커진) × 이 값 (±50%)
    b.phase = 'track';                        // track = 자기 자리를 따라가는 중, wander = 자리에 도착해서 배회 중
    b.home = new THREE.Vector2();             // 배회 중심 (도착한 자리)
    b.goal = null;                            // 배회할 곳
    b.timer = rand(...IDLE_TIME);
    b.outT = 0;                               // 지배 거리 밖에 있은 시간
    b.outLimit = 0;                           // 이번에 나갔을 때 복귀 명령까지 시간 (1~2초)
    b.recall = false;                         // 복귀 명령 중 — 지배 거리 안에 들어올 때까지 시민을 안 쫓는다
    b.hp = b.maxHp = allyMaxHp();                  // 좀비가 되면 체력 100으로 꽉 찬다 → 체력바는 다시 깎일 때까지 안 보인다 (수비형·공격형이었으면 바 색만 바꾼다)
    if (b.hpBar) { b.hpFill.material = hpOurMat; b.hpDisp = b.hp; }
    else addHpBar(b, hpOurMat);
    b.atkT = 0;
    b.foe = null;
    assignSlots();
  }

  // 동료 좀비 방향 칸 = 나를 중심으로 360도를 동료 수만큼 나눈 칸 하나씩 (화면 기준 고정 — 내가 방향을 틀어도 안 돈다).
  // 동료가 늘면 지금 서 있는 방향 순서대로 다시 나눈다 (서로 가로지르지 않게).
  let allyN = 0;
  let meMoving = false;                       // 내가 움직이는 중 (멈추는 순간 동료들이 자리를 새로 뽑는다)
  // ── 내 영역 중심 — 근접 영역(동료 자리)·지배 영역(복귀 경계)은 나를 중심으로 하되, 내가 움직이는 방향으로 중심이 밀린다 (v110) ──
  //   두 원은 중심을 같이 쓰고, 최대 근접 영역 반지름의 절반(약 2.05칸)까지만 밀린다 → 나는 늘 두 원 안. 공격 지배 거리·명령 받는 범위도 이 중심.
  //   움직이면 그 방향 최대 자리까지 2.5초, 멈추면 나에게로 7초 (가속·감속, 출렁임 없음). 돌아오다 다시 움직이면 바로 그 방향으로.
  const AREA_SHIFT = NEAR / 2;         // 최대로 밀리는 거리 = 근접 영역 반지름의 절반 (약 2.05칸) — 두 원 다 이만큼 (v111)
  const AREA_GO = 4.74 / 2.5;          // 움직일 때 스프링 세기 — 2.5초에 거의 다(95%) 밀린다
  const AREA_BACK = 4.74 / 7;          // 멈췄을 때 — 7초에 거의 다 돌아온다
  const areaOff = new THREE.Vector2(), areaVel = new THREE.Vector2();   // 나 → 영역 중심, 그 움직이는 속도
  let areaMoving = false;              // 영역 중심이 아직 움직이는 중 (동료가 자리를 계속 따라가게)
  const areaX = () => me.foot.x + areaOff.x, areaZ = () => me.foot.z + areaOff.y;
  const headV = new THREE.Vector2(0, -1);    // v304: 내가 마지막으로 움직인 방향
  function updateArea(dt) {
    const v = me.vel, sp = Math.hypot(v.x, v.y), go = sp > 0.3 && me.mode !== 'dead';
    const shift = AREA_SHIFT * armyK;         // 근접 영역이 커진 만큼 더 밀린다 (v122)
    const tx = go ? v.x / sp * shift : 0, tz = go ? v.y / sp * shift : 0, w = go ? AREA_GO : AREA_BACK;
    if (go) headV.set(v.x / sp, v.y / sp);
    areaVel.x += (w * w * (tx - areaOff.x) - 2 * w * areaVel.x) * dt;   // 임계 감쇠 스프링 (카메라와 같은 방식)
    areaVel.y += (w * w * (tz - areaOff.y) - 2 * w * areaVel.y) * dt;
    areaOff.x += areaVel.x * dt;
    areaOff.y += areaVel.y * dt;
    const l = areaOff.length();
    if (l > shift) areaOff.multiplyScalar(shift / l);   // 반지름의 절반을 넘지 않게
    areaMoving = areaVel.length() > 0.05;
  }

  function assignSlots() {
    const allies = bodies.filter((b) => b.kind === 'ally');
    const n = allyN = allies.length;
    if (!n) return;
    const now = allies.map((b) => Math.atan2(b.foot.z - areaZ(), b.foot.x - areaX()));   // 영역 중심 기준 방향
    const order = allies.map((_, i) => i).sort((i, j) => now[i] - now[j]);
    let sx = 0, sy = 0;                       // 지금 자리에서 가장 덜 움직이게 돌리는 각
    order.forEach((i, k) => { const off = now[i] - (k / n) * Math.PI * 2; sx += Math.cos(off); sy += Math.sin(off); });
    const base = Math.atan2(sy, sx);
    const half = Math.PI / n * SLOT_SPREAD;   // 칸이 좁아졌으면 지금 자리도 칸 안으로
    order.forEach((i, k) => {
      const b = allies[i];
      b.slotA = base + (k / n) * Math.PI * 2;
      b.slotOff = Math.max(-half, Math.min(half, b.slotOff));
    });
  }

  // 새 자리 = 맡은 방향 칸 안 아무 방향 + 근접 거리 ±50% 아무 거리 (내가 멈출 때, 복귀 명령 때)
  function freshSlot(z) {
    z.slotOff = (Math.random() * 2 - 1) * Math.PI / Math.max(1, allyN) * SLOT_SPREAD;
    z.slotK = rand(0.5, 1.5);
  }

  // 자리 = 내 위치 + 자리 방향으로 자리 거리만큼 (나와 같이 움직인다).
  // 나와 같은 공간 안으로 당긴다 — 내가 건물 안이면 그 건물 안(벽에서 0.7칸), 밖이면 건물 밖(벽에서 0.7칸)
  const slotV = new THREE.Vector2();
  function armorFront(z) {                   // v305: 덩치 자리 = 진행 방향 앞쪽 — v306: 거리는 동료 자리 범위 맨 바깥(근접 거리 1.5배)에 고정
    const ol = areaOff.length();
    let a = ol > 0.15 ? Math.atan2(areaOff.y, areaOff.x) : Math.atan2(headV.y, headV.x);   // 영역 중심이 밀려난 쪽 (멈춰 있으면 마지막으로 움직인 쪽)
    const arm = zombies.filter((b) => b !== me && b.mut === 'armor');
    if (arm.length > 1) a += (arm.indexOf(z) - (arm.length - 1) / 2) * 0.44;   // 여럿이면 앞쪽 부채꼴로 나눠 선다
    a += Math.max(-0.35, Math.min(0.35, z.slotOff));   // 다른 동료처럼 조금 흔들리되 ±20° 안 (동료가 적어 칸이 넓어도 앞을 벗어나지 않게)
    const r = 3.7 * armyK;   /* v350: 덩치 근접(자리) 3.7칸 */              // v347: 1.2 → 1.3배 — v341: 1.5 → 1.2배 — v306: 1.5배 고정 (일반 동료는 0.5~1.5배 랜덤)
    return slotV.set(areaX() + Math.cos(a) * r, areaZ() + Math.sin(a) * r);
  }
  function slotOf(z) {
    const r = z.slotK * NEAR * armyK;          // 자리 거리 — 부대가 커지면 같이 넓어진다 (v122)
    let x = areaX() + Math.cos(z.slotA + z.slotOff) * r, y = areaZ() + Math.sin(z.slotA + z.slotOff) * r;   // 영역 중심 둘레 (v110)
    if (z.mut === 'armor') { const f = armorFront(z); x = f.x; y = f.y; }   // v305: 덩치는 앞쪽 (다른 동료와 섞여서)
    const B = me.space, m = 0.7;
    if (B) { x = Math.max(B.x0 + m, Math.min(B.x1 - m, x)); y = Math.max(B.z0 + m, Math.min(B.z1 - m, y)); }
    else for (const C of buildings) {
      if (x <= C.x0 - m || x >= C.x1 + m || y <= C.z0 - m || y >= C.z1 + m) continue;
      if (x > C.x0 && x < C.x1 && y > C.z0 && y < C.z1) {   // 근접 영역이 건물 안까지 걸치면 그 자리는 건물 안 — 동료가 문으로 들어간다 (v148)
        x = Math.max(C.x0 + m, Math.min(C.x1 - m, x)); y = Math.max(C.z0 + m, Math.min(C.z1 - m, y));
        break;
      }
      const l = x - (C.x0 - m), r = C.x1 + m - x, u = y - (C.z0 - m), w = C.z1 + m - y, k = Math.min(l, r, u, w);   // 가장 가까운 벽 바깥으로
      if (k === l) x = C.x0 - m; else if (k === r) x = C.x1 + m; else if (k === u) y = C.z0 - m; else y = C.z1 + m;
    }
    if (B && B.safe && !B.safe.dead) {        // v295: 건물 안 자리가 금고 위에 걸리면 금고 밖으로
      const S = B.safe, dx = x - S.foot.x, dz = y - S.foot.z, d = Math.hypot(dx, dz), R = S.r + BODY + 0.3;
      if (d < R) { if (d > 1e-6) { x = S.foot.x + dx / d * R; y = S.foot.z + dz / d * R; } else x = S.foot.x + R; }
    }
    if (!B) for (const O of carObs) {         // 서 있는 경찰차 위에 자리가 걸리면 차 밖으로 (v139)
      const dx = x - O.x, dz = y - O.z, d = Math.hypot(dx, dz), R = O.r + BODY + 0.6;   // 길 찾기가 돌아가는 원보다 살짝 밖
      if (d >= R) continue;
      if (d > 1e-6) { x = O.x + dx / d * R; y = O.z + dz / d * R; } else x = O.x + R;
    }
    return slotV.set(x, y);
  }

  // 동료 좀비가 지배 거리 밖에 1~2초 넘게 있으면 복귀 명령. 지배 거리 안에 들어오면 풀린다.
  function recallCheck(z, dt) {
    if (z.mode === 'pounce' || z.mode === 'bite') { z.outT = 0; return; }   // 습격·감염 중엔 지배 거리를 안 본다 — 끝난 뒤부터 다시 잰다 (그 전에 받은 복귀 명령은 그대로)
    if (inDomain(z)) { z.outT = 0; z.recall = false; return; }
    if (z.outT === 0) z.outLimit = z.mut === 'armor' ? 0 : rand(...RECALL_DELAY);   // v349: 덩치는 즉시 (0초)
    z.outT += dt;
    if (!z.recall && z.outT >= z.outLimit) {
      z.recall = true;
      if (z.mut === 'armor') z.dimUntil = clock + 2;   // v368: 덩치는 복귀 명령 받으면 2초 동안 인지거리 1/3
      z.cmd = null;                           // 복귀 명령을 받으면 수행 중이던 명령은 끝난다 (v102)
      z.cmdWall = null;
      freshSlot(z);                           // 돌아갈 자리도 새로 뽑는다 — 들어온 뒤 타겟이 없으면 그 자리까지 온다
      z.phase = 'track';
    }
  }

  // 복귀 명령 중: 어떤 시민도 안 보고 자기 자리로 간다
  function goSlot(z, dt) {
    const s = slotOf(z);
    steer(z.vel, toward(z, s.x, s.y, z.speed * (z.recall && owned.flag ? 1.2 + 0.05 * up.brain : 1)), ACCEL * dt);   // v275: 깃발 — 복귀할 때 빨라진다
  }

  // 타겟이 없는 동료 좀비
  //   추적: 내가 움직이는 동안, 그리고 내가 멈춘 뒤 새 자리에 닿을 때까지 — 자기 자리를 실시간으로 따라간다
  //         (내 움직임 + 자리 쪽으로. 뛰던 속도 그대로, 닿기 직전에만 살짝 줄인다)
  //   배회: 새 자리에 닿으면 그 근처를 천천히 걷다 서기를 반복한다. 내가 다시 움직이면 추적.
  function allyIdle(z, dt) {
    if (meMoving || areaMoving) z.phase = 'track';   // 나나 영역 중심이 움직이는 동안은 자리를 따라간다
    if (z.phase === 'track') {
      const sl = slotOf(z), dx = sl.x - z.foot.x, dz = sl.y - z.foot.z, d = Math.hypot(dx, dz);
      const w = via(z, sl.x, sl.y);
      if (w.x !== sl.x || w.y !== sl.y) {     // 벽이 가로막으면(다른 공간·건물 너머) 길 찾기대로 간다 — 내 움직임은 안 보탠다
        steer(z.vel, toward(z, sl.x, sl.y, z.speed), ACCEL * dt);
        return;
      }
      const toSlot = Math.min(z.speed, d * 3);
      const walk = d > 0.05 ? toSlot / d : 0;
      const mv = me.mode === 'free' ? me.vel : NO_INPUT;   // 내가 덮치러 튀어 나가는 건 따라 하지 않는다
      wantV.set(mv.x + dx * walk, mv.y + dz * walk);
      const s = wantV.length();
      if (s > z.speed) wantV.multiplyScalar(z.speed / s);
      steer(z.vel, wantV, ACCEL * dt);
      if (!meMoving && !areaMoving && d < 0.3) {   // 새 자리에 도착 (영역 중심도 멈췄다) → 배회
        z.phase = 'wander';
        z.home.set(z.foot.x, z.foot.z);
        z.goal = null;
        z.timer = rand(...IDLE_TIME);
      }
      return;
    }
    if (z.goal) {                             // 배회: 도착한 자리 근처 한 곳으로 천천히 걸어간다
      const gx = z.goal.x - z.foot.x, gz = z.goal.y - z.foot.z, g = Math.hypot(gx, gz);
      if (g < 0.1) { z.goal = null; z.timer = rand(...IDLE_TIME); steer(z.vel, wantV.set(0, 0), ACCEL * dt); }
      else { const s = Math.min(ALLY_WALK, g * 3); steer(z.vel, wantV.set(gx / g * s, gz / g * s), ACCEL * dt); }
    } else {                                  // 배회: 서 있다가 근처 다음 곳을 고른다
      steer(z.vel, wantV.set(0, 0), ACCEL * dt);
      if ((z.timer -= dt) <= 0) {
        const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * WANDER_R;
        const gx = z.home.x + Math.cos(a) * r, gz = z.home.y + Math.sin(a) * r;
        if (freeSpot(gx, gz, z.space)) z.goal = new THREE.Vector2(gx, gz);
        else z.timer = rand(...IDLE_TIME);    // 벽 너머·벽 바로 옆이면 이번엔 그대로 서 있는다
      }
    }
  }

  function updateZombie(z, dt) {
    if (z.knockT > 0) { knockStep(z, dt); return; }
    const commanding = z === me && cmdPid !== null;   // 명령키를 누르고 있는 동안 주인공은 가만히 선다 — 이동·사냥 안 함 (v107. 하던 습격·감염은 마저 한다)
    const touching = z === me && pid !== null && !commanding;   // 손가락을 대고 있다 (조종하는 나만)
    const input = z === me && !commanding ? move : NO_INPUT;
    const aimed = z.aim;                         // 지난 걸음에 빨간 테두리를 띄운 시민
    z.aim = null;
    z.engaging = null;                           // 이번 걸음에 HP 있는 시민을 공격 대상으로 잡으면 fight()가 다시 채운다
    if (z !== me) cmdTick(z);                    // 명령 시간이 다 됐으면 풀고, 아니면 지배 거리 배율·부채꼴 각도 갱신
    if (z.atkT > 0) z.atkT -= dt;
    if (z.skipT > 0) z.skipT -= dt;
    if ((z.tick -= dt) <= 0) {                   // 시민처럼 틱마다 타겟을 새로 뽑는다 = 인지거리 안 가장 가까운 시민 (때리던 상대도 더 가까운 시민이 있으면 바뀐다)
      z.tick += ZOMBIE_TICK;
      const old = z.pick;
      if (old && crowd.has(old)) crowd.set(old, crowd.get(old) - 1);   // 내 몫을 빼고 다시 고른다
      z.pick = nearestCitizen(z, z.sense);
      if (z.pick && z.pick.hp > 0) crowd.set(z.pick, (crowd.get(z.pick) || 0) + 1);
      if (z !== me) z.pcand = pounceable(z);    // 덮칠 시민도 타겟과 같이 0.1초마다만 찾는다 (v172 — 전엔 매 프레임 지도 전체를 뒤졌다)
    }
    if (z !== me) recallCheck(z, dt);            // 감염 중에도 시간은 센다 — 물기는 끝까지, 끝나면 바로 복귀
    if (z.mut && z.mode === 'free') { mutStep(z, dt); return; }   // v275: 변이 좀비는 따로 (덮치기·물기 없음)
    const p = z.pick;
    const ready = huntable(z, p) && p.space === z.space && Math.hypot(p.foot.x - z.foot.x, p.foot.z - z.foot.z) <= z.attack ? p : null;   // v296: 덮치기는 같은 공간에서만   // 덮치기 가능 = 타겟이 덮침 거리 안
    let jump = null;                             // 동료가 무조건 먼저 덮칠 시민 (아래에서 정한다)
    if (z.mode === 'bite') {

      });
    });
  }
  // v284: 일시정지 버튼 · 패시브 배지 설명창 — 둘 다 게임을 멈추고, 조이스틱 자리 동그란 버튼으로 닫는다
  //   다른 창(레벨업·획득·발견·승리)이 떠 있거나 죽었을 땐 안 열린다. 떠 있는 동안엔 다른 연출도 줄 서서 기다린다
  let menuOv = null;
  const pauseEl = document.getElementById('pause');
  const canMenu = () => !paused && !menuOv && me && me.mode !== 'dead';
  function openMenu(ov, label) {

  function togglePause() {

  pauseEl.addEventListener('pointerdown', (e) => e.stopPropagation());

  function showInfo(kind) {                   // 패시브 배지를 누르면 → 얻을 때 봤던 설명창 그대로 (닫기)

    openMenu(ov, '닫기');
  }
  const fxQueue = [];                         // v420: 연출 대기열 — 생긴 순서대로 한 번에 하나, 끝나면 1초 쉬고 다음 (경보 · 특수부대 · 칭호 · 레벨업 · 아이템)
  let curFx = null;                          // v428: 지금 나오는 배너형 연출 (경보 · 특수부대 · 칭호) {ev, els, timers}
  function fxTimer(fx, fn, ms) {              // v429: 멈췄다 이어갈 수 있는 연출 타이머
    const t = { left: ms, due: 0, id: 0 };

  function pauseFx() {                        // v429: 아이템 획득창이 뜨면 나오던 연출은 그 자리에서 멈추고 숨는다

  let fxGapUntil = 0, fxBusyPrev = false, starsQueued = 0, lvQueued = 0, teamsSpawned = 0, teamsAnnounced = 0, squadAnim = false;
  function showSquad() {                      // v420: 군인팀 출동 알림 — 칭호 자리에 빨간 글씨
    squadAnim = true;
    const el = document.createElement('div'); el.className = 'rank squad';
    el.innerHTML = '<div class="rbox"><div class="rt">특수부대 출동</div></div>';
    stage.appendChild(el);

  }
  function uiTick() {                         // 매 프레임 (멈춰 있어도): 줄 서 있는 연출을 하나씩
    stage.classList.toggle('okOn', !!stage.querySelector('.okBtn'));   // v244: 확인 버튼이 떠 있으면 조이스틱 숨김
    while (starsQueued < stars) { fxQueue.push({ t: 'star' }); starsQueued++; }   // v420: 새 연출을 생긴 순서대로 줄 세운다 (같은 순간이면 경보 → 특수부대 → 칭호 → 레벨업 → 아이템)
    while (teamsAnnounced < teamsSpawned) { fxQueue.push({ t: 'squad' }); teamsAnnounced++; }
    while (rankNext < RANKS.length && armyN >= RANKS[rankNext].n) fxQueue.push({ t: 'rank', r: RANKS[rankNext++] });   // v278: 동료 수 칭호 (판마다 처음 한 번씩만)
    while (lvQueued < pendingLv) { fxQueue.push({ t: 'lv' }); lvQueued++; }
    while (pendingAward.length) fxQueue.push({ t: 'award', k: pendingAward.shift() });
    const ai = fxQueue.findIndex((e) => e.t === 'award');
    if (ai >= 0 && !acqOpen && !lvOpen && !tutOpen && !menuOv && !victoryOn && goalShown) {   // v428 · v429: 아이템을 먹으면 획득창은 바로 — 나오던 연출은 멈췄다가 확인 뒤 이어짐, 밀린 연출은 그 뒤로
      const e = fxQueue.splice(ai, 1)[0];
      pauseFx();                              // v429: 나오던 연출은 그 자리에 멈춤
      if (e.k === 'dud') showDud(); else showAward(e.k);

    }
    if (curFx && curFx.paused && !acqOpen && !lvOpen && !tutOpen && !menuOv) resumeFx();   // v429: 획득창을 확인하면 멈췄던 연출이 그대로 이어진다
    const busy = acqOpen || starAnim || lvOpen || rankAnim || squadAnim || tutOpen, now = performance.now();
    if (fxBusyPrev && !busy) fxGapUntil = now + 1000;   // v420: 연출이 끝나면 1초 쉬고 다음
    fxBusyPrev = busy;
    if (busy || victoryOn || menuOv) return;   // v284: 일시정지·설명창 동안도 기다린다
    if (!goalShown) { if (spawnFrames >= 3) showGoal(); return; }   // 판 시작 → 첫 장면을 몇 프레임 그린 뒤 목표 (v202)
    if (now < fxGapUntil) return;
    if (tutQueue.length) { showTut(tutQueue.shift()); return; }
    if (stationDown && !victoryOn) { showVictory(); return; }   // 경찰서 다 파괴 → 승리 (v201)
    const e = fxQueue.shift();
    if (!e) return;
    if (e.t === 'star') playStar();
    else if (e.t === 'squad') showSquad();
    else if (e.t === 'rank') showRank(e.r);
    else if (e.t === 'lv') showLevelUp();
    else if (e.k === 'dud') showDud(); else showAward(e.k);   // v288: 꽝
  }
  // v278: 동료 수 칭호 — 판마다 처음 도달할 때 딱 한 번. 게임은 멈추지 않고 화면 위쪽에 큰 글씨가 팡 떴다 사라진다
  const RANKS = [   // v284: 단계마다 간격이 4마리씩 더 벌어진다 (간격 5·10·15·10… → 9·14·19·14…)
                    // v285: 개떼부터 간격에 2·4·6·8·10·12명을 복리로 더 얹는다 → 간격 9·14·21·18·20·22·24·26
                    // v287: 개떼 간격 21 → 16 (뒤는 간격 그대로) → 간격 9·14·16·18·20·22·24·26
    { n: 10, t: '10마리 돌파', d: '패거리를 이루었습니다.' },
    { n: 20, t: '20마리 돌파', d: '떼거리를 이끕니다.' },
    { n: 40, t: '40마리 돌파', d: '개떼의 수장이 되었습니다.' },
    { n: 60, t: '60마리 돌파', d: '압도적인 힘으로.' },
    { n: 80, t: '80마리 돌파', d: '너희의 신은 어디 있느냐?' },   // v280: 대군 다음부터 10마리마다
    { n: 100, t: '100마리 돌파', d: '무저갱의 사자가 왔노라.' },   // v281: 황충대 → 황충떼
    { n: 130, t: '130마리 돌파', d: '나는 군단이다.' },
    { n: 150, t: '150마리 돌파', d: '적당히 해라.' },   // v282
  ];
  let rankNext = 0, rankAnim = false;
  function showRank(r) {
    rankAnim = true;
    const el = document.createElement('div'); el.className = 'rank';
    el.innerHTML = `<div class="rbox"><div class="rt">${r.t}</div><div class="rd">${r.d}</div></div>`;   // v420: 검은 판 위에
    stage.appendChild(el);
    const fx = curFx = { ev: { t: 'rank', r }, els: [el], timers: [] };   // v428
    fxTimer(fx, () => { el.remove(); rankAnim = false; if (curFx === fx) curFx = null; }, 4850);   // v279: 4.8초 (튀어 들어옴 0.3초 + 또렷하게 4초 + 사라짐 0.5초)
  }
  // ── 후각 (v180) — 나만 가진다. 내 인지거리 밖 ~ 그 1.5배 안의 사람을 원으로 알려 준다 ──
  //   원 자리 = 그 사람 쪽 방향으로 내 인지거리 테두리 위 (화면 밖이면 화면 가장자리에 걸친다)
  //   원 색 = 종류, 크기 = 인원 (1명 1배 ~ 10명 3.5배, 그 위로는 안 커진다). 같은 종류 원끼리 겹치면 가운데 한 원으로 합친다
  //   15명 넘게 합쳐지면 크기가 고정된 느낌표로
  const SMELL_K = 1.5, SMELL_R = 7 * 0.8, SMELL_MAX = 3.5, SMELL_BANG = 15, SMELL_GAP = 26;   // 후각 거리 배율, 1배 원 반지름(px), 최대 배율, 느낌표 인원, 원 사이가 이만큼(px)보다 가까우면 합친다
  const smellEl = document.getElementById('smell'), smellCtx = smellEl.getContext('2d');
  const SMELL_MERGE = 3;   // 합쳐지는 거리 배율 (v187에 3배)
  const smellCol = { citizen: '#ffcf33', guard: '#ff8c1a', attacker: '#c62828', police: '#8e24aa' };
  const smBuf = [], sV = new THREE.Vector3();
  const smellR = (n) => SMELL_R * (1 + (SMELL_MAX - 1) * (Math.min(n, 10) - 1) / 9);
  function toScreen(x, z, W, H) { sV.set(x, 0, z).project(camera); return [(sV.x + 1) / 2 * W, (1 - sV.y) / 2 * H]; }
  const ivs = [], smEyes = [];
  function unionEdge(mx, mz, ux, uz) {        // 나에서 (ux, uz) 쪽으로 가다가 좀비 시야 원들의 합(나 포함)을 처음 벗어나는 거리
    ivs.length = 0;

      const cx = z.foot.x - mx, cz = z.foot.z - mz, b = cx * ux + cz * uz, R = z.sense, q = b * b - (cx * cx + cz * cz - R * R);
      if (q < 0) continue;
      const s = Math.sqrt(q), t1 = b + s;
      if (t1 > 0) ivs.push([b - s, t1]);

    ivs.sort((p, q2) => p[0] - q2[0]);
    let cur = 0;
    for (const [t0, t1] of ivs) { if (t0 > cur + 1e-3) break; if (t1 > cur) cur = t1; }
    return cur;
  }
  // v188: 사람 표시는 없앴다. 후각은 경찰서만 — 후각 거리 = 인지거리 3배. 경찰서 바깥 테두리가 인지거리 안에 들어오면 사라진다
  //   보라 느낌표 하나. 크기는 거리로: 가장 멀 때(후각 끝) 1배, 가장 가까울 때(인지거리 끝) 4배
  const STATION_SMELL_K = 3, BANG_PX = 13, BANG_MAX = 4;
  function updateSmell() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2), W = smellEl.clientWidth, H = smellEl.clientHeight;
    if (smellEl.width !== Math.round(W * dpr) || smellEl.height !== Math.round(H * dpr)) { smellEl.width = Math.round(W * dpr); smellEl.height = Math.round(H * dpr); }
    smellCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    smellCtx.clearRect(0, 0, W, H);
    if (!W) return;
    camera.updateMatrixWorld();
    for (const zp of zaps) {                  // 테이저 번쩍 (v190) — 나에서 맞은 적까지 지그재그 번개
      const [ax, ay] = toScreen(me.foot.x, me.foot.z, W, H);
      const [bx, by] = zp.to ? toScreen(zp.to.foot.x, zp.to.foot.z, W, H) : [ax + 18, ay - 18];
      smellCtx.beginPath(); smellCtx.moveTo(ax, ay - 14);
      const n = 7;
      for (let i = 1; i < n; i++) { const t = i / n, jx = (Math.random() - 0.5) * 12, jy = (Math.random() - 0.5) * 12; smellCtx.lineTo(ax + (bx - ax) * t + jx, ay - 14 + (by - ay) * t + jy); }
      smellCtx.lineTo(bx, by - 14);
      smellCtx.globalAlpha = Math.min(1, zp.t / 0.15);

    const [ox, oy] = toScreen(mx, mz, W, H);

    const marks = [];                          // 화면 가장자리 표시 — 경찰서 보라 ! 만 (v293: 금고 건물 노란 ? 는 뺐다. 지붕 ? 는 그대로)
    for (const S of stations) if (!S.down) marks.push([S, '!', '#b44ee6', 0.12]);   // 부서진 경찰서는 안 알려 준다
    for (const p of pickups) marks.push([{ x0: p.x, x1: p.x, z0: p.z, z1: p.z }, null, '#ffd25a', 0.5, p]);   // v422: 안 주운 아이템도 경찰서처럼 가장자리 표시 (금색 동그라미 + 아이콘)
    for (const [S, ch, col, wk, pk] of marks) {
      const px = Math.max(S.x0, Math.min(S.x1, mx)), pz = Math.max(S.z0, Math.min(S.z1, mz));   // 경찰서 바깥 테두리에서 나와 가장 가까운 점
      const dx = px - mx, dz = pz - mz, d = Math.hypot(dx, dz);

      let [x, y] = toScreen(mx + ux * edge, mz + uz * edge, W, H);

      if (x < mx2 || x > W - mx2 || y < my2 || y > H - my2) {   // 화면 밖 → 나에서 그쪽으로 그은 선이 화면 가장자리에 닿는 곳
        const vx = x - ox, vy = y - oy;
        let t = 1;
        if (vx < 0) t = Math.min(t, (mx2 - ox) / vx); if (vx > 0) t = Math.min(t, (W - mx2 - ox) / vx);
        if (vy < 0) t = Math.min(t, (my2 - oy) / vy); if (vy > 0) t = Math.min(t, (H - my2 - oy) / vy);
        x = ox + vx * t; y = oy + vy * t;
      }
      if (!ch) {                               // v422: 아이템 — 금색 동그라미 안에 아이콘
        const r = size * 0.5;
        smellCtx.fillStyle = 'rgba(0, 0, 0, 0.85)'; smellCtx.beginPath(); smellCtx.arc(x, y, r + 2, 0, Math.PI * 2); smellCtx.fill();
        smellCtx.fillStyle = col; smellCtx.beginPath(); smellCtx.arc(x, y, r, 0, Math.PI * 2); smellCtx.fill();
        if (pk.img && pk.img.complete && pk.img.naturalWidth) smellCtx.drawImage(pk.img, x - r * 0.75, y - r * 0.75, r * 1.5, r * 1.5);
        continue;
      }
      smellCtx.font = '900 ' + size.toFixed(1) + 'px ' + getComputedStyle(document.body).fontFamily;
      smellCtx.textAlign = 'center'; smellCtx.textBaseline = 'middle';
      smellCtx.lineWidth = Math.max(3, size * 0.16); smellCtx.strokeStyle = 'rgba(0, 0, 0, 0.85)'; smellCtx.strokeText(ch, x, y);
      smellCtx.fillStyle = col; smellCtx.fillText(ch, x, y);
    }
  }
  let last = 0;
  function frame(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    if (!paused) stepWorld(dt);
    else if (camAnim) stepCamAnim(now);       // 멈춘 채 카메라만 움직이는 연출 (v216)
    else if (hiAnim) hiStep(now);             // 발견 강조 어둠이 짙어지는 중 (v221)
    uiTick();
    requestAnimationFrame(frame);
  }

  function start() {
    spawn();
    new ResizeObserver(resize).observe(canvas);
    resize();
    requestAnimationFrame(frame);
    window.__rdReady = true;
  }

  window.__rd = { get me() { return me; }, bodies, spawn, fleeDir, step: stepWorld };   // 확인용 (콘솔에서 상태 보기·한 걸음씩 돌리기)
  // 내가 고쳐 올리면 열려 있는 화면이 저절로 바뀐다 — 새 버전은 판을 새로 깐다
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>

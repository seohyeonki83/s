<style>html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1f1f23; -webkit-text-size-adjust: 100%; }</style>

<style>
  /* 한 화면짜리 테스트 — 캔버스가 화면을 꽉 채우고, 누른 자리에만 조이스틱이 뜬다 (궁수의 전설식) */
  :root {
    --ground: #999999;                     /* 유니티 테스트 바닥 (0.6 회색) */
    --joy-fill: rgba(255, 255, 255, 0.16);
    --joy-ring: rgba(255, 255, 255, 0.7);
    --knob: rgba(255, 255, 255, 0.92);
    --label: rgba(0, 0, 0, 0.38);
    --near: #7fd4ff;                       /* 근접 거리 원 */
    --domain: #4d7cff;                     /* 지배 거리 원 (실선) */
    --fight: #ff7a59;                      /* 공격 지배 거리 원 (점선) */
    --btn-bg: rgba(20, 22, 26, 0.5);
    --btn-fg: #ffffff;
    --note-bg: rgba(20, 22, 26, 0.82);
    --note-fg: #ffffff;
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html { box-sizing: border-box; height: 100%; overflow: hidden; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: #1f1f23; font-family: var(--font);   /* 게임 밖으로 보이는 데가 있어도 어둡게 (v128) */
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; }   /* 받은 화면 전체를 게임으로 — 아래 빈 띠가 안 남게 (v128) */
  #view { display: block; width: 100%; height: 100%; }
  #joy {
    position: absolute; left: 50%; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; width: 124px; height: 124px; margin-left: -62px;
    border: 2px solid var(--joy-ring); border-radius: 50%; background: var(--joy-fill); pointer-events: none;
    opacity: 0.55; transition: opacity 0.12s;   /* 화면 아래 가운데 고정 — 안 만질 땐 흐리게 (v96) */
  }
  #joy.on { opacity: 1; }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--knob);
  }
  #ver {
    position: absolute; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));   /* 전체 화면일 때 노치·상태 표시줄 아래로 (v127) */
    font: 600 12px/1 var(--font); color: rgba(255, 255, 255, 0.6); pointer-events: none;   /* 시야 밖이 어두워서 밝은 글씨 */
  }
  #stars {   /* 수배 별 + 다음 출동까지 (v113) */
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none;
    font: 700 19px/1 var(--font); color: #ffd34d; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); white-space: nowrap;
  }
  #stars i { display: block; margin-top: 4px; font: 600 11px/1 var(--font); font-style: normal; color: rgba(255, 255, 255, 0.75); }
  #minimap {   /* 미니맵 (v123) — 지도 전체. 못 가 본 곳은 까맣게, 가 본 곳은 흐리게, 지금 보이는 곳은 밝게. 경찰서(보라)·나(빨강)만 표시 */
    position: absolute; top: calc(6px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));   /* '처음부터' 버튼이 있던 자리로 (v130) */
    width: 85px; height: 91px; border-radius: 5px; outline: 1px solid rgba(255, 255, 255, 0.25);   /* 크기는 지도 비율에 맞춰 스크립트가 정한다 */
    background: #24242a; pointer-events: none;   /* 못 가 본 곳 — v129에 반투명으로 했다가 밝은 바닥 위에서 가 본 곳과 구분이 안 돼서 v140에 다시 불투명 (v125 색) */
  }
  #legend {
    position: absolute; top: calc(50px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px));   /* 위 가운데 수배 별과 안 겹치게 (v113) */
    display: flex; align-items: center; gap: 5px;
    font: 600 12px/1 var(--font); color: rgba(255, 255, 255, 0.75); pointer-events: none;   /* 어둠 위라 밝은 글씨 */
  }
  #legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
  #legend .near { background: var(--near); }
  #legend .domain { background: var(--domain); }
  #legend .fight { height: 0; border-top: 3px dashed var(--fight); border-radius: 0; }
  #legend .gap { margin-left: 6px; }
  #reset {   /* 오른쪽 아래 (v130) */
    position: absolute; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    padding: 7px 11px; border: 0; border-radius: 8px;
    background: var(--btn-bg); color: var(--btn-fg); font: 600 13px/1 var(--font);
    touch-action: manipulation; cursor: pointer;
  }
  #cmd {   /* 명령 컨트롤키 — 이동 조이스틱의 오른쪽 위에 붙은 작은 조이스틱. 엄지 하나로 둘 다 닿게 (v100)
              이동 조이스틱 가운데(아래 가운데, 바닥에서 118px)에서 오른쪽 92px · 위 92px = 이 키 가운데 → 두 원 사이 30px */
    position: absolute; left: calc(50% + 54px); bottom: calc(172px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box; width: 76px; height: 76px;
    border: 2px solid var(--joy-ring); border-radius: 50%; background: var(--joy-fill);
    opacity: 0.55; transition: opacity 0.12s; touch-action: none; cursor: pointer;
  }
  #cmd.on { opacity: 1; }
  #cmd::after {   /* 명령 쿨타임 — 남은 만큼 어둡게 덮고, 다 차면 걷힌다 (v102) */
    content: ''; position: absolute; inset: -2px; border-radius: 50%; pointer-events: none;
    background: conic-gradient(rgba(10, 10, 12, 0.62) calc(var(--cd, 0) * 360deg), transparent 0);
  }
  #cmdKnob {
    position: absolute; left: 50%; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px;
    border-radius: 50%; background: var(--knob); pointer-events: none;
  }
  #note {
    position: absolute; top: 40%; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    padding: 12px 14px; border-radius: 10px; background: var(--note-bg); color: var(--note-fg);
    font: 600 15px/1.5 var(--font); text-align: center; word-break: keep-all;
  }
</style>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="joy"><div id="knob"></div></div>
  <div id="ver">v161</div>
  <div id="stars"></div>
  <canvas id="minimap"></canvas>
  <div id="legend"><i class="domain"></i><span id="legendDomain">지배</span><i class="fight"></i><span id="legendFight">공격 지배</span></div>
  <div id="note" hidden></div>
</div>
<button id="reset" type="button">처음부터</button>
<div id="cmd" role="button" aria-label="명령 컨트롤키"><div id="cmdKnob"></div></div>

<script>
  // 폰에서 하얀 화면만 보이지 않게 — 불러오기 실패·실행 오류를 화면 가운데에 글로 띄운다
  (function () {
    var note = document.getElementById('note');
    var LOAD_FAIL = '3D 도구를 못 불러왔어. 인터넷 연결을 확인하고 새로고침해 줘.';
    function show(text) { note.textContent = text; note.hidden = false; }
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') { show(LOAD_FAIL); return; }
      var m = e.message || '';
      if (m.indexOf('ResizeObserver') >= 0) return;   // 브라우저가 내는 무해한 경고
      show('오류: ' + (m || '알 수 없음'));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      show('오류: ' + ((e.reason && e.reason.message) || e.reason));
    });
    setTimeout(function () { if (!window.__rdReady) show(LOAD_FAIL); }, 10000);
  })();
</script>

<script type="module">
  import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

  // ── 값 — 감으로 바꿀 것들은 전부 여기 ──

  const DIST = 77.175 * 0.8 * 0.75 * 0.8;   /* v142에 20% 더 당김 (46.3 → 37.0) */ //   // 카메라 ~ 나 거리 (유닛) — v26의 51.45에서 50% 뒤로, v122에 20% 당김, v140에 25% 더 당김 (약 46.3). 동료가 5명 넘으면 한 명마다 1%씩 뒤로 (armyK)
  const SCREEN_Y = 0.40;  // 내 자리 = 화면 위에서 40% (가운데보다 살짝 위 — 아래는 엄지 자리)

  // 나 (좀비) — 감염된 시민은 동료 좀비가 되어 손 뗀 나처럼 움직인다
  const RADIUS = 0.5;     // 원 반지름 — 나·시민 전부 (지름 1유닛 = 유니티 큐브 한 변)
  const MAP = 0.85;   /* 크기 배율 — 건물 크기·문 폭·활동 영역 크기 */ const POS = 0.8;   /* v145: 자리(점)만 20% 좁힘 — 건물·묶음·동네·순찰 위치. 크기는 그대로 */ //       // 맵 좌표 배율 — 건물 위치·크기·문 폭, 시민 묶음 위치·활동 영역, 경찰 출발 거리에 곱한다 (v82: v81에 이속을 15% 줄인 만큼 맵도 15% 좁힘. 캐릭터 크기·거리 능력치는 그대로)
  const SPEED_BASE = 2.45 * 0.85; // 속도 기준 (유닛/초) — 모든 이동 속도(나·동료·시민·경찰)가 이걸로 정해진다. v81에 15% 줄임
  const MY_SPEED = SPEED_BASE * 1.44 * 1.2 * 0.9;   // 조종하는 나
  const SPEED = MY_SPEED; // 동료 좀비 이동 속도 = 나와 같게 (v68 — 전엔 SPEED_BASE × 1.2 × 1.1)
  const JOY_R = 60;       // 조이스틱 반지름 (px) — 손잡이 가운데는 이 안에서만 움직인다
  const DEAD = 8;         // 누른 자리에서 이만큼(px)은 끌어야 출발
  const ATTACK = 3.24;    // 내 덮침 거리 — 타겟이 이 안에 있어야 덮칠 수 있다 (빨간 테두리)
  const ALLY_ATTACK = ATTACK * 0.9;   // 동료 좀비 덮침 거리 = 나의 90%
  const RAID = 1;         // 덮침 거리 밖 타겟에게 자동으로 달려갈 때 = 이동 속도 그대로 (v73에 되돌림)
  const POUNCE = 6 * 0.7 * 0.7 * 0.7 * 1.3; // 습격(덮치기) 속도 = 자기 이동 속도의 6배에서 v65에 30%, v73에 30%씩 두 번 더 줄이고 v74에 30% 올림 (약 2.68배), 상대를 쫓아간다
  const INFECT = 2.8 / 0.8;   // 감염 시간 (초) — 동료 기준, v70에 감염 속도 20% 느리게 (3.5초) — 이만큼 물고 버티면 감염 (물린 시민 머리 위 게이지)
  const MY_INFECT = 2.5 / 1.2;  // 내 감염 속도 — v71에 동료의 2.5배, v95에 감염 시간 20% 늘림 (1.4초 → 1.68초)
  const BITE_HEAL = 0.03;   // v95에 초당 3%로 — 동료
  const MY_BITE_HEAL = BITE_HEAL * 1.3 * 1.1 * 1.1 * 1.5;   /* v149에 10% 올림 (초당 3.9% → 4.29%), v155에 10% 더 (→ 4.72%), v161에 50% 더 (→ 7.08%) */ //   // 내 흡혈 = 동료의 1.3배 (초당 3.9%, v120)
  // 무는 동안 초당 최대 체력의 이만큼 회복 — 나·동료 전부 (v70)

  // 싸움 — 수비형·공격형 시민·나·동료 좀비 같음. HP가 남은 시민은 바로 못 덮치고, 때려서 0을 만든 뒤 덮친다
  const HP_MAX = 100;     // 체력 — 동료 좀비 (회복 없음)
  const MY_HP = HP_MAX * 2 * 1.5 * 1.3 * 0.7 * 0.75 * 0.85 * 1.3 * 0.7;   // v75에 25%, v76에 15% 줄이고 v93에 30% 늘림 (약 226), v161에 30% 줄임 (약 158)
  const ALLY_HP = HP_MAX * 0.9;   // 동료 좀비 체력 — v77에 10% 줄임 (90)
  const MY_START_HP = 0.2;   /* v149에 두 배 (10% → 20%) */ //   // 시작할 때 내 체력 = 최대의 10% (v76)
    // v70에 30% 줄임 (273) —   // 체력 — 조종하는 나 = 동료의 2배에서 v64에 150%, v65에 30% 더 (390, 회복 없음)
  const GUARD_HP = 200;   // 체력 — 수비형·공격형 시민
  const DAMAGE = 20 / 2 * 0.7;  // 공격력 — v66에 모든 캐릭터 절반, v71에 30% 더 줄임 (7)
  const MY_DAMAGE = DAMAGE * 3 * 2 * 1.15;   // 내 공격력 = 3배 (v64), v67에 그 두 배, v120에 15% 더 (약 48.3)
  const HIT_EVERY = 1 / 1.3;   // 공격 간격 (초) — v71에 공속 30% 올림 (약 0.77초)
  const MELEE = 1.7;      // 근접 공격 거리 (원 중심끼리, 유닛) — v97에 1.0 → 1.7
  const LUNGE = 0.35;     // 때릴 때 상대 쪽으로 살짝 붙는 거리 (유닛, 그림만)
  const LUNGE_IN = 0.1;   // 붙는 시간 (초) — 붙는 순간 데미지가 들어간다
  const LUNGE_OUT = 0.15; // 제자리로 돌아오는 시간 (초)
  const GUARD_REACT = 0.3;   // 수비형·공격형·경찰이 싸우기 시작해서 처음 때리기까지 (초)
  const GUARD_CLOSE = MELEE + 0.5;   // v97: 근접 거리 + 0.5 (전엔 1.0 + 0.5 = 1.5) — 근접 거리보다 늘 넉넉하게
    // 수비형은 이 거리 안에서 자기를 노리는 좀비하고만 싸운다 — 밖에서 노리는 좀비는 빼고, 아무도 없으면 도망간다
                             // 공격형은 때리던 상대가 이 밖으로 멀어지면 고정을 풀고 다시 가장 가까운 좀비를 쫓는다

  // 경찰 — 공격형과 같은데(경계 뒤 패닉 대신 덤빔) 그 자리에서 총을 쏘고, HP 0이 돼도 계속 쏜다.
  //   북쪽 경찰서에서 나온다 — 수배 별이 있으면 출동 간격마다 한 번 (아래 STAR·출동 값, v113)

  // 벽 따라 한 바퀴 = 벽에서 0.6칸 안쪽 네모의 둘레. 자리는 북서 모서리에서 시계 방향(북 → 동 → 남 → 서)으로 잰 거리 u로 나타낸다
  const rimOf = (B) => ({ x0: B.x0 + 0.6, z0: B.z0 + 0.6, x1: B.x1 - 0.6, z1: B.z1 - 0.6 });
  function rimU(R, x, z) {                    // 둘레에서 (x, z)에 가장 가까운 자리의 u
    const W = R.x1 - R.x0, H = R.z1 - R.z0;
    x = Math.max(R.x0, Math.min(R.x1, x)); z = Math.max(R.z0, Math.min(R.z1, z));
    const n = z - R.z0, e = R.x1 - x, s = R.z1 - z, w = x - R.x0, k = Math.min(n, e, s, w);
    return k === n ? x - R.x0 : k === e ? W + (z - R.z0) : k === s ? W + H + (R.x1 - x) : 2 * W + H + (R.z1 - z);

  function rimAt(R, u) {                      // u → 둘레 위 자리

    u = ((u % L) + L) % L;

    c.door = B.doors.reduce((a, o) => Math.hypot(o.cx - c.foot.x, o.cz - c.foot.z) < Math.hypot(a.cx - c.foot.x, a.cz - c.foot.z) ? o : a);   // 가장 가까운 문
    const cw = (rimU(R, c.door.cx, c.door.cz) - rimU(R, c.foot.x, c.foot.z) + L) % L;   // 시계 방향으로 돌면 문까지 둘레 거리

  function superPanic(c) {

    const R = rimOf(B), W = R.x1 - R.x0, H = R.z1 - R.z0, L = 2 * (W + H), D = c.door;

    const rest = left % L;
    if (rest < 0.8) { toward(c, D.cx + D.nx * 1.5, D.cz + D.nz * 1.5, PANIC_SPEED); return; }   // 문 앞 → 똑바로 밖으로
    let step = rest;                          // 다음 모서리까지 (문이 더 가까우면 문 자리까지)
    for (const cu of [0, W, W + H, 2 * W + H]) {

      if (d > 0.05 && d < step) step = d;
    }
    const [tx, tz] = rimAt(R, up + c.spin * (step + 0.05));
    const dx = tx - c.foot.x, dz = tz - c.foot.z, d = Math.hypot(dx, dz) || 1;
    wantV.set(dx / d * PANIC_SPEED, dz / d * PANIC_SPEED);
  }

  // 속도를 원하는 속도 쪽으로 step만큼만 바꾼다 = 가감속
  function steer(v, want, step) {
    const dx = want.x - v.x, dz = want.y - v.y, d = Math.hypot(dx, dz);

    b.vel.set(b.knockVX, b.knockVZ);
    const f = Math.exp(-4 * dt);

      else if (b.kind === 'citizen' && b.maxHp > 0 && b.hp <= 0 && !b.police && b.state !== 'panic' && b.state !== 'held') {   // 체력이 다한 수비형·공격형 → 놀라서 도망 (때려서 0이 됐을 때와 같다)
        b.lastSeen.copy(b.foot); enterPanic(b, null, true); b.tick = 0;

  }
  const GUARD_PACE = 0.8;      // 수비형 이동 속도 배율 (v150에 20% 내림) — 걷기·배회·패닉·초패닉 전부
  function updateCitizen(c, dt) {
    if (c.boostT > 0) {                      // 경찰서에서 출동해 막 나온 경찰: 3배로 늘어난 인지거리·시야가 4초에 걸쳐 원래대로 (v158)
      c.boostT = Math.max(0, c.boostT - dt);

      c.sense = c.boostSense * k;
      c.sight = c.boostSight * k;
    }
    if (c.knockT > 0) { knockStep(c, dt); return; }
    if (c.dropT > 0) {                       // 경찰차에서 막 내린 경찰: 늘어난 인지거리가 3초에 걸쳐 원래대로 (v114)
      c.dropT = Math.max(0, c.dropT - dt);
      c.sense = c.baseSense * (1 + (DROP_SENSE - 1) * c.dropT / DROP_SENSE_T);
    }
    if (c.state === 'held') { c.vel.set(0, 0); return; }   // 물리는 중엔 꼼짝 못 한다
    if (c.state === 'fight') {               // 수비형: 제자리에서 맞서 싸운다 / 공격형: 쫓아가서 때린다 / 경찰: 제자리에서 쏜다
      if (c.police) policeFight(c, dt); else if (c.attacker) attackerFight(c, dt); else guardFight(c, dt);
      return;
    }
    if (c.state === 'super') {               // 초패닉: 주변을 안 보고 벽을 타고 문으로
      wantV.set(0, 0);

      if (c.guard) wantV.multiplyScalar(GUARD_PACE);
      steer(c.vel, wantV, ACCEL * dt);
      return;
    }
    if ((c.tick -= dt) <= 0) { c.tick += TICK; sense(c); }

    wantV.set(0, 0);
    if (c.state === 'alert') {
      if ((c.timer -= dt) <= 0) { if (charges(c)) enterFight(c, null); else enterPanic(c); }   // 경계가 끝나면 공격형은 패닉 대신 덤빈다
    } else if (c.state === 'panic') {
      if (c.notice > 0) c.notice -= dt;
      wantV.copy(c.flee).multiplyScalar(PANIC_SPEED);
      if ((c.timer -= dt) <= 0) enterRest(c);
    } else if (c.state === 'rest') {
      if ((c.timer -= dt) <= 0) enterNormal(c);
    } else if (c.police && c.calls.length) {                 // 경찰 출동: 배회하지 않고 들를 사건 자리 중 가장 가까운 곳으로 뛰어간다
      let k = 0, d = Infinity;
      c.calls.forEach((s, i) => { const e = Math.hypot(s.x - c.foot.x, s.y - c.foot.z); if (e < d) { d = e; k = i; } });
      const s = c.heading = c.calls[k];
      if (d < ARRIVE) {                                      // 도착 → 목록에서 지우고, 이제부터 새 사건도 받는다
        c.calls.splice(k, 1);
        c.heading = null;
        if (!c.station) c.onDuty = true;                    // 경찰서 경찰(호출로 나온)은 사건을 안 받는다
        if (!c.calls.length) enterNormal(c);                 // 더 들를 곳이 없으면 그 근처를 배회
      } else toward(c, s.x, s.y, Math.min(PANIC_SPEED * POLICE_PACE, d * 3));   // 건물 안이면 문으로 들어간다
    } else if (c.police && !c.station && !c.post && isZombie(me)) {     // 들를 사건 자리가 더 없는 경찰은 주인공(나)을 쫓는다 — 보이면 경계 → 싸움 (v89). 경찰서 경찰은 제자리 배회
      toward(c, me.foot.x, me.foot.z, PANIC_SPEED * POLICE_PACE);

      const d = Math.hypot(c.goal.x - c.foot.x, c.goal.y - c.foot.z);

  // ── 싸움 ──
  // 수비형 (처음 맞으면 싸움 시작): 상대를 한 놈 정하면 그놈하고만 싸운다 — 다른 좀비가 같이 때려도 상대를 안 바꾼다.

  function guardFight(c, dt) {
    steer(c.vel, wantV.set(0, 0), ACCEL * dt);

    const holds = (z) => z && isZombie(z) && z.engaging === c && gap(z) <= GUARD_CLOSE;   // 아직 상대가 될 수 있나

      return;
    }

  }

  // 공격형 (좀비를 보면 패닉 대신 싸움 시작, 먼저 맞아도 싸움 시작):
  //   쫓는 중엔 좀비가 타겟을 뽑듯이 틱마다 시야 안 가장 가까운 좀비를 새로 뽑아서 그놈한테 다가간다(시민 뛰는 속도).
  //   근접 거리에 붙으면 그 상대로 고정하고 1초마다 때린다 — 수비형처럼 더 가까운 좀비가 와도 안 바꾼다.
  //   그 상대가 도망가거나 멀어지면(1.5칸 밖) 또는 죽으면 다시 쫓는 중 → 가장 가까운 좀비. 시야 안에 좀비가 없으면 일반으로 돌아간다.
  //   HP가 0이 되면 놀람 없이 도망간다 (landHit) — 그 뒤로는 좀비를 봐도 일반 시민처럼 도망간다.
  function attackerFight(c, dt) {
    if (c.atkT > 0) c.atkT -= dt;
    if (c.notice > 0) c.notice -= dt;
    const tick = (c.tick -= dt) <= 0;
    if (tick) c.tick += TICK;
    let pick = tick || !sees(c, c.foe);         // 쫓는 중: 틱마다 다시 뽑는다 (상대가 죽었거나 아직 없거나 안 보이면 바로)
    if (c.locked) {
      const z = c.foe;
      if (sees(c, z) && Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z) <= GUARD_CLOSE) pick = false;   // 때리는 중: 상대 고정
      else { c.locked = false; pick = true; }    // 도망가거나 멀어지면(1.5칸 밖)·죽으면 고정을 풀고 바로 다시 뽑는다
    }

    const z = c.foe, d = Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);

  }

  // 경찰 (공격형과 같다 — 좀비를 보면 경계 뒤 패닉 대신 싸움, 먼저 맞아도 싸움. 싸우는 동안 인지거리 = 시야):
  //   사거리 안이면 그 자리에 서서 쏜다 — 사거리 = 자기 원래(1배) 시야, 1초마다, 공격력 2배. 붙어 있어도 쏜다. 늘어난 시야로 본 좀비는 사거리까지 달려간다 (v159).
  //   틱마다 시야 안 가장 가까운 좀비를 새로 뽑아서 쏜다 — 고정 없이 계속 바뀐다.
  //   HP가 0이 돼도 도망가지 않고 계속 쏜다 (덮칠 수는 있다). 시야 안에 좀비가 없으면 싸움 끝 → 다음 사건 자리로, 없으면 배회.
  function policeFight(c, dt) {

    const far = (z) => Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);
    if (tick || !sees(c, c.foe)) {          // 틱마다 다시 뽑는다 (상대가 죽었거나 아직 없거나 안 보이면 바로)
      const inRange = nearestZombie(c, range);
      if (inRange) { c.foe = inRange; c.chaseR = 0; }   // 사거리 안에 좀비가 있으면 가장 가까운 걸 쏜다
      else {                                 // 늘어난 시야로 본 좀비 (v159): 처음 본 거리보다 멀어지지 않는 한, 시야가 줄어도 사거리에 들 때까지 쫓아간다
        if (!sees(c, c.foe) && sees(c, c.spot)) { c.foe = c.spot; c.chaseR = c.spotR; }   // 경계할 때 본 좀비

    const z = c.foe, d = far(z);
    if (d > range) { steer(c.vel, toward(c, z.foot.x, z.foot.z, PANIC_SPEED * POLICE_PACE), ACCEL * dt); return; }   // 사거리 밖 → 달려간다
    steer(c.vel, wantV.set(0, 0), ACCEL * dt);

  function nearestZombie(c, range) {
    let best = null, bd = range;
    for (const z of zombies) {
      if (!sees(c, z)) continue;
      const d = Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);
      if (d <= bd) { bd = d; best = z; }
    }
    return best;
  }

  // 쏘기: 붙는 모션 없이 바로 맞는다 — 경찰 → 좀비로 노란 선이 잠깐 번쩍
  function shoot(c, z) {
    c.shotT = 0;
    c.shotAt = z;
    landHit(c, z, POLICE_DAMAGE);
  }

  // 경찰 출동 — 사람이 감염될 때마다 (경찰이 감염돼도 센다):
  //   첫 출동이 끝난 경찰(도착했거나 싸움을 시작한)은 사건이 날 때마다 그 자리를 목록에 넣고 다 같이 출발한다 — 가장 가까운 곳부터 차례로 들른다.
  //   새 경찰은 북쪽 경찰서에서 나온다 — 감염마다 수배 별이 오르고, 별이 있으면 출동 간격마다 걸어서 1~2명 또는 경찰차 (v113, 위 STAR·CAR 값).
  //   경찰서 안 상주 경찰이 전부 감염되면 경찰서 파괴 → 더는 안 나온다.
  let deaths = 0, stars = 0, dispatchT = 0, stationDown = false, lastIncident = null;   // 감염 수, 수배 별, 출동 시계, 경찰서 전부 파괴, 마지막 사건 자리
  const stations = buildings.filter((B) => B.station);   // 경찰서 다섯 곳 (v121) — B.residents = 안에 상주하는 경찰, B.down = 파괴됨
  function callPolice(spot) {                 // 사람이 감염될 때마다 (경찰도) — 출동 끝낸 경찰에게 사건 알림, 별 올리기
    for (const b of bodies) if (b.kind === 'citizen' && b.onDuty) b.calls.push(new THREE.Vector2(spot.x, spot.z));
    for (const car of cars) if (car.state === 'drive') car.calls.push(new THREE.Vector2(spot.x, spot.z));   // 달리는 경찰차도 새 사건 자리를 받는다 (v116)
    lastIncident = new THREE.Vector2(spot.x, spot.z);
    deaths++;
    stars = Math.min(STAR_MAX, STAR_AT.filter((n) => deaths >= n).length);
  }

  }

  function updateStars() {                    // 위 가운데: 수배 별만 (v123 — 감염 수·출동 시간·경찰서 수는 뺌)
    const html = '★'.repeat(stars) + '<span style="opacity:.3">' + '★'.repeat(STAR_MAX - stars) + '</span>';
    if (html !== starsShown) { starsShown = html; starsEl.innerHTML = html; }
  }
  const starsEl = document.getElementById('stars');
  let starsShown = '';

  // 때리기: 상대 쪽으로 살짝 붙었다 제자리로 돌아오는 모션을 시작한다. 데미지는 붙는 순간(0.1초 뒤)에 들어간다.
  function strike(a, v) {
    const dx = v.foot.x - a.foot.x, dz = v.foot.z - a.foot.z, d = Math.hypot(dx, dz) || 1;
    a.lungeT = 0;
    a.lungeX = dx / d;
    a.lungeZ = dz / d;
    a.lungeVictim = v;
  }

  function landHit(a, v, dmg = DAMAGE) {
    if (v.dead || !(v.kind === 'citizen' || isZombie(v)) || v.hp <= 0) return;
    v.hp = Math.max(0, v.hp - dmg);
    if (v.kind === 'citizen') {
      if (v.state === 'held') return;
      if (v.hp <= 0 && !v.police) {           // HP 0 → 놀람 없이 패닉, 이제 덮칠 수 있다 (경찰은 덮칠 수만 있고 계속 싸운다)
        v.lastSeen.copy(a.foot);
        v.lastSeenSpeed = a.speed;
        enterPanic(v, null, true);
        v.tick = 0;
      } else if (v.state !== 'fight') enterFight(v, a, true);   // 처음 맞으면 맞서 싸운다 — 첫 상대는 때린 좀비
    } else if (v.hp <= 0) dying.push(v);
  }

  // HP 0이 된 좀비: 동료는 사라지고, 나는 '죽었어'를 띄우고 멈춘다
  function killZombie(z) {
    if (z.dead) return;
    z.dead = true;
    const t = z.target;
    if (t) {                                  // 덮치거나 무는 중이었으면 그 시민을 풀어 준다
      t.marked = false;
      t.fixed = false;
      if (t.state === 'held') {
        if (t.police) enterFight(t, null, true);   // 경찰은 풀려나면 바로 다시 쏜다
        else { t.lastSeen.copy(z.foot); t.lastSeenSpeed = z.speed; enterPanic(t, null, true); }
      }
    }
    z.target = null;
    z.fixed = false;
    z.vel.set(0, 0);
    z.aim = null;
    z.engaging = null;
    unclaim(z);
    if (z === me) {                           // 내 체력바는 빈 채로 남는다
      me.mode = 'dead';
      me.mesh.material.color.setHex(COLOR.dead);
      note.textContent = "죽었어 — 오른쪽 위 '처음부터'를 눌러";
      note.hidden = false;
      return;
    }
    scene.remove(z.mesh);
    z.mesh.material.dispose();
    if (z.icon) { scene.remove(z.icon); z.icon.material.dispose(); }
    if (z.gauge) scene.remove(z.gauge);
    if (z.hpBar) scene.remove(z.hpBar);
    bodies.splice(bodies.indexOf(z), 1);
    assignSlots();
  }

  // 좀비가 HP 있는 시민을 노리면: 근접 거리까지 달려가서 1초마다 때린다 (HP가 0이 되면 그다음은 덮치기)
  function fight(z, c, dt) {
    z.engaging = c;                           // 수비형은 이걸 보고 '누가 나를 노리나'를 안다
    const d = Math.hypot(c.foot.x - z.foot.x, c.foot.z - z.foot.z);
    if (d > ATTACK_HOLD) z.attacking = false; // 상대가 1.5칸 밖 = 공격 중 아님 (다가가는 중)
    if (d > MELEE) { steer(z.vel, toward(z, c.foot.x, c.foot.z, z.speed), ACCEL * dt); return; }
    steer(z.vel, wantV.set(0, 0), ACCEL * dt);
    if (z.atkT <= 0) { strike(z, c); z.atkT = HIT_EVERY; z.attacking = true; }   // 휘두르는 순간부터 공격 중
  }

  // ── 좀비: 손가락을 대면 이동만. 떼면 인지거리 안 타겟에게 달려가고, 덮침 거리에 들어오면 덮친다 ──
  // 동료 좀비 = 늘 손을 뗀 나와 같다 (이동 속도·덮침 거리는 나보다 낮다). 거기에 더해
  //   평소엔 내가 움직이는 동안 내 주변 자기 자리를 실시간으로 따라오고, 내가 멈추면 자리를 새로 뽑아(맡은 방향 칸 안에서 랜덤)
  //   그리로 간 다음 그 근처를 배회한다.
  //   시민을 쫓을 땐 지배 거리 밖까지도 나간다. 밖에 1~2초 넘게 있으면 복귀 명령 — 안에 들어올 때까지 어떤 시민도 안 쫓는다 (감염 중이면 끝까지 물고 나서).
  //   단, 덮침 거리 안에 덮칠 수 있는 시민(HP 0)이 있으면 복귀 명령·싸움·찜보다 그걸 먼저 덮친다 (덮치기부터 감염까지 한 덩어리).
  const NO_INPUT = new THREE.Vector2();

  const inDomain = (b) => Math.hypot(b.foot.x - areaX(), b.foot.z - areaZ()) <= (b.attacking ? DOMAIN_FIGHT : DOMAIN) * (b.cmd ? b.cmd.mul : 1) * armyK;   // 공격 중이면 지배 거리가 늘어난다. 명령 중이면 (기본·공격 둘 다) 7초 동안 3배
  // 덮치는 중(marked)인 시민은 아무도 안 노린다. 동료가 쫓기 시작해 찜한 시민은 다른 동료가 안 노린다 (나는 상관없이 노린다).
  // HP가 남은 시민(수비형)은 찜이 없다 — 여럿이 같이 때린다. 다른 공간(건물 안·밖)에 있는 시민은 안 보인다.
  const huntable = (z, b) => b && b.kind === 'citizen' && !b.marked && b.space === z.space && (z === me || b.hp > 0 || !b.chaser || b.chaser === z);

  // 동료 좀비 찜: 쫓기 시작하면 그 시민에 내 이름을 걸고, 그만 쫓으면 푼다
  function claimPrey(z, c) {
    if (z.claim === c) return;
    unclaim(z);
    z.claim = c;
    c.chaser = z;
  }
  function unclaim(z) {
    if (z.claim && z.claim.chaser === z) z.claim.chaser = null;
    z.claim = null;
  }

  // 한 시민에 붙는 좀비는 3명까지 (v148) — 이미 다른 좀비 3명이 붙어 있으면 그다음 가까운 시민을 노린다. 다른 타겟이 없을 때만 그래도 붙는다
  const CROWD_MAX = 3;
  const crowd = new Map();
  function nearestCitizen(z, range) {
    let best = null, bd = range, any = null, ad = range;
    for (const b of bodies) {
      if (!huntable(z, b)) continue;           // 다른 좀비가 노리는 중이면 건너뛴다
      if (!inSight(z, b)) continue;            // 명령 중인 동료는 좁아진 인지 범위(1.8칸 원 + 명령 방향 부채꼴) 안만 본다
      const d = Math.hypot(b.foot.x - z.foot.x, b.foot.z - z.foot.z);
      if (d > ad && d > bd) continue;
      if (d <= ad) { ad = d; any = b; }
      if (d <= bd && (z === me || b.hp <= 0 || (crowd.get(b) || 0) < CROWD_MAX)) { bd = d; best = b; }   // 나는 3명 제한 없이 늘 가장 가까운 시민 (v154)
    }
    return best || any;
  }

  // 동료가 지금 바로 덮칠 수 있는 시민 = 같은 공간, HP 0, 아무도 안 덮치는 중, 덮침 거리 안 — 그중 가장 가까운 시민.
  // 이게 있으면 무조건 먼저 덮친다 — 복귀 명령·싸움·다른 동료의 찜보다 앞 (덮치기부터 감염까지를 한 덩어리로 친다)
  function pounceable(z) {
    let best = null, bd = z.attack;
    for (const b of bodies) {
      if (b.kind !== 'citizen' || b.marked || b.hp > 0 || b.space !== z.space) continue;
      if (!inSight(z, b)) continue;            // 명령 중엔 보이는 시민만 덮친다
      const d = Math.hypot(b.foot.x - z.foot.x, b.foot.z - z.foot.z);
      if (d <= bd && dashOk(z, b)) { bd = d; best = b; }
    }
    return best;
  }

  // 덮쳐도 되나: 덮치는 동안은 다른 몸을 통과해서(벽만 막힌다) 거의 늘 0.2초 안에 닿는다.
  // 그래도 1초 안에 못 닿은 시민은(벽 모서리 등) 1초 동안 다시 안 덮친다 — 막혀서 제자리 덮치기를 되풀이하지 않게
  const dashOk = (z, t) => !(z.skip === t && z.skipT > 0);

  function stopPounce(z) {
    z.target.marked = false;
    z.target = null;
    z.mode = 'free';
    const s = z.vel.length();
    if (s > z.speed) z.vel.multiplyScalar(z.speed / s);   // 덮치다 멈추면 평소 속도로 돌아온다
  }

  function startBite(z, t) {
    z.mode = 'bite';
    z.biteT = z.biteLen = z === me ? INFECT / MY_INFECT : INFECT;   // 나는 더 빨리 감염시킨다
    z.vel.set(0, 0);
    z.fixed = t.fixed = true;                // 무는 동안 둘 다 그 자리에 붙는다
    t.state = 'held';
    t.biter = z;                              // 게이지는 무는 쪽의 남은 시간으로 찬다
    t.vel.set(0, 0);
    const dx = z.foot.x - t.foot.x, dz = z.foot.z - t.foot.z, d = Math.hypot(dx, dz) || 1;
    z.foot.set(t.foot.x + dx / d * BITE_GAP, 0, t.foot.z + dz / d * BITE_GAP);   // 반쯤 겹친 자리
  }

  function endBite(z, ok) {
    const t = z.target;
    z.mode = 'free';
    z.target = null;
    z.fixed = t.fixed = false;
    t.marked = false;
    if (ok) {                                 // 감염 성공 → 동료 좀비, 경찰 쪽엔 사건 하나 (경찰이 감염돼도)
      makeZombie(t);
      callPolice(t.foot);
    } else if (t.police) enterFight(t, z, true);   // 경찰은 HP 0인 채 풀려나도 바로 다시 쏜다
    else {                                    // 포기 → HP 0인 채 풀려나서 놀람 없이 바로 패닉
      t.lastSeen.copy(z.foot);
      t.lastSeenSpeed = z.speed;
      enterPanic(t, null, true);
      t.tick = 0;                             // 곧바로 주변을 다시 보고 방향을 고친다
    }
    z.split = t; t.split = z;                 // 둘이 천천히 떨어진다
    z.splitT = t.splitT = 0.4;
  }

  function makeZombie(b) {
    b.kind = 'ally';
    b.state = '';
    b.mesh.material.color.setHex(COLOR.ally);
    b.mesh.remove(b.arrow);
    b.icon.visible = false;
    b.gauge.visible = false;
    if (b.tracer) { scene.remove(b.tracer); b.tracer.material.dispose(); b.tracer = null; }
    b.vel.set(0, 0);
    b.mode = 'free';                          // free = 조작·대기, pounce = 덮치러 가는 중, bite = 무는 중
    b.target = null;
    if (b.boostT > 0) { b.sense = b.boostSense; b.sight = b.boostSight; b.boostT = 0; }   // 출동 직후 늘어난 시야는 좀비가 되면 원래대로 (v158)
    b.sense = b.sight;                        // 좀비 인지거리 = 시민 때 자기 시야
    b.speed = SPEED;
    b.attack = ALLY_ATTACK;
    b.tick = Math.random() * ZOMBIE_TICK;
    b.pick = null;
    b.slotA = 0;                              // 내 주변에서 맡은 방향 칸의 가운데 (assignSlots가 정한다)
    b.slotOff = 0;                            // 지금 자리 방향 = 칸 가운데에서 이만큼 비켜서
    b.slotK = rand(0.5, 1.5);                 // 지금 자리 거리 = 근접 거리(부대 크기만큼 커진) × 이 값 (±50%)
    b.phase = 'track';                        // track = 자기 자리를 따라가는 중, wander = 자리에 도착해서 배회 중
    b.home = new THREE.Vector2();             // 배회 중심 (도착한 자리)
    b.goal = null;                            // 배회할 곳
    b.timer = rand(...IDLE_TIME);
    b.outT = 0;                               // 지배 거리 밖에 있은 시간
    b.outLimit = 0;                           // 이번에 나갔을 때 복귀 명령까지 시간 (1~2초)
    b.recall = false;                         // 복귀 명령 중 — 지배 거리 안에 들어올 때까지 시민을 안 쫓는다
    b.hp = b.maxHp = ALLY_HP;                  // 좀비가 되면 체력 100으로 꽉 찬다 → 체력바는 다시 깎일 때까지 안 보인다 (수비형·공격형이었으면 바 색만 바꾼다)
    if (b.hpBar) { b.hpFill.material = hpOurMat; b.hpDisp = b.hp; }
    else addHpBar(b, hpOurMat);
    b.atkT = 0;
    b.foe = null;
    assignSlots();
  }

  // 동료 좀비 방향 칸 = 나를 중심으로 360도를 동료 수만큼 나눈 칸 하나씩 (화면 기준 고정 — 내가 방향을 틀어도 안 돈다).
  // 동료가 늘면 지금 서 있는 방향 순서대로 다시 나눈다 (서로 가로지르지 않게).
  let allyN = 0;
  let meMoving = false;                       // 내가 움직이는 중 (멈추는 순간 동료들이 자리를 새로 뽑는다)
  // ── 내 영역 중심 — 근접 영역(동료 자리)·지배 영역(복귀 경계)은 나를 중심으로 하되, 내가 움직이는 방향으로 중심이 밀린다 (v110) ──
  //   두 원은 중심을 같이 쓰고, 최대 근접 영역 반지름의 절반(약 2.05칸)까지만 밀린다 → 나는 늘 두 원 안. 공격 지배 거리·명령 받는 범위도 이 중심.
  //   움직이면 그 방향 최대 자리까지 2.5초, 멈추면 나에게로 7초 (가속·감속, 출렁임 없음). 돌아오다 다시 움직이면 바로 그 방향으로.
  const AREA_SHIFT = NEAR / 2;         // 최대로 밀리는 거리 = 근접 영역 반지름의 절반 (약 2.05칸) — 두 원 다 이만큼 (v111)
  const AREA_GO = 4.74 / 2.5;          // 움직일 때 스프링 세기 — 2.5초에 거의 다(95%) 밀린다
  const AREA_BACK = 4.74 / 7;          // 멈췄을 때 — 7초에 거의 다 돌아온다
  const areaOff = new THREE.Vector2(), areaVel = new THREE.Vector2();   // 나 → 영역 중심, 그 움직이는 속도
  let areaMoving = false;              // 영역 중심이 아직 움직이는 중 (동료가 자리를 계속 따라가게)
  const areaX = () => me.foot.x + areaOff.x, areaZ = () => me.foot.z + areaOff.y;
  function updateArea(dt) {
    const v = me.vel, sp = Math.hypot(v.x, v.y), go = sp > 0.3 && me.mode !== 'dead';
    const shift = AREA_SHIFT * armyK;         // 근접 영역이 커진 만큼 더 밀린다 (v122)
    const tx = go ? v.x / sp * shift : 0, tz = go ? v.y / sp * shift : 0, w = go ? AREA_GO : AREA_BACK;
    areaVel.x += (w * w * (tx - areaOff.x) - 2 * w * areaVel.x) * dt;   // 임계 감쇠 스프링 (카메라와 같은 방식)
    areaVel.y += (w * w * (tz - areaOff.y) - 2 * w * areaVel.y) * dt;
    areaOff.x += areaVel.x * dt;
    areaOff.y += areaVel.y * dt;
    const l = areaOff.length();
    if (l > shift) areaOff.multiplyScalar(shift / l);   // 반지름의 절반을 넘지 않게
    areaMoving = areaVel.length() > 0.05;
  }

  function assignSlots() {
    const allies = bodies.filter((b) => b.kind === 'ally');
    const n = allyN = allies.length;
    if (!n) return;
    const now = allies.map((b) => Math.atan2(b.foot.z - areaZ(), b.foot.x - areaX()));   // 영역 중심 기준 방향
    const order = allies.map((_, i) => i).sort((i, j) => now[i] - now[j]);
    let sx = 0, sy = 0;                       // 지금 자리에서 가장 덜 움직이게 돌리는 각
    order.forEach((i, k) => { const off = now[i] - (k / n) * Math.PI * 2; sx += Math.cos(off); sy += Math.sin(off); });
    const base = Math.atan2(sy, sx);
    const half = Math.PI / n * SLOT_SPREAD;   // 칸이 좁아졌으면 지금 자리도 칸 안으로
    order.forEach((i, k) => {
      const b = allies[i];
      b.slotA = base + (k / n) * Math.PI * 2;
      b.slotOff = Math.max(-half, Math.min(half, b.slotOff));
    });
  }

  // 새 자리 = 맡은 방향 칸 안 아무 방향 + 근접 거리 ±50% 아무 거리 (내가 멈출 때, 복귀 명령 때)
  function freshSlot(z) {
    z.slotOff = (Math.random() * 2 - 1) * Math.PI / Math.max(1, allyN) * SLOT_SPREAD;
    z.slotK = rand(0.5, 1.5);
  }

  // 자리 = 내 위치 + 자리 방향으로 자리 거리만큼 (나와 같이 움직인다).
  // 나와 같은 공간 안으로 당긴다 — 내가 건물 안이면 그 건물 안(벽에서 0.7칸), 밖이면 건물 밖(벽에서 0.7칸)
  const slotV = new THREE.Vector2();
  function slotOf(z) {
    const r = z.slotK * NEAR * armyK;          // 자리 거리 — 부대가 커지면 같이 넓어진다 (v122)
    let x = areaX() + Math.cos(z.slotA + z.slotOff) * r, y = areaZ() + Math.sin(z.slotA + z.slotOff) * r;   // 영역 중심 둘레 (v110)
    const B = me.space, m = 0.7;
    if (B) { x = Math.max(B.x0 + m, Math.min(B.x1 - m, x)); y = Math.max(B.z0 + m, Math.min(B.z1 - m, y)); }
    else for (const C of buildings) {
      if (x <= C.x0 - m || x >= C.x1 + m || y <= C.z0 - m || y >= C.z1 + m) continue;
      if (x > C.x0 && x < C.x1 && y > C.z0 && y < C.z1) {   // 근접 영역이 건물 안까지 걸치면 그 자리는 건물 안 — 동료가 문으로 들어간다 (v148)
        x = Math.max(C.x0 + m, Math.min(C.x1 - m, x)); y = Math.max(C.z0 + m, Math.min(C.z1 - m, y));
        break;
      }
      const l = x - (C.x0 - m), r = C.x1 + m - x, u = y - (C.z0 - m), w = C.z1 + m - y, k = Math.min(l, r, u, w);   // 가장 가까운 벽 바깥으로
      if (k === l) x = C.x0 - m; else if (k === r) x = C.x1 + m; else if (k === u) y = C.z0 - m; else y = C.z1 + m;
    }
    if (!B) for (const O of carObs) {         // 서 있는 경찰차 위에 자리가 걸리면 차 밖으로 (v139)
      const dx = x - O.x, dz = y - O.z, d = Math.hypot(dx, dz), R = O.r + BODY + 0.6;   // 길 찾기가 돌아가는 원보다 살짝 밖
      if (d >= R) continue;
      if (d > 1e-6) { x = O.x + dx / d * R; y = O.z + dz / d * R; } else x = O.x + R;
    }
    return slotV.set(x, y);
  }

  // 동료 좀비가 지배 거리 밖에 1~2초 넘게 있으면 복귀 명령. 지배 거리 안에 들어오면 풀린다.
  function recallCheck(z, dt) {
    if (z.mode === 'pounce' || z.mode === 'bite') { z.outT = 0; return; }   // 습격·감염 중엔 지배 거리를 안 본다 — 끝난 뒤부터 다시 잰다 (그 전에 받은 복귀 명령은 그대로)
    if (inDomain(z)) { z.outT = 0; z.recall = false; return; }
    if (z.outT === 0) z.outLimit = rand(...RECALL_DELAY);
    z.outT += dt;
    if (!z.recall && z.outT >= z.outLimit) {
      z.recall = true;
      z.cmd = null;                           // 복귀 명령을 받으면 수행 중이던 명령은 끝난다 (v102)
      z.cmdWall = null;
      freshSlot(z);                           // 돌아갈 자리도 새로 뽑는다 — 들어온 뒤 타겟이 없으면 그 자리까지 온다
      z.phase = 'track';
    }
  }

  // 복귀 명령 중: 어떤 시민도 안 보고 자기 자리로 간다
  function goSlot(z, dt) {
    const s = slotOf(z);
    steer(z.vel, toward(z, s.x, s.y, z.speed), ACCEL * dt);
  }

  // 타겟이 없는 동료 좀비
  //   추적: 내가 움직이는 동안, 그리고 내가 멈춘 뒤 새 자리에 닿을 때까지 — 자기 자리를 실시간으로 따라간다
  //         (내 움직임 + 자리 쪽으로. 뛰던 속도 그대로, 닿기 직전에만 살짝 줄인다)
  //   배회: 새 자리에 닿으면 그 근처를 천천히 걷다 서기를 반복한다. 내가 다시 움직이면 추적.
  function allyIdle(z, dt) {
    if (meMoving || areaMoving) z.phase = 'track';   // 나나 영역 중심이 움직이는 동안은 자리를 따라간다
    if (z.phase === 'track') {
      const sl = slotOf(z), dx = sl.x - z.foot.x, dz = sl.y - z.foot.z, d = Math.hypot(dx, dz);
      const w = via(z, sl.x, sl.y);
      if (w.x !== sl.x || w.y !== sl.y) {     // 벽이 가로막으면(다른 공간·건물 너머) 길 찾기대로 간다 — 내 움직임은 안 보탠다
        steer(z.vel, toward(z, sl.x, sl.y, z.speed), ACCEL * dt);
        return;
      }
      const toSlot = Math.min(z.speed, d * 3);
      const walk = d > 0.05 ? toSlot / d : 0;
      const mv = me.mode === 'free' ? me.vel : NO_INPUT;   // 내가 덮치러 튀어 나가는 건 따라 하지 않는다
      wantV.set(mv.x + dx * walk, mv.y + dz * walk);
      const s = wantV.length();
      if (s > z.speed) wantV.multiplyScalar(z.speed / s);
      steer(z.vel, wantV, ACCEL * dt);
      if (!meMoving && !areaMoving && d < 0.3) {   // 새 자리에 도착 (영역 중심도 멈췄다) → 배회
        z.phase = 'wander';
        z.home.set(z.foot.x, z.foot.z);
        z.goal = null;
        z.timer = rand(...IDLE_TIME);
      }
      return;
    }
    if (z.goal) {                             // 배회: 도착한 자리 근처 한 곳으로 천천히 걸어간다
      const gx = z.goal.x - z.foot.x, gz = z.goal.y - z.foot.z, g = Math.hypot(gx, gz);
      if (g < 0.1) { z.goal = null; z.timer = rand(...IDLE_TIME); steer(z.vel, wantV.set(0, 0), ACCEL * dt); }
      else { const s = Math.min(ALLY_WALK, g * 3); steer(z.vel, wantV.set(gx / g * s, gz / g * s), ACCEL * dt); }
    } else {                                  // 배회: 서 있다가 근처 다음 곳을 고른다
      steer(z.vel, wantV.set(0, 0), ACCEL * dt);
      if ((z.timer -= dt) <= 0) {
        const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * WANDER_R;
        const gx = z.home.x + Math.cos(a) * r, gz = z.home.y + Math.sin(a) * r;
        if (freeSpot(gx, gz, z.space)) z.goal = new THREE.Vector2(gx, gz);
        else z.timer = rand(...IDLE_TIME);    // 벽 너머·벽 바로 옆이면 이번엔 그대로 서 있는다
      }
    }
  }

  function updateZombie(z, dt) {
    if (z.knockT > 0) { knockStep(z, dt); return; }
    const commanding = z === me && cmdPid !== null;   // 명령키를 누르고 있는 동안 주인공은 가만히 선다 — 이동·사냥 안 함 (v107. 하던 습격·감염은 마저 한다)
    const touching = z === me && pid !== null && !commanding;   // 손가락을 대고 있다 (조종하는 나만)
    const input = z === me && !commanding ? move : NO_INPUT;
    const aimed = z.aim;                         // 지난 걸음에 빨간 테두리를 띄운 시민
    z.aim = null;
    z.engaging = null;                           // 이번 걸음에 HP 있는 시민을 공격 대상으로 잡으면 fight()가 다시 채운다
    if (z !== me) cmdTick(z);                    // 명령 시간이 다 됐으면 풀고, 아니면 지배 거리 배율·부채꼴 각도 갱신
    if (z.atkT > 0) z.atkT -= dt;
    if (z.skipT > 0) z.skipT -= dt;
    if ((z.tick -= dt) <= 0) {                   // 시민처럼 틱마다 타겟을 새로 뽑는다 = 인지거리 안 가장 가까운 시민 (때리던 상대도 더 가까운 시민이 있으면 바뀐다)
      z.tick += ZOMBIE_TICK;
      const old = z.pick;
      if (old && crowd.has(old)) crowd.set(old, crowd.get(old) - 1);   // 내 몫을 빼고 다시 고른다
      z.pick = nearestCitizen(z, z.sense);
      if (z.pick && z.pick.hp > 0) crowd.set(z.pick, (crowd.get(z.pick) || 0) + 1);
    }
    if (z !== me) recallCheck(z, dt);            // 감염 중에도 시간은 센다 — 물기는 끝까지, 끝나면 바로 복귀
    const p = z.pick;
    const ready = huntable(z, p) && Math.hypot(p.foot.x - z.foot.x, p.foot.z - z.foot.z) <= z.attack ? p : null;   // 덮치기 가능 = 타겟이 덮침 거리 안
    let jump = null;                             // 동료가 무조건 먼저 덮칠 시민 (아래에서 정한다)
    if (z.mode === 'bite') {
      if (input.x || input.y) endBite(z, false);   // 움직이면 감염 포기
      else if ((z.biteT -= dt) <= 0) endBite(z, true);
      else z.hp = Math.min(z.maxHp, z.hp + z.maxHp * (z === me ? MY_BITE_HEAL : BITE_HEAL) * dt);   // 무는 중 체력 회복 (나는 1.3배)
    }
    if (z.mode === 'pounce') {

      else if (d - BITE_GAP <= z.speed * POUNCE * dt + 0.02) startBite(z, t);   // 이번 걸음에 닿으면 바로 문다 (도망치는 상대도 놓치지 않게)
      else z.vel.set(dx / d * z.speed * POUNCE, dz / d * z.speed * POUNCE);   // 덮치기는 가감속 없이 확 튀어 나간다
    }
    if (z.mode === 'free') {
      if (touching) {
        steer(z.vel, wantV.set(input.x * z.speed, input.y * z.speed), ACCEL * dt);   // 조이스틱 오른쪽 = 바닥 오른쪽, 아래 = 카메라 쪽
        z.aim = ready;                             // 지금 손을 떼면 덮칠 시민 → 빨간 테두리
      } else if (commanding) {
        steer(z.vel, wantV.set(0, 0), ACCEL * dt);   // 명령 중: 그냥 선다 (아이들)
      } else if (z !== me && (jump = pounceable(z))) {   // 동료: 덮칠 수 있으면 무조건 먼저 (복귀 명령 중이어도)
        unclaim(z);
        z.phase = 'track';
        z.mode = 'pounce'; z.target = jump; z.pounceT = 1; jump.marked = true;
      } else if (z !== me && z.recall) {
        unclaim(z);
        goSlot(z, dt);                             // 복귀 명령 — 지배 거리 안에 들어올 때까지 유혹 무시
      } else {
        const t = aimed && aimed.kind === 'citizen' && !aimed.marked && aimed.space === z.space ? aimed : ready;   // 테두리가 떠 있던 시민은 무조건 노린다 (문 밖으로 나가 버렸으면 빼고)
        const prey = huntable(z, p) ? p : null;
        const go = t || prey;
        if (z !== me) {
          if (go) z.phase = 'track';               // 동료 좀비: 사냥이 끝나면 자기 자리로 간 다음 배회
          if (prey && !t && prey.hp <= 0) claimPrey(z, prey); else unclaim(z);   // HP 0 시민을 쫓는 동안 찜 (덮치면 marked가 대신한다)
        }
        if (go && go.hp > 0) fight(z, go, dt);     // HP가 남았으면 가서 때린다
        else if (t && dashOk(z, t)) { z.mode = 'pounce'; z.target = t; z.pounceT = 1; t.marked = true; }
        else if (prey || t) { const q = prey || t; steer(z.vel, toward(z, q.foot.x, q.foot.z, z.speed * RAID), ACCEL * dt); }   // 습격: 타겟이 인지거리 안 → 습격 속도로 자동으로 달려간다 (방금 덮쳐서 못 닿은 시민이면 1초 동안은 덮치지 않고 다가간다)
        else if (z === me) steer(z.vel, wantV.set(0, 0), ACCEL * dt);   // 나는 타겟이 없으면 살짝 미끄러지며 선다
        else if (z.cmd) cmdRun(z, z.cmd, dt);    // 명령 중: 보이는 타겟이 없으면 명령 방향으로 달린다
        else allyIdle(z, dt);
      }
    }
    if (!z.engaging) z.attacking = false;     // 이번 걸음에 싸우지 않았다 (습격·감염·복귀·추적·배회) = 공격 중 아님
  }

  // 겹친 둘을 떼어 놓는다. 무는 중인 둘은 꿈쩍 않고, 부딪힌 쪽만 밀려난다.
  // 무게: 밀고 들어간 쪽(상대 쪽으로 움직이던 쪽)이 거의 다 물러나고, 밀린 쪽은 조금만 밀려난다. 둘 다 같은 빠르기로 마주 오면 반반.
  // 미는 힘(force): 센 쪽이 밀면 상대가 그만큼 더 비켜나고, 약한 쪽이 밀면 센 쪽은 그만큼 덜 밀린다 (나만 MY_FORCE배)
  // 덮치는 중인 좀비는 다른 몸을 통과한다 (벽은 그대로 막힌다)
  const byX = [];
  function collide(dt) {
    const give = 0.5 / WEIGHT;                 // 밀린 쪽이 비켜 주는 몫 (WEIGHT 1 = 반반 = 예전) — 힘이 같을 때
    byX.length = 0;                            // x 순서로 늘어놓고, x 차이가 몸 두 개 폭보다 크면 그 뒤는 안 본다 (지도가 커져서, v121)
    for (const b of bodies) byX.push(b);
    byX.sort((p, q) => p.foot.x - q.foot.x);
    const reach = MY_BODY + BODY + 0.05;
    for (let i = 0; i < byX.length; i++) {
      const a = byX[i];
      for (let j = i + 1; j < byX.length; j++) {
        const b = byX[j];
        if (b.foot.x - a.foot.x > reach) break;
        if (a.fixed && b.fixed) continue;
        if (a.target === b || b.target === a) continue;   // 덮치는 중·무는 중엔 둘이 겹친다
        if (a.mode === 'pounce' || b.mode === 'pounce') continue;   // 덮치는 동안은 아무 몸이나 통과
        const dx = b.foot.x - a.foot.x, dz = b.foot.z - a.foot.z, d = Math.hypot(dx, dz), min = a.r + b.r;
        if (d >= min) continue;
        const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0;
        let push = min - d;
        if (a.split === b) push = Math.min(push, SPLIT * dt);   // 물기가 끝난 둘은 천천히 떨어진다
        let ka = 0.5;                            // a가 물러나는 몫 (나머지는 b)
        if (a.fixed) ka = 0;
        else if (b.fixed) ka = 1;
        else {
          const pa = Math.max(0, a.vel.x * nx + a.vel.y * nz), pb = Math.max(0, -(b.vel.x * nx + b.vel.y * nz));   // 서로 상대 쪽으로 움직이던 빠르기
          const yb = Math.min(1, give * a.force / b.force), ya = Math.min(1, give * b.force / a.force);   // a가 밀 때 b가 비켜나는 몫, b가 밀 때 a가 비켜나는 몫
          if (pa + pb > 1e-6) ka = (pa * (1 - yb) + pb * ya) / (pa + pb);
        }
        const kb = 1 - ka;
        a.foot.x -= nx * push * ka;
        a.foot.z -= nz * push * ka;
        b.foot.x += nx * push * kb;
        b.foot.z += nz * push * kb;
      }
    }
  }

  // ── 시야 — 좀비마다 자기 인지거리만큼 둥글게 보이고, 벽에 가린 곳은 안 보인다. 모든 좀비 시야를 합쳐서 보여 준다.
  //    시야 밖은 어둡게 덮고, 거기 있는 시민·경찰은 안 그린다. 지붕이 덮인 건물(좀비가 없는 건물) 안 사람도 안 보인다 ──
  const FOG = 0.85 * 0.8;   /* v141에 20% 옅게 (0.85 → 0.68) */ //            // 시야 밖 어둠 진하기 (1 = 완전 검정)
  const VIEW_RAYS = 120;       // 시야 둘레를 이만큼 나눠 벽까지 거리를 잰다 (벽 끝 모서리 쪽은 따로 더 쏜다)
  const MAX_TRI = 60000;
  const visGeo = new THREE.BufferGeometry();
  const visPos = new Float32Array(MAX_TRI * 9);
  visGeo.setAttribute('position', new THREE.BufferAttribute(visPos, 3));
  const visMask = new THREE.Mesh(visGeo, new THREE.MeshBasicMaterial({   // 시야 자리에 스텐실 1을 찍는다 (색은 안 칠한다)
    colorWrite: false, depthWrite: false, depthTest: false, side: THREE.DoubleSide,

  }));

  visMask.renderOrder = -5;
  scene.add(visMask);
  const fog = new THREE.Mesh(new THREE.PlaneGeometry(GROUND, GROUND).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({   // 스텐실 1이 아닌 곳만 어둡게
    color: 0x0b0b0d, transparent: true, opacity: FOG, depthWrite: false, depthTest: false,
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc, stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp,
  }));
  fog.renderOrder = -0.52;     // 바닥·지붕·벽 위, 캐릭터 밑
  fog.frustumCulled = false;
  scene.add(fog);
  // 시야를 막는 벽 = 건물마다 벽 두께까지 친 바깥 네모와 안쪽 네모 (문도 시야는 막는다 — 밖에서 안, 안에서 밖이 안 보인다)
  const sightWalls = [], sightCorners = [];
  for (const B of buildings) for (const k of [WALL / 2, -WALL / 2]) {
    const x0 = B.x0 - k, x1 = B.x1 + k, z0 = B.z0 - k, z1 = B.z1 + k;
    sightWalls.push([x0, z0, x1, z0], [x1, z0, x1, z1], [x0, z1, x1, z1], [x0, z0, x0, z1]);
    sightCorners.push([x0, z0], [x1, z0], [x1, z1], [x0, z1]);
  }
  const rayAngles = [];
  function drawVision(eyes) {
    let n = 0;
    for (const z of eyes) {
      const x = z.foot.x, y = z.foot.z, R = z.sense;
      const near = sightWalls.filter(([ax, az, bx, bz]) => Math.max(ax, bx) >= x - R && Math.min(ax, bx) <= x + R && Math.max(az, bz) >= y - R && Math.min(az, bz) <= y + R);   // 시야 안에 걸치는 벽만 (지도가 커져서, v121)
      rayAngles.length = 0;
      for (let k = 0; k < VIEW_RAYS; k++) rayAngles.push(k / VIEW_RAYS * Math.PI * 2);
      for (const [ex, ez] of sightCorners) {      // 벽 끝을 스치는 방향 — 가장자리가 반듯하게
        if (Math.hypot(ex - x, ez - y) > R + 0.5) continue;
        const a = (Math.atan2(ez - y, ex - x) + Math.PI * 2) % (Math.PI * 2);   // 0~2π로 맞춰야 순서대로 이어진다
        rayAngles.push(a - 1e-4, a + 1e-4);
      }
      rayAngles.sort((a, b) => a - b);
      let px = 0, pz = 0, fx = 0, fz = 0;
      for (let i = 0; i <= rayAngles.length; i++) {
        let qx, qz;
        if (i < rayAngles.length) {
          const a = rayAngles[i], dx = Math.cos(a), dz = Math.sin(a), hit = wallRay(x, y, dx, dz, R, near);
          const d = hit;
          qx = x + dx * d; qz = y + dz * d;
        } else { qx = fx; qz = fz; }

  function seen(b, eyes) {                    // 좀비 하나라도 인지거리 안에서 벽에 안 가리고 보고 있나 (지붕 덮인 건물 안이면 안 보인다)
    if (b.space && !b.space.open) return false;
    for (const z of eyes) {
      if (Math.hypot(b.foot.x - z.foot.x, b.foot.z - z.foot.z) > z.sense + RADIUS) continue;

  function draw(dt) {

        const k = b.lungeT < LUNGE_IN ? b.lungeT / LUNGE_IN : Math.max(0, 1 - (b.lungeT - LUNGE_IN) / LUNGE_OUT);

      if (b.kind !== 'citizen') continue;
      if (b.tracer) {                         // 경찰이 쏜 노란 선 — 두 원 가운데를 잇고, 흐려지며 사라진다

    if (!c) return;
    const e = clock - c.t0;
    if (e >= CMD_TIME) { z.cmd = null; z.cmdWall = null; freshSlot(z); z.phase = 'track'; return; }   // 끝 → 평소처럼 내 주변 자리로
    c.mul = CMD_DOMAIN;                       // 7초 동안 그대로 — 끝나면 위에서 명령을 풀어 바로 1배
    c.cosHalf = Math.cos((CMD_ARC + (360 - CMD_ARC) * e / CMD_TIME) * Math.PI / 360);
  }
  function inSight(z, b) {                    // b가 z의 인지 범위 안인가 — 평소엔 인지거리 원, 명령 중엔 1.8칸 원 + 명령 방향 부채꼴
    const dx = b.foot.x - z.foot.x, dz = b.foot.z - z.foot.z, d = Math.hypot(dx, dz), c = z.cmd;
    if (d > z.sense) return false;
    if (!c || d <= CMD_NEAR) return true;
    return dx * c.dx + dz * c.dz >= d * c.cosHalf;   // 명령 방향과 이루는 각이 부채꼴 반각 안
  }
  function wallHit(x, z, dx, dz, max) {      // 이 방향으로 max 안에 처음 닿는 벽 (없으면 null)
    let best = max, hit = null;
    for (const w of walls) {
      const [ax, az, bx, bz] = w, ex = bx - ax, ez = bz - az, den = dx * ez - dz * ex;
      if (Math.abs(den) < 1e-9) continue;
      const t = ((ax - x) * ez - (az - z) * ex) / den, s = ((ax - x) * dz - (az - z) * dx) / den;
      if (t > 0 && t < best && s >= 0 && s <= 1) { best = t; hit = w; }
    }
    return hit;
  }
  function cmdRun(z, c, dt) {                 // 명령 방향으로 달린다 — 벽에 막히면 벽을 따라 (명령 방향에 가까운 쪽, 정면이면 벽 끝이 가까운 쪽)
    let wx = c.dx, wz = c.dz;
    const look = z.r + 0.35;
    const hit = wallHit(z.foot.x, z.foot.z, wx, wz, look);
    if (hit) {
      const [ax, az, bx, bz] = hit, L = Math.hypot(bx - ax, bz - az), tx = (bx - ax) / L, tz = (bz - az) / L;
      if (z.cmdWall !== hit) {                // 새 벽에 막혔다 → 따라갈 쪽을 정한다
        z.cmdWall = hit;
        const along = c.dx * tx + c.dz * tz;
        if (Math.abs(along) > 0.2) z.cmdSlide = Math.sign(along);
        else {
          const toB = (bx - z.foot.x) * tx + (bz - z.foot.z) * tz, toA = (z.foot.x - ax) * tx + (z.foot.z - az) * tz;
          z.cmdSlide = toB < toA ? 1 : -1;
        }
      }
      wx = tx * z.cmdSlide; wz = tz * z.cmdSlide;
      if (wallHit(z.foot.x, z.foot.z, wx, wz, look)) { z.cmdSlide = -z.cmdSlide; wx = -wx; wz = -wz; }   // 구석 → 반대쪽으로
    } else z.cmdWall = null;
    steer(z.vel, wantV.set(wx * z.speed, wz * z.speed), ACCEL * dt);
  }
  function updateCmd(dt) {                    // 걸음마다: 화살표를 내 발밑에 붙이고, 카메라 옮김을 목표 쪽으로 부드럽게, 쿨타임 표시
    const on = cmdPid !== null;
    const cd = Math.ceil(Math.max(0, cmdReadyAt - clock) / CMD_COOL * 100) / 100;   // 남은 쿨타임 (1 → 0)
    if (cd !== cmdCdShown) { cmdCdShown = cd; cmdEl.style.setProperty('--cd', cd); }
    cmdArrow.visible = on;
    if (on) {
      cmdArrow.position.set(me.foot.x, 0.045, me.foot.z - RADIUS / SIN_P);   // 회전 중심 = 화면에 보이는 내 원의 한가운데 (발끝보다 이만큼 북쪽 바닥이 원 가운데와 겹쳐 보인다) — v99
      cmdArrow.rotation.y = -Math.atan2(cmdDir.y, cmdDir.x);
    }
    const tx = on ? cmdDir.x * CMD_PEEK : 0, tz = on ? cmdDir.y * CMD_PEEK : 0;   // 목표: 누르는 동안 화살표 쪽 4칸, 놓으면 제자리
    const w = on ? CMD_W : CMD_W_BACK;       // 갈 때 1.4초, 돌아올 때 2.8초
    camVel.x += (w * w * (tx - camOff.x) - 2 * w * camVel.x) * dt;     // 임계 감쇠 스프링 — 멀면 붙는 힘, 빠르면 브레이크
    camVel.y += (w * w * (tz - camOff.y) - 2 * w * camVel.y) * dt;
    camOff.x += camVel.x * dt;
    camOff.y += camVel.y * dt;
  }

  // ── 판 깔기: 나는 가운데, 활동 영역마다 시민 몇 명, 건물마다 안에 사람들 ──
  function spawn() {
    for (const b of bodies) {
      scene.remove(b.mesh);
      b.mesh.material.dispose();
      if (b.icon) { scene.remove(b.icon); b.icon.material.dispose(); }
      if (b.gauge) scene.remove(b.gauge);
      if (b.hpBar) scene.remove(b.hpBar);
      if (b.tracer) { scene.remove(b.tracer); b.tracer.material.dispose(); }
    }
    bodies.length = 0;
    dying.length = 0;
    camOff.set(0, 0);
    areaOff.set(0, 0);
    areaVel.set(0, 0);
    camVel.set(0, 0);
    camDist = DIST;
    explored.fill(0);                         // 미니맵 — 새 판은 다시 다 까맣게
    mmDirty = true;
    mmT = 0;
    deaths = stars = dispatchT = 0;
    stationDown = false;
    lastIncident = null;
    for (const car of cars) scene.remove(car.g);
    cars.length = 0;
    carObs = [];
    for (const S of stations) { S.down = false; S.found = false; S.roof.material = stationRoofMat; }   // 미니맵에서 다시 '발견 전'으로
    cmdReadyAt = 0;
    for (const r of rings) scene.remove(r);
    rings.length = 0;
    note.hidden = true;

    me = addBody('me', 0, 0);
    me.mode = 'free';
    me.target = null;
    me.maxHp = MY_HP;
    me.hp = MY_HP * MY_START_HP;
    me.r = MY_BODY;                          // 내 부딪힘은 작고 미는 힘은 세다 — 동료들 사이에 덜 갇히게
    me.force = MY_FORCE;
    addHpBar(me, hpOurMat);
    me.hpBar.scale.set(1.2, 3, 1);   // v136에 가로 20% 늘림   // v76에 1.5배 더 두껍게 (늘 떠 있다)                    // 내 체력바는 두 배 두껍고, 다른 바·표시보다 늘 위에 그린다 (섞여도 보이게)
    for (const m of me.hpBar.children) m.renderOrder += UI_ME - UI;   // 내 체력바 = 내 UI 층 (다른 UI보다 위)
    me.sense = SIGHT * rand(0.9, 1.1);       // 좀비 인지거리 = 시민의 시야
    me.speed = MY_SPEED;                     // 이동 속도 (동료와 같다)
    me.attack = ATTACK;
    me.tick = 0;
    me.pick = null;
    const placeOut = (area) => {            // 영역 안 빈 자리 — 내 시작 자리에서 SAFE_R 밖, 다른 사람과 1.2칸 넘게 (못 찾으면 null)
      for (let t = 0; t < 80; t++) {
        const g = pickGoal(area);
        if (Math.hypot(g.x - me.foot.x, g.y - me.foot.z) < SAFE_R) continue;
        if (bodies.some((b) => Math.hypot(b.foot.x - g.x, b.foot.z - g.y) < 1.2)) continue;
        return g;
      }
      return null;
    };
    for (const [ox, oz] of BLOCKS) GROUPS.forEach((kinds, i) => {   // 동네마다 시민 묶음 10개 (v121)
      if (!kinds) return;                     // 빈 묶음 — 영역 테두리도 안 그린다 (다른 묶음 자리는 그대로)
      const a = i / GROUPS.length * Math.PI * 2, cx = ox + Math.sin(a) * GROUP_DIST, cz = oz - Math.cos(a) * GROUP_DIST;   // 그 동네 가운데에서 북쪽(-z)부터 시계 방향
      const area = square(cx, cz);
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(cx, 0.01, cz);
      ring.renderOrder = -1;
      scene.add(ring);
      rings.push(ring);
      for (const k of kinds) {
        const g = placeOut(area);
        if (g) addCitizen(g.x, g.y, area, GROUP_TYPE[k]);
      }
    });
    for (const B of buildings) {             // 건물 사람들 — 활동 영역 = 그 건물 안
      for (const [k, n] of Object.entries(B.kinds)) for (let i = 0; i < n; i++) {
        let g = pickGoal(B);
        for (let t = 0; t < 30 && bodies.some((b) => Math.hypot(b.foot.x - g.x, b.foot.z - g.y) < 1.2); t++) g = pickGoal(B);
        addCitizen(g.x, g.y, B, GROUP_TYPE[k]).home = B;
      }
    }
    buildings.forEach((B, bi) => {           // 시민 건물 둘레 — 자리는 랜덤 (v115, v118에 인원 절반)
      if (B.station) return;
      const ring = { x0: B.x0 - 6, z0: B.z0 - 6, x1: B.x1 + 6, z1: B.z1 + 6 };   // 건물 둘레 6칸 (건물 안은 pickGoal이 뺀다)
      for (const type of AROUND_MIX(B.local)) {
        const g = placeOut(ring);
        if (g) addCitizen(g.x, g.y, ring, type);
      }
    });
    for (const [ox, oz] of BLOCKS) for (const [px, pz] of PATROL_AT) {   // 길거리 순찰 경찰 — 동네마다 2명씩, 지도 전체 10명. 자기 자리 둘레만 배회하고 출동·추적은 안 한다 (v134)
      const area = { x0: ox + px - 4, z0: oz + pz - 4, x1: ox + px + 4, z1: oz + pz + 4 };
      const g = placeOut(area);
      if (!g) continue;
      const c = addCitizen(g.x, g.y, area, 'police');
      c.post = area;
      c.area = area;
      enterNormal(c);
    }
    for (const S of stations) {               // 경찰서마다 경찰 — 안에 15명 상주, 둘레에 10명·앞마당에 5명 배회. 출동하지 않는다
      S.residents = [];
      const cx = (S.x0 + S.x1) / 2;
      const ring = { x0: S.x0 - 5, z0: S.z0 - 5, x1: S.x1 + 5, z1: S.z1 + 5 };   // 둘레 (건물 안은 pickGoal이 뺀다)
      const front = { x0: cx - 6, z0: S.z1 + 1.5, x1: cx + 6, z1: S.z1 + 8 };    // 앞마당 = 문 앞(남쪽)
      S.ringA = ring; S.frontA = front; S.outer = []; S.members = []; S.hurt = 0;
      for (let i = 0; i < STATION_IN + STATION_OUT + STATION_FRONT; i++) {
        const inside = i < STATION_IN, area = inside ? S : i < STATION_IN + STATION_OUT ? ring : front;
        let g = pickGoal(area);
        for (let t = 0; t < 30 && bodies.some((b) => Math.hypot(b.foot.x - g.x, b.foot.z - g.y) < 1.2); t++) g = pickGoal(area);
        const c = addCitizen(g.x, g.y, area, 'police');
        c.station = S;                        // 어느 경찰서 경찰인지
        c.area = area;
        enterNormal(c);
        if (inside) S.residents.push(c); else S.outer.push(c);
        S.members.push(c); c.lastHp = c.hp;
      }
    }
  }
  // 경찰서 호출 (v157) — 바깥 경찰(처음 3명 + 출동해 나온 경찰)이 잃은 피를 다 더해서 경찰 체력의 1/10을 넘을 때마다 한 번.
  //   호출마다 안의 경찰 1명이 (v160) 다친 경찰 자리로 뛰어나와 바깥 경찰이 된다. 안에 좀비가 있거나 안 인원이 3명 이하면 무시.
  //   싸움이 끝나 할 일이 없어진 바깥 경찰은 3명만 남기고 다시 안으로 들어간다.
  const CALL_HP = POLICE_HP / 10;
  function stationTick(S) {
    const alive = (c) => c.kind === 'citizen' && bodies.includes(c);
    S.outer = S.outer.filter(alive);
    S.residents = S.residents.filter(alive);
    for (const c of S.outer) {
      if (c.hp < c.lastHp) S.hurt += c.lastHp - c.hp;
      c.lastHp = c.hp;
    }
    for (const c of S.residents) c.lastHp = c.hp;   // 안에서 깎인 피는 안 센다
    for (const c of S.outer) if (c.sortie && !c.boosted && c.space !== S) {   // 출동한 경찰이 경찰서 건물 밖으로 나오는 순간 → 인지거리·시야 3배 (v158)
      c.boosted = true;
      if (!(c.boostT > 0)) { c.boostSense = c.sense; c.boostSight = c.sight; }
      c.boostT = SORTIE_SENSE_T;
      c.sense = c.boostSense * SORTIE_SENSE;
      c.sight = c.boostSight * SORTIE_SENSE;
    }
    while (S.hurt >= CALL_HP) {
      S.hurt -= CALL_HP;
      if (S.residents.length <= 3 || zombies.some((z) => z.space === S)) continue;   // 호출 무시
      const n = 1;   // 호출 한 번에 한 명 (v160 — 전엔 1~2명)
      for (let i = 0; i < n; i++) {
        const c = S.residents.splice(Math.floor(Math.random() * S.residents.length), 1)[0];
        S.outer.push(c);
        c.area = S.ringA;
        c.sortie = true;
        const D = S.doors[0], a = rand(-1, 1);   // 문 밖 바로 앞까지만 뛰어나온다 — 거기서부터는 3배 시야로 좀비를 찾는다 (v159: 다친 경찰 자리로 가지 않는다)
        c.calls.length = 0; c.calls.push(new THREE.Vector2(D.cx + D.nx * 2 + D.tx * a, D.cz + D.nz * 2 + D.tz * a));
      }
    }
    if (S.outer.length > STATION_OUT_MIN) for (const c of S.outer.slice()) {   // 할 일 끝난 출동 경찰 → 안으로 (바깥 3명은 남긴다)
      if (S.outer.length <= STATION_OUT_MIN) break;
      if (!c.sortie || c.calls.length || c.boostT > 0 || c.state === 'fight' || c.state === 'alert') continue;   // 늘어난 시야가 남아 있는 동안(4초)은 안 들어간다
      c.sortie = false;
      c.boosted = false;                      // 다음에 또 출동하면 다시 3배
      S.outer.splice(S.outer.indexOf(c), 1);
      S.residents.push(c);
      c.area = S;
      c.goal = pickGoal(S);
      c.back = true;
    }
  }
  document.getElementById('reset').addEventListener('click', spawn);

  let camDist = DIST;                         // 지금 카메라 거리 — 부대 크기에 맞춰 부드럽게 따라간다 (v122)
  function stepWorld(dt) {
    clock += dt;
    zombies.length = 0;
    for (const b of bodies) if (isZombie(b)) zombies.push(b);
    crowd.clear();                            // 시민마다 지금 노리는 좀비 수 (v148) — 타겟을 새로 뽑을 때마다 바로 고쳐서, 같은 순간에 뽑는 좀비끼리도 겹치지 않는다
    for (const z of zombies) if (z.pick && z.pick.kind === 'citizen' && z.pick.hp > 0) crowd.set(z.pick, (crowd.get(z.pick) || 0) + 1);
    const n = zombies.length - (isZombie(me) ? 1 : 0), k = 1 + Math.max(0, n - ARMY_FREE) * ARMY_STEP;   // 부대 크기 = 동료 수
    if (n !== armyN) { armyN = n; armyK = k; updateLegend(); }
    camDist += (DIST * armyK - camDist) * Math.min(1, dt * 2);
    const moving = me.vel.length() > 0.3;
    if (meMoving && !moving) for (const b of bodies) if (b.kind === 'ally') { freshSlot(b); b.phase = 'track'; }   // 내가 멈추면 동료는 자리를 새로 뽑고 그리로 간다
    meMoving = moving;
    updateArea(dt);                           // 영역 중심을 내 이동 방향으로 밀거나 나에게로 되돌린다
    for (const b of bodies) {                 // 걸음 전 자리·공간 — 건물 사람이 문 밖으로 나가면 그때부터 활동 영역 제한이 풀린다
      b.px = b.foot.x; b.pz = b.foot.z;
      b.space = spaceOf(b.foot.x, b.foot.z);
      if (b.home && b.space !== b.home) b.freed = true;
    }
    for (const b of bodies) if (isZombie(b)) updateZombie(b, dt);
    for (const b of bodies) if (b.kind === 'citizen') updateCitizen(b, dt);
    for (const b of bodies) {
      if (!b.fixed) { b.foot.x += b.vel.x * dt; b.foot.z += b.vel.y * dt; }
      if (b.split && (b.splitT -= dt) <= 0) b.split = null;
      if (b.lungeT >= 0) {                    // 때리는 모션 시간 — 붙는 순간 데미지
        const before = b.lungeT;
        b.lungeT += dt;
        if (before < LUNGE_IN && b.lungeT >= LUNGE_IN && b.lungeVictim) { landHit(b, b.lungeVictim, b === me ? MY_DAMAGE : DAMAGE); b.lungeVictim = null; }
        if (b.lungeT >= LUNGE_IN + LUNGE_OUT) b.lungeT = -1;
      }
    }
    for (const z of dying) killZombie(z);    // HP 0이 된 좀비 처리 (목록을 돌고 난 뒤에 지운다)
    dying.length = 0;
    updateCars(dt);                           // 경찰차 달리기·서기·내리기
    collide(dt);
    carCollide();                             // 경찰차에 겹친 몸은 밀어낸다
    for (const b of bodies) if (!b.fixed) wallCollide(b);   // 벽은 마지막에 — 서로 밀다가 벽을 넘지 않게
    dispatchTick(dt);                         // 수배 별에 따라 경찰서에서 출동
    draw(dt);
    updateStars();
    updateMinimap(dt);
    updateCmd(dt);
    place();
    renderer.render(scene, camera);
  }

  let last = 0;
  function frame(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    stepWorld(dt);
    requestAnimationFrame(frame);
  }

  function start() {
    spawn();
    new ResizeObserver(resize).observe(canvas);
    resize();
    requestAnimationFrame(frame);
    window.__rdReady = true;
  }

  window.__rd = { get me() { return me; }, bodies, spawn, fleeDir, step: stepWorld };   // 확인용 (콘솔에서 상태 보기·한 걸음씩 돌리기)
  // 내가 고쳐 올리면 열려 있는 화면이 저절로 바뀐다 — 새 버전은 판을 새로 깐다
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>

</body></html>

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>러닝데드 이동 테스트</title>
<style>
  /* 한 화면짜리 테스트 — 캔버스가 화면을 꽉 채우고, 누른 자리에만 조이스틱이 뜬다 (궁수의 전설식) */
  :root {
    --ground: #999999;                     /* 유니티 테스트 바닥 (0.6 회색) */
    --joy-fill: rgba(255, 255, 255, 0.16);
    --joy-ring: rgba(255, 255, 255, 0.7);
    --knob: rgba(255, 255, 255, 0.92);
    --label: rgba(0, 0, 0, 0.38);
    --near: #7fd4ff;                       /* 근접 거리 원 */
    --domain: #3366f2;                     /* 지배 거리 원 */
    --btn-bg: rgba(20, 22, 26, 0.5);
    --btn-fg: #ffffff;
    --note-bg: rgba(20, 22, 26, 0.82);
    --note-fg: #ffffff;
    --font: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  html { box-sizing: border-box; height: 100%; overflow: hidden; }
  body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--ground); font-family: var(--font);
    touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #stage { position: relative; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
  #view { display: block; width: 100%; height: 100%; }
  #joy {
    position: absolute; left: 0; top: 0; box-sizing: border-box; width: 124px; height: 124px; margin: -62px 0 0 -62px;
    border: 2px solid var(--joy-ring); border-radius: 50%; background: var(--joy-fill); pointer-events: none;
  }
  #knob {
    position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px;
    border-radius: 50%; background: var(--knob);
  }
  #ver {
    position: absolute; top: 8px; left: max(16px, env(safe-area-inset-left, 0px));
    font: 600 12px/1 var(--font); color: rgba(255, 255, 255, 0.6); pointer-events: none;   /* 시야 밖이 어두워서 밝은 글씨 */   /* 건물 안에서 밖이 어둡게 가려져도 읽히게 */
  }
  #legend {
    position: absolute; top: 26px; left: max(16px, env(safe-area-inset-left, 0px));
    display: flex; align-items: center; gap: 5px;
    font: 600 12px/1 var(--font); color: var(--label); pointer-events: none;
  }
  #legend i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; }
  #legend .near { background: var(--near); }
  #legend .domain { background: var(--domain); margin-left: 6px; }
  #reset {
    position: absolute; top: 6px; right: max(16px, env(safe-area-inset-right, 0px));
    padding: 7px 11px; border: 0; border-radius: 8px;
    background: var(--btn-bg); color: var(--btn-fg); font: 600 13px/1 var(--font);
    touch-action: manipulation; cursor: pointer;
  }
  #note {
    position: absolute; top: 40%; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
    padding: 12px 14px; border-radius: 10px; background: var(--note-bg); color: var(--note-fg);
    font: 600 15px/1.5 var(--font); text-align: center; word-break: keep-all;
  }
</style>

<div id="stage">
  <canvas id="view"></canvas>
  <div id="joy" hidden><div id="knob"></div></div>
  <div id="ver">v65</div>
  <div id="legend"><i class="near"></i><span id="legendNear">근접</span><i class="domain"></i><span id="legendDomain">지배</span></div>
  <div id="note" hidden></div>
</div>
<button id="reset" type="button">처음부터</button>

<script>
  // 폰에서 하얀 화면만 보이지 않게 — 불러오기 실패·실행 오류를 화면 가운데에 글로 띄운다
  (function () {
    var note = document.getElementById('note');
    var LOAD_FAIL = '3D 도구를 못 불러왔어. 인터넷 연결을 확인하고 새로고침해 줘.';
    function show(text) { note.textContent = text; note.hidden = false; }
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT') { show(LOAD_FAIL); return; }
      var m = e.message || '';
      if (m.indexOf('ResizeObserver') >= 0) return;   // 브라우저가 내는 무해한 경고
      show('오류: ' + (m || '알 수 없음'));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      show('오류: ' + ((e.reason && e.reason.message) || e.reason));
    });
    setTimeout(function () { if (!window.__rdReady) show(LOAD_FAIL); }, 10000);
  })();
</script>

<script type="module">
  import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

  // ── 값 — 감으로 바꿀 것들은 전부 여기 ──
  // 카메라
  const PITCH = 50;       // 카메라가 내려다보는 각 (유니티 카메라 X = 50)
  const FOV = 40;         // 세로 시야각 (유니티와 같음)
  const DIST = 77.175;    // 카메라 ~ 나 거리 (유닛) — v26의 51.45에서 50% 뒤로
  const SCREEN_Y = 0.40;  // 내 자리 = 화면 위에서 40% (가운데보다 살짝 위 — 아래는 엄지 자리)

  // 나 (좀비) — 감염된 시민은 동료 좀비가 되어 손 뗀 나처럼 움직인다
  const RADIUS = 0.5;     // 원 반지름 — 나·시민 전부 (지름 1유닛 = 유니티 큐브 한 변)
  const SPEED_BASE = 2.45;        // 속도 기준 (유닛/초) — 시민 속도는 이걸로 정한다
  const SPEED = SPEED_BASE * 1.2 * 1.1; // 동료 좀비 이동 속도 (v51에 10% 올림)
  const MY_SPEED = SPEED_BASE * 1.44 * 1.2 * 0.9;   // 조종하는 나
  const JOY_R = 60;       // 조이스틱 반지름 (px) — 손잡이 가운데는 이 안에서만 움직인다
  const DEAD = 8;         // 누른 자리에서 이만큼(px)은 끌어야 출발
  const ATTACK = 3.24;    // 내 덮침 거리 — 타겟이 이 안에 있어야 덮칠 수 있다 (빨간 테두리)
  const ALLY_ATTACK = ATTACK * 0.9;   // 동료 좀비 덮침 거리 = 나의 90%
  const POUNCE = 6 * 0.7; // 덮치는 속도 = 자기 이동 속도의 6배에서 v65에 30% 줄임 (4.2배), 상대를 쫓아간다
  const INFECT = 2.8;     // 감염 시간 (초) — 이만큼 물고 버티면 감염 (물린 시민 머리 위 게이지)
  const MY_INFECT = 1.2;  // 내 감염 속도 = 동료의 이만큼 배 → 내가 물면 INFECT / 1.2초 (v56)

  // 싸움 — 수비형·공격형 시민·나·동료 좀비 같음. HP가 남은 시민은 바로 못 덮치고, 때려서 0을 만든 뒤 덮친다
  const HP_MAX = 100;     // 체력 — 동료 좀비 (회복 없음)
  const MY_HP = HP_MAX * 2 * 1.5 * 1.3;   // 체력 — 조종하는 나 = 동료의 2배에서 v64에 150%, v65에 30% 더 (390, 회복 없음)
  const GUARD_HP = 200;   // 체력 — 수비형·공격형 시민
  const DAMAGE = 20;      // 공격력
  const MY_DAMAGE = DAMAGE * 3;   // 내 공격력 = 3배 (v64)
  const HIT_EVERY = 1;    // 공격 간격 (초)
  const MELEE = 1.0;      // 근접 공격 거리 (원 중심끼리, 유닛)
  const LUNGE = 0.35;     // 때릴 때 상대 쪽으로 살짝 붙는 거리 (유닛, 그림만)
  const LUNGE_IN = 0.1;   // 붙는 시간 (초) — 붙는 순간 데미지가 들어간다
  const LUNGE_OUT = 0.15; // 제자리로 돌아오는 시간 (초)
  const GUARD_REACT = 0.3;   // 수비형·공격형·경찰이 싸우기 시작해서 처음 때리기까지 (초)
  const GUARD_CLOSE = 1.5;   // 수비형은 이 거리 안에서 자기를 노리는 좀비하고만 싸운다 — 밖에서 노리는 좀비는 빼고, 아무도 없으면 도망간다
                             // 공격형은 때리던 상대가 이 밖으로 멀어지면 고정을 풀고 다시 가장 가까운 좀비를 쫓는다

  // 경찰 — 공격형과 같은데(경계 뒤 패닉 대신 덤빔) 그 자리에서 총을 쏘고, HP 0이 돼도 계속 쏜다.
  //   처음엔 없고, 사람이 감염될 때마다(경찰도 센다) 세다가 POLICE_PER명째마다 한 명씩 출동한다
  const POLICE_PER = 3;             // 시민이 이만큼 감염될 때마다 경찰 한 명 — 3번째·6번째·9번째… 감염 자리로
  const POLICE_MAX = 40;            // 경찰서에 있는 경찰 수 — 판 하나에 이만큼 나오면 더는 안 나온다 (죽어도 안 채운다)
  const POLICE_HP = 300 * 0.7;      // 체력 — v63에 30% 줄임 (210)
  const POLICE_DAMAGE = 50;         // 공격력 — v64에 50으로 (공격형 20). 사거리 = 자기 시야 (공격 간격·첫 공격까지 시간은 공격형과 같음)
  const POLICE_FROM = 60;           // 출발 자리 = 감염된 자리에서 북쪽으로 이만큼 — 그래도 화면에 보이면 화면 밖까지 더 북쪽
  const POLICE_PACE = 1.1 * 1.3;    // 경찰 이동 속도 = 시민의 이만큼 배 (출동해서 뛰기·걷기·배회 다) — v51에 1.1배, v56에 30% 더
  const POLICE_ALERT = 1 / 3;       // 경찰 경계 시간 = 시민 경계 시간(ALERT_TIME)의 이만큼 — 좀비를 보고 더 빨리 쏘기 시작한다
  const ARRIVE = 1.0;               // 사건 자리에 이만큼 다가가면 도착
  const SHOT_FLASH = 0.15;          // 쏠 때 경찰 → 좀비로 노란 선이 번쩍이는 시간 (초)

  // 동료 좀비가 나를 따르는 거리
  const NEAR = 3.24;           // 근접 거리 (유닛) — 동료 좀비 자리 거리는 이 거리의 50~150%에서 매번 새로 뽑는다
  const DOMAIN = 9;            // 지배 거리 (유닛) — 시민을 쫓다 이 밖에 1~2초 넘게 있으면 복귀 명령
  const ALLY_WALK = SPEED / 4; // 동료 좀비 배회 속도 = 이동 속도의 1/4
  const WANDER_R = 1.0;        // 자리에 도착한 뒤 그 근처를 배회하는 거리 (유닛)
  const SLOT_SPREAD = 0.8;     // 자리 방향 = 맡은 방향 칸 폭의 80% 안 (옆 동료 칸과 안 겹치게)
  const RECALL_DELAY = [1, 2]; // 지배 거리 밖에 이만큼(초) 넘게 있으면 복귀 명령 — 나갈 때마다 이 사이에서 뽑는다

  // 시민 (애니는 유니티로 옮긴 뒤 — 여기선 행동만)
  const PANIC_SPEED = SPEED_BASE * 0.9 * 0.8 * 0.9; // 패닉 = 속도 기준의 90%에서 v48에 20%, v55에 10% 더 내림 (적 이동 속도는 전부 이 값에서 나온다 — 일반·배회·공격형 추격·경찰)
  const WALK_SPEED = PANIC_SPEED / 2;   // 일반 = 패닉의 절반 — 활동 영역 밖에서 돌아갈 때
  const CIT_WANDER = WALK_SPEED / 3;    // 배회 = 일반 속도의 1/3 — 활동 영역 안을 돌아다닐 때
  const SENSE = 3.6;      // 인지거리 기준 (유닛) — 시민마다 ±10%
  const SIGHT = SENSE * 2;              // 시야 기준 = 인지거리 2배 — 시민마다 ±10%. 좀비(나 포함)의 인지거리도 이 값
  const ALERT_TIME = [1.4, 2.1];   // 경계가 이만큼 이어지면 패닉
  const PANIC_TIME = [2.352, 3.92];   // 패닉 시간 — 좀비를 볼 때마다 처음부터
  const REST_TIME = [2, 3];     // 멈춤 (헐떡임)
  const IDLE_TIME = [1, 3];     // 일반: 한 자리에 서 있는 시간
  const NOTICE = 0.6;     // 놀람 = 패닉에 들어갈 때 머리 위 ! 를 띄우는 시간 (멈칫 없이 바로 뛴다)
  const TICK = 0.2;       // 주변 감지 간격 (초)
  const LOOK = 1.5;       // 도망 방향 = 이만큼(초) 미리 뛰어 보고 고른다
  const DIRS = 32;        // 미리 뛰어 볼 방향 수

  const ACCEL = 20;       // 가감속 (유닛/초²) — 시민·나 같음. 나는 0.19초, 동료 0.15초, 패닉 시민 0.11초쯤에 최고 속도

  // 시험 판 — 시민 묶음 = 활동 영역 하나에 다섯 명. 처음 내 자리를 둘러싼 원 위에 북쪽부터 시계 방향으로 고르게 놓는다
  const AREA = 7;         // 활동 영역 한 변 (유닛)
  const GROUP_DIST = 24;  // 묶음 가운데 ~ 처음 내 자리 거리 (이웃 영역 사이 최소 약 5.3칸)
  const GROUPS = ['nnnnn', 'gggnn', 'nnnnn', 'aaaaa', 'gggaa', 'nnnnn', 'ggnnn', 'nnnnn', 'aaaaa', 'ggaaa'];   // 묶음 구성 — n 일반 · g 수비형 · a 공격형 (일반만 4, 수비+일반 2, 공격형만 2, 수비+공격 반반 2)
  const GROUP_TYPE = { n: '', g: 'guard', a: 'attacker' };

  // 건물 — 벽으로 둘러싼 네모, 문으로만 드나든다. 안에서는 밖을, 밖에서는 안을 못 본다.
  //   화면엔 내가 있는 공간만 보인다 — 밖에 있으면 건물은 지붕으로 덮여 안이 안 보이고, 건물 안에 들어가면 그 건물만 지붕이 열리고 밖은 어둡게 가린다 (동료 좀비가 어디 있든 상관없다).
  //   안 사람들의 활동 영역 = 건물 안 — 문 밖으로 나가면 풀린다
  //   x·z = 가운데, w = 가로(동서), d = 세로(남북), doors = 문이 난 벽(n 북·e 동·s 남·w 서 — 벽마다 하나, 여러 벽 가능), kinds = 사람 수 (a 공격형 · g 수비형 · n 일반)
  const BUILDINGS = [
    { x: 0, z: -11, w: 14, d: 10, doors: ['s'], kinds: { a: 4, g: 4, n: 12 } },   // 대 20명: 공격형 1/5 · 수비형 1/5 · 일반 3/5
    { x: -10, z: 8, w: 11, d: 8, doors: ['e'], kinds: { g: 6, n: 9 } },           // 중 15명: 수비형 2/5 · 일반 3/5
    { x: 10, z: 8, w: 8, d: 6, doors: ['w'], kinds: { n: 10 } },                   // 소 10명: 일반만
  ];
  const DOOR = 4;         // 문 폭 (유닛) — 문은 그 벽 한가운데. 여럿이 나란히 지나간다
  const WALL_SENSE = 1 / 4;   // 도망칠 때 벽도 좀비처럼 피한다 — 가장 가까운 벽이 인지거리의 이만큼 안에 들어오면 (구석에 몰리지 않게)
  const CORNER = 1.0;     // 패닉 중 건물 안 구석(두 벽 다 이 거리 안)에 몰리면 초패닉 — 좀비는 안 보고 문과 가까운 쪽으로 벽을 타고 돌아 문으로 나간다
  const WALL = 0.25;      // 벽 두께 (그림만 — 부딪힘은 벽 한가운데 선에서 몸 반지름만큼)

  const BODY = 0.4 * 2 / 3;   // 부딪힘 반지름 (원보다 작게 — 붙어 서면 겹쳐 보인다). v51에 1/3 줄임 — 덜 낑기게
  const WEIGHT = 3;       // 무게 — 밀고 들어간 쪽은 막히고, 밀린 쪽은 1일 때(예전)의 1/WEIGHT만큼만 밀려난다
  const MY_BODY = BODY;       // 내 부딪힘 반지름 (v52에 절반 → v61에 다른 몸과 같게 되돌림)
  const MY_FORCE = 4;         // 내 미는 힘 = 다른 몸의 4배 (v52 2배 → v61 2배 더) — 내가 밀면 상대가 그만큼 더 비켜나고, 남이 밀면 나는 그만큼 덜 밀린다
  const BITE_GAP = RADIUS;   // 물 때 두 원 중심 거리 = 반지름 → 반쯤 겹친다
  const SPLIT = 1.5;      // 물기가 끝나고 둘이 떨어지는 속도 (유닛/초)
  const ICON_H = 0.55;    // 머리 위 ? ! !!! 높이 (유닛)
  const COLOR = { me: 0x3366f2, citizen: 0xffcf33, guard: 0xff8c1a, attacker: 0xc62828, police: 0x8e24aa, ally: 0x8aa4f5, dead: 0x555555 };   // 나 = 유니티 큐브 파랑, 시민 = 노랑, 수비형 = 주황, 공격형 = 진한 빨강, 경찰 = 보라, 동료 좀비 = 연한 파랑

  const GROUND = 400;     // 바닥 크기 (유닛) — 나를 1칸 단위로 따라다닌다
  const p = PITCH * Math.PI / 180;

  const wp = new THREE.Vector2();

    for (const v of path) if (v === n - 1 || Math.hypot(pts[v][0] - px, pts[v][1] - pz) > 0.5) return wp.set(pts[v][0], pts[v][1]);   // 이미 닿은 모서리는 건너뛴다
    return wp.set(tx, tz);
  }
  function toward(b, tx, tz, speed) {        // 목적지 쪽으로 원하는 속도 (길 찾기를 거쳐서)
    const w = via(b, tx, tz), dx = w.x - b.foot.x, dz = w.y - b.foot.z, d = Math.hypot(dx, dz) || 1;
    return wantV.set(dx / d * speed, dz / d * speed);
  }

  // ── 캐릭터 — 나·동료 좀비·시민 전부 한 목록에서 부딪힌다 ──
  const bodies = [];
  const rings = [];
  let me = null;
  const isZombie = (b) => (b.kind === 'me' || b.kind === 'ally') && !b.dead;
  const note = document.getElementById('note');
  const dying = [];                           // 이번 걸음에 HP가 0이 된 좀비 (걸음 끝에 처리)

  function addBody(kind, x, z) {
    const mesh = new THREE.Mesh(circleGeo, new THREE.MeshBasicMaterial({ color: COLOR[kind], transparent: true, depthTest: false, depthWrite: false }));
    mesh.quaternion.copy(camera.quaternion);   // 늘 카메라를 정면으로 본다 — 겹치면 앞에 선 쪽이 위에 그려진다
    scene.add(mesh);
    const b = { kind, mesh, foot: new THREE.Vector3(x, 0, z), vel: new THREE.Vector2(), fixed: false, split: null, splitT: 0, hp: 0, maxHp: 0, atkT: 0, lungeT: -1 };
    b.px = x; b.pz = z;                       // 걸음 전 자리 (벽을 넘었는지 볼 때)
    b.r = BODY;                               // 부딪힘 반지름 (나만 MY_BODY)
    b.force = 1;                              // 미는 힘 (나만 MY_FORCE)
    b.space = spaceOf(x, z);                  // 들어 있는 건물 (밖이면 null) — 같은 공간끼리만 서로 본다
    bodies.push(b);
    return b;
  }

  function addCitizen(x, z, area, type) {
    const c = addBody('citizen', x, z);
    c.area = area;
    c.guard = type === 'guard';          // 수비형: HP가 있고, 맞으면 때린 좀비와 싸운다
    c.attacker = type === 'attacker';    // 공격형: 수비형과 같은데, 좀비를 보면 패닉 대신 다가와서 때린다
    c.police = type === 'police';        // 경찰: 공격형과 같은데, 그 자리에서 쏜다 — HP 0이 돼도 계속 쏜다
    if (type) {
      c.mesh.material.color.setHex(COLOR[type]);
      c.hp = c.maxHp = c.police ? POLICE_HP : GUARD_HP;
      addHpBar(c, hpFoeMat);
    }
    if (c.police) {                      // 쏠 때 번쩍이는 노란 선 (원 밑에 깔린다)
      c.tracer = new THREE.Mesh(tracerGeo, new THREE.MeshBasicMaterial({ color: 0xffe14d, transparent: true, depthTest: false, depthWrite: false }));
      c.tracer.renderOrder = -0.5;
      c.tracer.visible = false;
      scene.add(c.tracer);
      c.shotT = -1;                      // 쏜 뒤 지난 시간 (-1 = 선 없음)
      c.calls = [];                      // 들를 사건 자리 — 가장 가까운 곳부터 차례로
      c.heading = null;                  // 지금 가는 사건 자리
      c.onDuty = false;                  // 첫 출동이 끝나면(도착하거나 싸움을 시작하면) true — 그 뒤로 나는 사건을 전부 받는다
    }
    c.sense = SENSE * rand(0.9, 1.1);
    c.sight = SIGHT * rand(0.9, 1.1);
    c.flee = new THREE.Vector2();
    c.lastSeen = new THREE.Vector3();
    c.lastSeenSpeed = SPEED;
    c.tick = Math.random() * TICK;       // 감지하는 순간을 시민마다 흩어 둔다
    c.marked = false;                    // 좀비가 덮치는 중 → 머리 위 !!!
    c.arrow = new THREE.Mesh(arrowGeo, arrowMat);
    c.arrow.position.z = 0.01;           // 원 바로 앞 (카메라 쪽)
    c.mesh.add(c.arrow);
    c.icon = new THREE.Sprite(new THREE.SpriteMaterial({ map: ICONS['?'], transparent: true, depthTest: false, depthWrite: false }));
    c.icon.renderOrder = 10;
    c.icon.visible = false;
    scene.add(c.icon);
    c.iconKind = '';
    c.iconT = 0;
    c.gauge = new THREE.Group();         // 감염 게이지 (물리는 동안만 보인다)
    c.gauge.quaternion.copy(camera.quaternion);
    const track = new THREE.Mesh(gaugeTrackGeo, gaugeTrackMat);
    track.renderOrder = 10;
    c.gaugeFill = new THREE.Mesh(gaugeFillGeo, gaugeFillMat);
    c.gaugeFill.position.set(-(GAUGE_W - GAUGE_PAD * 2) / 2, 0, 0.001);
    c.gaugeFill.renderOrder = 11;
    c.gauge.add(track, c.gaugeFill);
    c.gauge.visible = false;
    scene.add(c.gauge);
    enterNormal(c);
    return c;
  }

  // ── 시민 상태: 일반 → 경계 → 패닉 → 멈춤 → 일반 (공격형은 HP가 남아 있으면, 경찰은 늘 패닉 대신 싸움) ──
  const inArea = (c) => c.foot.x >= c.area.x0 && c.foot.x <= c.area.x1 && c.foot.z >= c.area.z0 && c.foot.z <= c.area.z1;
  function pickGoal(a) {                      // 영역 안 아무 곳 — 밖 영역이면 건물 근처는 빼고
    let g;
    for (let n = 0; n < 20; n++) {
      g = new THREE.Vector2(rand(a.x0 + 0.6, a.x1 - 0.6), rand(a.z0 + 0.6, a.z1 - 0.6));
      if (a.doors || freeSpot(g.x, g.y, null)) break;
    }
    return g;
  }
  const square = (x, z) => ({ x0: x - AREA / 2, z0: z - AREA / 2, x1: x + AREA / 2, z1: z + AREA / 2 });
  const areaAround = (x, z) => spaceOf(x, z) || square(x, z);   // 그 자리 둘레 네모 — 건물 안이면 그 건물

  function enterNormal(c) {
    c.state = 'normal';
    if (c.police || c.freed) c.area = areaAround(c.foot.x, c.foot.z);   // 경찰·건물에서 빠져나온 시민은 정해진 영역이 없다 — 일반으로 돌아간 그 자리 근처를 배회
    c.goal = inArea(c) ? null : pickGoal(c.area);   // 영역 밖이면 바로 걸어서 돌아간다
    c.back = !!c.goal;                              // 돌아가는 길은 일반 속도, 영역 안 배회는 그 1/3
    c.timer = rand(...IDLE_TIME);
  }
  function enterAlert(c) { c.state = 'alert'; c.timer = rand(...ALERT_TIME) * (c.police ? POLICE_ALERT : 1); }
  function enterPanic(c, spots, quiet) {
    c.state = 'panic';
    c.panicLen = rand(...PANIC_TIME);
    c.timer = c.panicLen;
    c.notice = quiet ? 0 : NOTICE;     // 감염 실패 뒤엔 놀람 없이 바로 패닉
    c.flee.copy(fleeDir(c, spots || [{ foot: c.lastSeen, speed: c.lastSeenSpeed }]));
  }
  function enterRest(c) { c.state = 'rest'; c.timer = rand(...REST_TIME); }
  // 싸움 시작: 수비형은 맞았을 때 (첫 상대 = 때린 좀비), 공격형·경찰은 좀비를 봤을 때도 (z가 없으면 첫 걸음에 가장 가까운 좀비를 뽑는다)
  function enterFight(c, z, quiet) {
    if (c.police) {                    // 경찰: 가던 사건 자리는 싸움으로 끝낸 셈 — 싸움이 끝나면 다음 사건 자리로. 이제부터 새 사건도 받는다
      if (c.heading) { c.calls.splice(c.calls.indexOf(c.heading), 1); c.heading = null; }
      c.onDuty = true;
    }
    c.state = 'fight';
    c.foe = z || null;
    c.locked = false;                  // 공격형: 근접 거리에 붙어 때리기 시작하면 true (그 상대로 고정)
    c.atkT = GUARD_REACT;
    c.notice = quiet ? 0 : NOTICE;     // 좀비를 보고 덤빌 땐 패닉처럼 머리 위 ! (맞아서 시작하면 없음)
  }
  const charges = (c) => c.police || (c.attacker && c.hp > 0);   // 패닉 대신 덤빈다 — 공격형은 HP 0이면 일반 시민처럼 도망, 경찰은 늘
  const sees = (c, z) => z && isZombie(z) && z.space === c.space;   // 살아 있는 좀비이고 같은 공간(같은 건물 안, 또는 둘 다 밖)에 있다

  // 틱마다 주변을 본다. 좀비 = 나 + 동료 좀비 전부. 같은 공간(같은 건물 안, 또는 둘 다 밖)에 있는 좀비만 보인다
  function sense(c) {
    const reach = c.state === 'panic' ? c.sight : c.sense;   // 패닉 중엔 인지거리가 시야만큼 늘어난다
    const seen = [];
    let near = Infinity, nearZ = null;
    for (const z of bodies) {
      if (!isZombie(z) || z.space !== c.space) continue;
      const d = Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);
      if (d > c.sight) continue;
      if (d < near) { near = d; nearZ = z; c.lastSeen.copy(z.foot); c.lastSeenSpeed = z.speed; }
      if (d <= reach) seen.push(z);
    }
    if (c.state === 'panic') {
      if (cornered(c)) { enterSuper(c); return; }   // 구석에 몰렸다 → 초패닉
      if (seen.length) { c.timer = c.panicLen; c.flee.copy(fleeDir(c, seen)); }   // 볼 때마다 패닉 시간 처음부터
      else if (nearWall(c, c.sense * WALL_SENSE)) c.flee.copy(fleeDir(c, [{ foot: c.lastSeen, speed: c.lastSeenSpeed }]));   // 벽에 다가가면 마지막에 본 좀비와 그 벽을 피해 다시 고른다 (패닉 시간은 그대로)
    } else if (seen.length) {
      if (charges(c)) enterFight(c, nearZ);  // 공격형: 가장 가까운 좀비에게 덤빈다
      else enterPanic(c, seen);
    }
    else if (near <= c.sight) { if (c.state !== 'alert') enterAlert(c); }
    else if (c.state === 'alert') enterNormal(c);
  }

  // 도망 방향 = 미리 뛰어 보기. 방향마다 LOOK초 뛰어 본다고 치고(벽에 막히면 거기서 멈춘다), 좀비는 전부 자기 속도로 똑바로 쫓아온다고 친다.
  // 그동안 좀비가 가장 가까이 붙는 거리가 제일 넉넉한 방향을 고른다 (가까운 좀비일수록 점수를 크게 깎는다).
  // 건물 안에선 문 쪽으로 뚫린 방향만 멀리 뛸 수 있다 — 그쪽이 좋으면 우연히 문 밖으로 빠져나간다.
  // 가장 가까운 벽이 인지거리의 1/4 안이면 그 벽(의 가장 가까운 점)도 안 움직이는 좀비로 치고 피한다 — 구석에 몰리지 않고 사방으로 튄다
  const fleeV = new THREE.Vector2();
  function fleeDir(c, spots) {
    const wall = nearWall(c, c.sense * WALL_SENSE);
    if (wall) spots = [...spots, wall];
    const sp = c.vel.length();
    let best = -Infinity, bx = 1, bz = 0;
    for (let k = 0; k < DIRS; k++) {
      const a = (k / DIRS) * Math.PI * 2, dx = Math.cos(a), dz = Math.sin(a);
      const room = wallRay(c.foot.x, c.foot.z, dx, dz, PANIC_SPEED * LOOK + BODY) - BODY;   // 이 방향으로 벽까지 뛸 수 있는 거리
      let worst = Infinity;
      for (const z of spots) {
        for (let s = 1; s <= 4; s++) {
          const t = LOOK * s / 4, run = Math.max(0, Math.min(PANIC_SPEED * t, room));
          const m = Math.hypot(z.foot.x - c.foot.x - dx * run, z.foot.z - c.foot.z - dz * run) - z.speed * t;
          if (m < worst) worst = m;
        }
      }
      if (sp > 0.1) worst += 0.1 * (dx * c.vel.x + dz * c.vel.y) / sp;   // 뛰던 방향에 아주 조금 더 — 왔다 갔다 방지
      worst += Math.random() * 1e-3;                                       // 딱 같으면 아무 쪽이나
      if (worst > best) { best = worst; bx = dx; bz = dz; }
    }
    return fleeV.set(bx, bz);
  }

  // ── 초패닉 — 건물 안에서 패닉 중 구석에 몰리면 들어간다. 좀비가 어디 있든 안 보고, 문까지 벽을 따라 도는 길이 짧은 쪽으로 벽을 타고 돌아
  //    문으로 나간다. 문 밖으로 나가면 보통 패닉으로 돌아간다 (그 뒤로는 활동 영역 제한이 풀린 시민) ──
  const cornered = (c) => {
    const B = c.space;
    return !!B && Math.min(c.foot.x - B.x0, B.x1 - c.foot.x) < CORNER && Math.min(c.foot.z - B.z0, B.z1 - c.foot.z) < CORNER;
  };
  // 벽 따라 한 바퀴 = 벽에서 0.6칸 안쪽 네모의 둘레. 자리는 북서 모서리에서 시계 방향(북 → 동 → 남 → 서)으로 잰 거리 u로 나타낸다
  const rimOf = (B) => ({ x0: B.x0 + 0.6, z0: B.z0 + 0.6, x1: B.x1 - 0.6, z1: B.z1 - 0.6 });
  function rimU(R, x, z) {                    // 둘레에서 (x, z)에 가장 가까운 자리의 u
    const W = R.x1 - R.x0, H = R.z1 - R.z0;
    x = Math.max(R.x0, Math.min(R.x1, x)); z = Math.max(R.z0, Math.min(R.z1, z));
    const n = z - R.z0, e = R.x1 - x, s = R.z1 - z, w = x - R.x0, k = Math.min(n, e, s, w);
    return k === n ? x - R.x0 : k === e ? W + (z - R.z0) : k === s ? W + H + (R.x1 - x) : 2 * W + H + (R.z1 - z);
  }
  function rimAt(R, u) {                      // u → 둘레 위 자리
    const W = R.x1 - R.x0, H = R.z1 - R.z0, L = 2 * (W + H);
    u = ((u % L) + L) % L;
    if (u < W) return [R.x0 + u, R.z0];
    if (u < W + H) return [R.x1, R.z0 + (u - W)];
    if (u < 2 * W + H) return [R.x1 - (u - W - H), R.z1];
    return [R.x0, R.z1 - (u - 2 * W - H)];
  }
  function enterSuper(c) {
    const B = c.space, R = rimOf(B), L = 2 * (R.x1 - R.x0 + R.z1 - R.z0);
    c.door = B.doors.reduce((a, o) => Math.hypot(o.cx - c.foot.x, o.cz - c.foot.z) < Math.hypot(a.cx - c.foot.x, a.cz - c.foot.z) ? o : a);   // 가장 가까운 문
    const cw = (rimU(R, c.door.cx, c.door.cz) - rimU(R, c.foot.x, c.foot.z) + L) % L;   // 시계 방향으로 돌면 문까지 둘레 거리
    c.spin = cw <= L / 2 ? 1 : -1;            // 짧은 쪽으로 돈다
    c.state = 'super';
    c.notice = 0;
  }
  function superPanic(c) {
    const B = c.space;
    if (!B) { enterPanic(c, null, true); c.tick = 0; return; }   // 문 밖으로 나왔다 → 보통 패닉 (마지막에 본 좀비를 피해)
    const R = rimOf(B), W = R.x1 - R.x0, H = R.z1 - R.z0, L = 2 * (W + H), D = c.door;
    const up = rimU(R, c.foot.x, c.foot.z), ud = rimU(R, D.cx, D.cz);
    const left = (c.spin > 0 ? ud - up : up - ud) + L * 2;   // 문까지 남은 둘레 거리
    const rest = left % L;
    if (rest < 0.8) { toward(c, D.cx + D.nx * 1.5, D.cz + D.nz * 1.5, PANIC_SPEED); return; }   // 문 앞 → 똑바로 밖으로
    let step = rest;                          // 다음 모서리까지 (문이 더 가까우면 문 자리까지)
    for (const cu of [0, W, W + H, 2 * W + H]) {
      const d = ((c.spin > 0 ? cu - up : up - cu) + L * 2) % L;
      if (d > 0.05 && d < step) step = d;
    }
    const [tx, tz] = rimAt(R, up + c.spin * (step + 0.05));
    const dx = tx - c.foot.x, dz = tz - c.foot.z, d = Math.hypot(dx, dz) || 1;
    wantV.set(dx / d * PANIC_SPEED, dz / d * PANIC_SPEED);
  }

  // 속도를 원하는 속도 쪽으로 step만큼만 바꾼다 = 가감속
  function steer(v, want, step) {
    const dx = want.x - v.x, dz = want.y - v.y, d = Math.hypot(dx, dz);
    if (d <= step) v.copy(want);
    else { v.x += dx / d * step; v.y += dz / d * step; }
  }

  const wantV = new THREE.Vector2();
  function updateCitizen(c, dt) {
    if (c.state === 'held') { c.vel.set(0, 0); return; }   // 물리는 중엔 꼼짝 못 한다
    if (c.state === 'fight') {               // 수비형: 제자리에서 맞서 싸운다 / 공격형: 쫓아가서 때린다 / 경찰: 제자리에서 쏜다
      if (c.police) policeFight(c, dt); else if (c.attacker) attackerFight(c, dt); else guardFight(c, dt);
      return;
    }
    if (c.state === 'super') {               // 초패닉: 주변을 안 보고 벽을 타고 문으로
      wantV.set(0, 0);
      superPanic(c);
      steer(c.vel, wantV, ACCEL * dt);
      return;
    }
    if ((c.tick -= dt) <= 0) { c.tick += TICK; sense(c); }

    wantV.set(0, 0);
    if (c.state === 'alert') {
      if ((c.timer -= dt) <= 0) { if (charges(c)) enterFight(c, null); else enterPanic(c); }   // 경계가 끝나면 공격형은 패닉 대신 덤빈다
    } else if (c.state === 'panic') {
      if (c.notice > 0) c.notice -= dt;
      wantV.copy(c.flee).multiplyScalar(PANIC_SPEED);
      if ((c.timer -= dt) <= 0) enterRest(c);
    } else if (c.state === 'rest') {
      if ((c.timer -= dt) <= 0) enterNormal(c);
    } else if (c.police && c.calls.length) {                 // 경찰 출동: 배회하지 않고 들를 사건 자리 중 가장 가까운 곳으로 뛰어간다
      let k = 0, d = Infinity;
      c.calls.forEach((s, i) => { const e = Math.hypot(s.x - c.foot.x, s.y - c.foot.z); if (e < d) { d = e; k = i; } });
      const s = c.heading = c.calls[k];
      if (d < ARRIVE) {                                      // 도착 → 목록에서 지우고, 이제부터 새 사건도 받는다
        c.calls.splice(k, 1);
        c.heading = null;
        c.onDuty = true;
        if (!c.calls.length) enterNormal(c);                 // 더 들를 곳이 없으면 그 근처를 배회
      } else toward(c, s.x, s.y, Math.min(PANIC_SPEED * POLICE_PACE, d * 3));   // 건물 안이면 문으로 들어간다
    } else if (c.goal) {                                     // 일반: 영역 안 한 곳으로 걷기
      const d = Math.hypot(c.goal.x - c.foot.x, c.goal.y - c.foot.z);
      if (d < 0.1) { c.goal = null; c.back = false; c.timer = rand(...IDLE_TIME); }
      else toward(c, c.goal.x, c.goal.y, Math.min((c.back ? WALK_SPEED : CIT_WANDER) * (c.police ? POLICE_PACE : 1), d * 3));
    } else if ((c.timer -= dt) <= 0) c.goal = pickGoal(c.area);   // 일반: 서 있다가 다음 곳으로
    steer(c.vel, wantV, ACCEL * dt);
  }

  // ── 싸움 ──
  // 수비형 (처음 맞으면 싸움 시작): 상대를 한 놈 정하면 그놈하고만 싸운다 — 다른 좀비가 같이 때려도 상대를 안 바꾼다.
  //   첫 상대 = 처음 때린 좀비. 그놈이 멀어지거나(1.5칸 밖) 나를 그만 노리면(딴 데로 가거나, 멈추고 움직이면) 그때만 새로 고른다
  //   = 아주 가까이(1.5칸 안)에서 나를 공격 대상으로 잡고 있는 좀비들 중 가장 가까운 놈. 그런 좀비가 하나도 없으면 놀람 없이 도망간다.
  //   쫓지는 않고 그 자리에 서서, 상대가 근접 거리에 들어오면 1초마다 때린다.
  function guardFight(c, dt) {
    steer(c.vel, wantV.set(0, 0), ACCEL * dt);
    if (c.atkT > 0) c.atkT -= dt;
    const gap = (z) => Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);
    const holds = (z) => z && isZombie(z) && z.engaging === c && gap(z) <= GUARD_CLOSE;   // 아직 상대가 될 수 있나
    if (!holds(c.foe)) {
      c.foe = null;
      let best = Infinity;
      for (const z of bodies) if (holds(z) && gap(z) < best) { best = gap(z); c.foe = z; }
    }
    if (!c.foe) {
      enterPanic(c, null, true);
      c.tick = 0;                             // 곧바로 주변을 보고 도망 방향을 정한다
      return;
    }
    if (gap(c.foe) <= MELEE && c.atkT <= 0) { strike(c, c.foe); c.atkT = HIT_EVERY; }
  }

  // 공격형 (좀비를 보면 패닉 대신 싸움 시작, 먼저 맞아도 싸움 시작):
  //   쫓는 중엔 좀비가 타겟을 뽑듯이 틱마다 시야 안 가장 가까운 좀비를 새로 뽑아서 그놈한테 다가간다(시민 뛰는 속도).
  //   근접 거리에 붙으면 그 상대로 고정하고 1초마다 때린다 — 수비형처럼 더 가까운 좀비가 와도 안 바꾼다.
  //   그 상대가 도망가거나 멀어지면(1.5칸 밖) 또는 죽으면 다시 쫓는 중 → 가장 가까운 좀비. 시야 안에 좀비가 없으면 일반으로 돌아간다.
  //   HP가 0이 되면 놀람 없이 도망간다 (landHit) — 그 뒤로는 좀비를 봐도 일반 시민처럼 도망간다.
  function attackerFight(c, dt) {
    if (c.atkT > 0) c.atkT -= dt;
    if (c.notice > 0) c.notice -= dt;
    const tick = (c.tick -= dt) <= 0;
    if (tick) c.tick += TICK;
    let pick = tick || !sees(c, c.foe);         // 쫓는 중: 틱마다 다시 뽑는다 (상대가 죽었거나 아직 없거나 안 보이면 바로)
    if (c.locked) {
      const z = c.foe;
      if (sees(c, z) && Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z) <= GUARD_CLOSE) pick = false;   // 때리는 중: 상대 고정
      else { c.locked = false; pick = true; }    // 도망가거나 멀어지면(1.5칸 밖)·죽으면 고정을 풀고 바로 다시 뽑는다
    }
    if (pick) c.foe = nearestZombie(c, c.sight);
    if (!c.foe) { enterNormal(c); return; }
    const z = c.foe, d = Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);
    if (d > MELEE) { steer(c.vel, toward(c, z.foot.x, z.foot.z, PANIC_SPEED), ACCEL * dt); return; }
    c.locked = true;                            // 근접 거리에 붙었다 = 때리기 시작 → 이 상대로 고정
    steer(c.vel, wantV.set(0, 0), ACCEL * dt);
    if (c.atkT <= 0) { strike(c, z); c.atkT = HIT_EVERY; }
  }

  // 경찰 (공격형과 같다 — 좀비를 보면 경계 뒤 패닉 대신 싸움, 먼저 맞아도 싸움. 싸우는 동안 인지거리 = 시야):
  //   다가가지 않고 그 자리에 서서 쏜다 — 사거리 = 자기 시야, 1초마다, 공격력 2배. 붙어 있어도 쏜다.
  //   틱마다 시야 안 가장 가까운 좀비를 새로 뽑아서 쏜다 — 고정 없이 계속 바뀐다.
  //   HP가 0이 돼도 도망가지 않고 계속 쏜다 (덮칠 수는 있다). 시야 안에 좀비가 없으면 싸움 끝 → 다음 사건 자리로, 없으면 배회.
  function policeFight(c, dt) {
    steer(c.vel, wantV.set(0, 0), ACCEL * dt);
    if (c.atkT > 0) c.atkT -= dt;
    if (c.notice > 0) c.notice -= dt;
    const tick = (c.tick -= dt) <= 0;
    if (tick) c.tick += TICK;
    if (tick || !sees(c, c.foe)) c.foe = nearestZombie(c, c.sight);   // 틱마다 다시 뽑는다 (상대가 죽었거나 아직 없거나 안 보이면 바로)
    if (!c.foe) { enterNormal(c); return; }
    const z = c.foe;
    if (c.atkT <= 0 && Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z) <= c.sight) { shoot(c, z); c.atkT = HIT_EVERY; }
  }

  function nearestZombie(c, range) {
    let best = null, bd = range;
    for (const z of bodies) {
      if (!sees(c, z)) continue;
      const d = Math.hypot(z.foot.x - c.foot.x, z.foot.z - c.foot.z);
      if (d <= bd) { bd = d; best = z; }
    }
    return best;
  }

  // 쏘기: 붙는 모션 없이 바로 맞는다 — 경찰 → 좀비로 노란 선이 잠깐 번쩍
  function shoot(c, z) {
    c.shotT = 0;
    c.shotAt = z;
    landHit(c, z, POLICE_DAMAGE);
  }

  // 경찰 출동 — 사람이 감염될 때마다 (경찰이 감염돼도 센다):
  //   첫 출동이 끝난 경찰(도착했거나 싸움을 시작한)은 사건이 날 때마다 그 자리를 목록에 넣고 다 같이 출발한다 — 가장 가까운 곳부터 차례로 들른다.
  //   새 경찰은 POLICE_PER명째 감염마다 한 명 몫 — 그 감염 자리에서 북쪽으로 POLICE_FROM 떨어진 곳(그래도 화면에 보이면 화면 위쪽 끝 너머 1칸까지 더 북쪽)에서 출발해 그 자리로 뛰어온다.
  //   몫이 생길 때 반은 바로 혼자 나가고, 반은 다음 몫까지 기다렸다가 둘이 나란히 같이 나간다 (3명당 1명 또는 6명당 2명 — 평균은 같다).
  //   경찰서에 POLICE_MAX명뿐이라 그만큼 나오면 더는 안 나온다.
  let infected = 0;                           // 지금까지 감염된 사람 수 (경찰도, 판을 새로 깔면 0)
  let policeOut = 0;                          // 지금까지 출동한 경찰 수 (판을 새로 깔면 0)
  let policeHeld = 0;                         // 짝을 기다리는 경찰 몫 (0 또는 1)
  function callPolice(spot) {
    for (const b of bodies) if (b.kind === 'citizen' && b.onDuty) b.calls.push(new THREE.Vector2(spot.x, spot.z));
    if (++infected % POLICE_PER) return;
    if (!policeHeld && Math.random() < 0.5) { policeHeld = 1; return; }   // 이번 몫은 기다렸다가 다음 몫과 둘이 같이
    const n = policeHeld + 1;
    policeHeld = 0;
    for (let i = 0; i < n && policeOut < POLICE_MAX; i++) {
      policeOut++;
      const x = spot.x + (i - (n - 1) / 2) * 0.8;   // 둘이면 나란히
      const c = addCitizen(x, Math.min(spot.z - POLICE_FROM, me.foot.z - TOP - 1), null, 'police');   // 영역은 enterNormal이 그 자리로 정한다
      c.calls.push(new THREE.Vector2(spot.x, spot.z));
    }
  }

  // 때리기: 상대 쪽으로 살짝 붙었다 제자리로 돌아오는 모션을 시작한다. 데미지는 붙는 순간(0.1초 뒤)에 들어간다.
  function strike(a, v) {
    const dx = v.foot.x - a.foot.x, dz = v.foot.z - a.foot.z, d = Math.hypot(dx, dz) || 1;
    a.lungeT = 0;
    a.lungeX = dx / d;
    a.lungeZ = dz / d;
    a.lungeVictim = v;
  }

  function landHit(a, v, dmg = DAMAGE) {
    if (v.dead || !(v.kind === 'citizen' || isZombie(v)) || v.hp <= 0) return;
    v.hp = Math.max(0, v.hp - dmg);
    if (v.kind === 'citizen') {
      if (v.state === 'held') return;
      if (v.hp <= 0 && !v.police) {           // HP 0 → 놀람 없이 패닉, 이제 덮칠 수 있다 (경찰은 덮칠 수만 있고 계속 싸운다)
        v.lastSeen.copy(a.foot);
        v.lastSeenSpeed = a.speed;
        enterPanic(v, null, true);
        v.tick = 0;
      } else if (v.state !== 'fight') enterFight(v, a, true);   // 처음 맞으면 맞서 싸운다 — 첫 상대는 때린 좀비
    } else if (v.hp <= 0) dying.push(v);
  }

  // HP 0이 된 좀비: 동료는 사라지고, 나는 '죽었어'를 띄우고 멈춘다
  function killZombie(z) {
    if (z.dead) return;
    z.dead = true;
    const t = z.target;
    if (t) {                                  // 덮치거나 무는 중이었으면 그 시민을 풀어 준다
      t.marked = false;
      t.fixed = false;
      if (t.state === 'held') {
        if (t.police) enterFight(t, null, true);   // 경찰은 풀려나면 바로 다시 쏜다
        else { t.lastSeen.copy(z.foot); t.lastSeenSpeed = z.speed; enterPanic(t, null, true); }
      }
    }
    z.target = null;
    z.fixed = false;
    z.vel.set(0, 0);
    z.aim = null;
    z.engaging = null;
    unclaim(z);
    if (z === me) {                           // 내 체력바는 빈 채로 남는다
      me.mode = 'dead';
      me.mesh.material.color.setHex(COLOR.dead);
      note.textContent = "죽었어 — 오른쪽 위 '처음부터'를 눌러";
      note.hidden = false;
      return;
    }
    scene.remove(z.mesh);
    z.mesh.material.dispose();
    if (z.icon) { scene.remove(z.icon); z.icon.material.dispose(); }
    if (z.gauge) scene.remove(z.gauge);
    if (z.hpBar) scene.remove(z.hpBar);
    bodies.splice(bodies.indexOf(z), 1);
    assignSlots();
  }

  // 좀비가 HP 있는 시민을 노리면: 근접 거리까지 달려가서 1초마다 때린다 (HP가 0이 되면 그다음은 덮치기)
  function fight(z, c, dt) {
    z.engaging = c;                           // 수비형은 이걸 보고 '누가 나를 노리나'를 안다
    const d = Math.hypot(c.foot.x - z.foot.x, c.foot.z - z.foot.z);
    if (d > MELEE) { steer(z.vel, toward(z, c.foot.x, c.foot.z, z.speed), ACCEL * dt); return; }
    steer(z.vel, wantV.set(0, 0), ACCEL * dt);
    if (z.atkT <= 0) { strike(z, c); z.atkT = HIT_EVERY; }
  }

  // ── 좀비: 손가락을 대면 이동만. 떼면 인지거리 안 타겟에게 달려가고, 덮침 거리에 들어오면 덮친다 ──
  // 동료 좀비 = 늘 손을 뗀 나와 같다 (이동 속도·덮침 거리는 나보다 낮다). 거기에 더해
  //   평소엔 내가 움직이는 동안 내 주변 자기 자리를 실시간으로 따라오고, 내가 멈추면 자리를 새로 뽑아(맡은 방향 칸 안에서 랜덤)
  //   그리로 간 다음 그 근처를 배회한다.
  //   시민을 쫓을 땐 지배 거리 밖까지도 나간다. 밖에 1~2초 넘게 있으면 복귀 명령 — 안에 들어올 때까지 어떤 시민도 안 쫓는다 (감염 중이면 끝까지 물고 나서).
  //   단, 덮침 거리 안에 덮칠 수 있는 시민(HP 0)이 있으면 복귀 명령·싸움·찜보다 그걸 먼저 덮친다 (덮치기부터 감염까지 한 덩어리).
  const NO_INPUT = new THREE.Vector2();

  const inDomain = (b) => Math.hypot(b.foot.x - me.foot.x, b.foot.z - me.foot.z) <= DOMAIN;
  // 덮치는 중(marked)인 시민은 아무도 안 노린다. 동료가 쫓기 시작해 찜한 시민은 다른 동료가 안 노린다 (나는 상관없이 노린다).
  // HP가 남은 시민(수비형)은 찜이 없다 — 여럿이 같이 때린다. 다른 공간(건물 안·밖)에 있는 시민은 안 보인다.
  const huntable = (z, b) => b && b.kind === 'citizen' && !b.marked && b.space === z.space && (z === me || b.hp > 0 || !b.chaser || b.chaser === z);

  // 동료 좀비 찜: 쫓기 시작하면 그 시민에 내 이름을 걸고, 그만 쫓으면 푼다
  function claimPrey(z, c) {
    if (z.claim === c) return;
    unclaim(z);
    z.claim = c;
    c.chaser = z;
  }
  function unclaim(z) {
    if (z.claim && z.claim.chaser === z) z.claim.chaser = null;
    z.claim = null;
  }

  function nearestCitizen(z, range) {
    let best = null, bd = range;
    for (const b of bodies) {
      if (!huntable(z, b)) continue;           // 다른 좀비가 노리는 중이면 건너뛴다
      const d = Math.hypot(b.foot.x - z.foot.x, b.foot.z - z.foot.z);
      if (d <= bd) { bd = d; best = b; }
    }
    return best;
  }

  // 동료가 지금 바로 덮칠 수 있는 시민 = 같은 공간, HP 0, 아무도 안 덮치는 중, 덮침 거리 안 — 그중 가장 가까운 시민.
  // 이게 있으면 무조건 먼저 덮친다 — 복귀 명령·싸움·다른 동료의 찜보다 앞 (덮치기부터 감염까지를 한 덩어리로 친다)
  function pounceable(z) {
    let best = null, bd = z.attack;
    for (const b of bodies) {
      if (b.kind !== 'citizen' || b.marked || b.hp > 0 || b.space !== z.space) continue;
      const d = Math.hypot(b.foot.x - z.foot.x, b.foot.z - z.foot.z);
      if (d <= bd && dashOk(z, b)) { bd = d; best = b; }
    }
    return best;
  }

  // 덮쳐도 되나: 덮치는 동안은 다른 몸을 통과해서(벽만 막힌다) 거의 늘 0.2초 안에 닿는다.
  // 그래도 1초 안에 못 닿은 시민은(벽 모서리 등) 1초 동안 다시 안 덮친다 — 막혀서 제자리 덮치기를 되풀이하지 않게
  const dashOk = (z, t) => !(z.skip === t && z.skipT > 0);

  function stopPounce(z) {
    z.target.marked = false;
    z.target = null;
    z.mode = 'free';
    const s = z.vel.length();
    if (s > z.speed) z.vel.multiplyScalar(z.speed / s);   // 덮치다 멈추면 평소 속도로 돌아온다
  }

  function startBite(z, t) {
    z.mode = 'bite';
    z.biteT = z.biteLen = z === me ? INFECT / MY_INFECT : INFECT;   // 나는 더 빨리 감염시킨다
    z.vel.set(0, 0);
    z.fixed = t.fixed = true;                // 무는 동안 둘 다 그 자리에 붙는다
    t.state = 'held';
    t.biter = z;                              // 게이지는 무는 쪽의 남은 시간으로 찬다
    t.vel.set(0, 0);
    const dx = z.foot.x - t.foot.x, dz = z.foot.z - t.foot.z, d = Math.hypot(dx, dz) || 1;
    z.foot.set(t.foot.x + dx / d * BITE_GAP, 0, t.foot.z + dz / d * BITE_GAP);   // 반쯤 겹친 자리
  }

  function endBite(z, ok) {
    const t = z.target;
    z.mode = 'free';
    z.target = null;
    z.fixed = t.fixed = false;
    t.marked = false;
    if (ok) {                                 // 감염 성공 → 동료 좀비, 경찰 쪽엔 사건 하나 (경찰이 감염돼도)
      makeZombie(t);
      callPolice(t.foot);
    } else if (t.police) enterFight(t, z, true);   // 경찰은 HP 0인 채 풀려나도 바로 다시 쏜다
    else {                                    // 포기 → HP 0인 채 풀려나서 놀람 없이 바로 패닉
      t.lastSeen.copy(z.foot);
      t.lastSeenSpeed = z.speed;
      enterPanic(t, null, true);
      t.tick = 0;                             // 곧바로 주변을 다시 보고 방향을 고친다
    }
    z.split = t; t.split = z;                 // 둘이 천천히 떨어진다
    z.splitT = t.splitT = 0.4;
  }

  function makeZombie(b) {
    b.kind = 'ally';
    b.state = '';
    b.mesh.material.color.setHex(COLOR.ally);
    b.mesh.remove(b.arrow);
    b.icon.visible = false;
    b.gauge.visible = false;
    if (b.tracer) { scene.remove(b.tracer); b.tracer.material.dispose(); b.tracer = null; }
    b.vel.set(0, 0);
    b.mode = 'free';                          // free = 조작·대기, pounce = 덮치러 가는 중, bite = 무는 중
    b.target = null;
    b.sense = b.sight;                        // 좀비 인지거리 = 시민 때 자기 시야
    b.speed = SPEED;
    b.attack = ALLY_ATTACK;
    b.tick = Math.random() * TICK;
    b.pick = null;
    b.slotA = 0;                              // 내 주변에서 맡은 방향 칸의 가운데 (assignSlots가 정한다)
    b.slotOff = 0;                            // 지금 자리 방향 = 칸 가운데에서 이만큼 비켜서
    b.slotR = NEAR * rand(0.5, 1.5);          // 지금 자리 거리 = 근접 거리 ±50%
    b.phase = 'track';                        // track = 자기 자리를 따라가는 중, wander = 자리에 도착해서 배회 중
    b.home = new THREE.Vector2();             // 배회 중심 (도착한 자리)
    b.goal = null;                            // 배회할 곳
    b.timer = rand(...IDLE_TIME);
    b.outT = 0;                               // 지배 거리 밖에 있은 시간
    b.outLimit = 0;                           // 이번에 나갔을 때 복귀 명령까지 시간 (1~2초)
    b.recall = false;                         // 복귀 명령 중 — 지배 거리 안에 들어올 때까지 시민을 안 쫓는다
    b.hp = b.maxHp = HP_MAX;                  // 좀비가 되면 체력 100으로 꽉 찬다 → 체력바는 다시 깎일 때까지 안 보인다 (수비형·공격형이었으면 바 색만 바꾼다)
    if (b.hpBar) { b.hpFill.material = hpOurMat; b.hpDisp = b.hp; }
    else addHpBar(b, hpOurMat);
    b.atkT = 0;
    b.foe = null;
    assignSlots();
  }

  // 동료 좀비 방향 칸 = 나를 중심으로 360도를 동료 수만큼 나눈 칸 하나씩 (화면 기준 고정 — 내가 방향을 틀어도 안 돈다).
  // 동료가 늘면 지금 서 있는 방향 순서대로 다시 나눈다 (서로 가로지르지 않게).
  let allyN = 0;
  let meMoving = false;                       // 내가 움직이는 중 (멈추는 순간 동료들이 자리를 새로 뽑는다)
  function assignSlots() {
    const allies = bodies.filter((b) => b.kind === 'ally');
    const n = allyN = allies.length;
    if (!n) return;
    const now = allies.map((b) => Math.atan2(b.foot.z - me.foot.z, b.foot.x - me.foot.x));
    const order = allies.map((_, i) => i).sort((i, j) => now[i] - now[j]);
    let sx = 0, sy = 0;                       // 지금 자리에서 가장 덜 움직이게 돌리는 각
    order.forEach((i, k) => { const off = now[i] - (k / n) * Math.PI * 2; sx += Math.cos(off); sy += Math.sin(off); });
    const base = Math.atan2(sy, sx);
    const half = Math.PI / n * SLOT_SPREAD;   // 칸이 좁아졌으면 지금 자리도 칸 안으로
    order.forEach((i, k) => {
      const b = allies[i];
      b.slotA = base + (k / n) * Math.PI * 2;
      b.slotOff = Math.max(-half, Math.min(half, b.slotOff));
    });
  }

  // 새 자리 = 맡은 방향 칸 안 아무 방향 + 근접 거리 ±50% 아무 거리 (내가 멈출 때, 복귀 명령 때)
  function freshSlot(z) {
    z.slotOff = (Math.random() * 2 - 1) * Math.PI / Math.max(1, allyN) * SLOT_SPREAD;
    z.slotR = NEAR * rand(0.5, 1.5);
  }

  // 자리 = 내 위치 + 자리 방향으로 자리 거리만큼 (나와 같이 움직인다).
  // 나와 같은 공간 안으로 당긴다 — 내가 건물 안이면 그 건물 안(벽에서 0.7칸), 밖이면 건물 밖(벽에서 0.7칸)
  const slotV = new THREE.Vector2();
  function slotOf(z) {
    let x = me.foot.x + Math.cos(z.slotA + z.slotOff) * z.slotR, y = me.foot.z + Math.sin(z.slotA + z.slotOff) * z.slotR;
    const B = me.space, m = 0.7;
    if (B) { x = Math.max(B.x0 + m, Math.min(B.x1 - m, x)); y = Math.max(B.z0 + m, Math.min(B.z1 - m, y)); }
    else for (const C of buildings) {
      if (x <= C.x0 - m || x >= C.x1 + m || y <= C.z0 - m || y >= C.z1 + m) continue;
      const l = x - (C.x0 - m), r = C.x1 + m - x, u = y - (C.z0 - m), w = C.z1 + m - y, k = Math.min(l, r, u, w);   // 가장 가까운 벽 바깥으로
      if (k === l) x = C.x0 - m; else if (k === r) x = C.x1 + m; else if (k === u) y = C.z0 - m; else y = C.z1 + m;
    }
    return slotV.set(x, y);
  }

  // 동료 좀비가 지배 거리 밖에 1~2초 넘게 있으면 복귀 명령. 지배 거리 안에 들어오면 풀린다.
  function recallCheck(z, dt) {
    if (inDomain(z)) { z.outT = 0; z.recall = false; return; }
    if (z.outT === 0) z.outLimit = rand(...RECALL_DELAY);
    z.outT += dt;
    if (!z.recall && z.outT >= z.outLimit) {
      z.recall = true;
      freshSlot(z);                           // 돌아갈 자리도 새로 뽑는다 — 들어온 뒤 타겟이 없으면 그 자리까지 온다
      z.phase = 'track';
    }
  }

  // 복귀 명령 중: 어떤 시민도 안 보고 자기 자리로 간다
  function goSlot(z, dt) {
    const s = slotOf(z);
    steer(z.vel, toward(z, s.x, s.y, z.speed), ACCEL * dt);
  }

  // 타겟이 없는 동료 좀비
  //   추적: 내가 움직이는 동안, 그리고 내가 멈춘 뒤 새 자리에 닿을 때까지 — 자기 자리를 실시간으로 따라간다
  //         (내 움직임 + 자리 쪽으로. 뛰던 속도 그대로, 닿기 직전에만 살짝 줄인다)
  //   배회: 새 자리에 닿으면 그 근처를 천천히 걷다 서기를 반복한다. 내가 다시 움직이면 추적.
  function allyIdle(z, dt) {
    if (meMoving) z.phase = 'track';
    if (z.phase === 'track') {
      const sl = slotOf(z), dx = sl.x - z.foot.x, dz = sl.y - z.foot.z, d = Math.hypot(dx, dz);
      const w = via(z, sl.x, sl.y);
      if (w.x !== sl.x || w.y !== sl.y) {     // 벽이 가로막으면(다른 공간·건물 너머) 길 찾기대로 간다 — 내 움직임은 안 보탠다
        steer(z.vel, toward(z, sl.x, sl.y, z.speed), ACCEL * dt);
        return;
      }
      const toSlot = Math.min(z.speed, d * 3);
      const walk = d > 0.05 ? toSlot / d : 0;
      const mv = me.mode === 'free' ? me.vel : NO_INPUT;   // 내가 덮치러 튀어 나가는 건 따라 하지 않는다
      wantV.set(mv.x + dx * walk, mv.y + dz * walk);
      const s = wantV.length();
      if (s > z.speed) wantV.multiplyScalar(z.speed / s);
      steer(z.vel, wantV, ACCEL * dt);
      if (!meMoving && d < 0.3) {             // 새 자리에 도착 → 배회
        z.phase = 'wander';
        z.home.set(z.foot.x, z.foot.z);
        z.goal = null;
        z.timer = rand(...IDLE_TIME);
      }
      return;
    }
    if (z.goal) {                             // 배회: 도착한 자리 근처 한 곳으로 천천히 걸어간다
      const gx = z.goal.x - z.foot.x, gz = z.goal.y - z.foot.z, g = Math.hypot(gx, gz);
      if (g < 0.1) { z.goal = null; z.timer = rand(...IDLE_TIME); steer(z.vel, wantV.set(0, 0), ACCEL * dt); }
      else { const s = Math.min(ALLY_WALK, g * 3); steer(z.vel, wantV.set(gx / g * s, gz / g * s), ACCEL * dt); }
    } else {                                  // 배회: 서 있다가 근처 다음 곳을 고른다
      steer(z.vel, wantV.set(0, 0), ACCEL * dt);
      if ((z.timer -= dt) <= 0) {
        const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * WANDER_R;
        const gx = z.home.x + Math.cos(a) * r, gz = z.home.y + Math.sin(a) * r;
        if (freeSpot(gx, gz, z.space)) z.goal = new THREE.Vector2(gx, gz);
        else z.timer = rand(...IDLE_TIME);    // 벽 너머·벽 바로 옆이면 이번엔 그대로 서 있는다
      }
    }
  }

  function updateZombie(z, dt) {
    const touching = z === me && pid !== null;   // 손가락을 대고 있다 (조종하는 나만)
    const input = z === me ? move : NO_INPUT;
    const aimed = z.aim;                         // 지난 걸음에 빨간 테두리를 띄운 시민
    z.aim = null;
    z.engaging = null;                           // 이번 걸음에 HP 있는 시민을 공격 대상으로 잡으면 fight()가 다시 채운다
    if (z.atkT > 0) z.atkT -= dt;
    if (z.skipT > 0) z.skipT -= dt;
    if ((z.tick -= dt) <= 0) {                   // 시민처럼 틱마다 타겟을 새로 뽑는다 = 인지거리 안 가장 가까운 시민 (때리던 상대도 더 가까운 시민이 있으면 바뀐다)
      z.tick += TICK;
      z.pick = nearestCitizen(z, z.sense);
    }
    if (z !== me) recallCheck(z, dt);            // 감염 중에도 시간은 센다 — 물기는 끝까지, 끝나면 바로 복귀
    const p = z.pick;
    const ready = huntable(z, p) && Math.hypot(p.foot.x - z.foot.x, p.foot.z - z.foot.z) <= z.attack ? p : null;   // 덮치기 가능 = 타겟이 덮침 거리 안
    let jump = null;                             // 동료가 무조건 먼저 덮칠 시민 (아래에서 정한다)
    if (z.mode === 'bite') {
      if (input.x || input.y) endBite(z, false);   // 움직이면 감염 포기
      else if ((z.biteT -= dt) <= 0) endBite(z, true);
    }
    if (z.mode === 'pounce') {
      const t = z.target;
      const dx = t.foot.x - z.foot.x, dz = t.foot.z - z.foot.z, d = Math.hypot(dx, dz);
      if (touching) stopPounce(z);              // 손가락을 대면 그만
      else if ((z.pounceT -= dt) <= 0) { z.skip = t; z.skipT = 1; stopPounce(z); }   // 1초 안에 못 닿았다(막혔다) → 이 시민은 1초 동안 다시 안 덮친다
      else if (d - BITE_GAP <= z.speed * POUNCE * dt + 0.02) startBite(z, t);   // 이번 걸음에 닿으면 바로 문다 (도망치는 상대도 놓치지 않게)
      else z.vel.set(dx / d * z.speed * POUNCE, dz / d * z.speed * POUNCE);   // 덮치기는 가감속 없이 확 튀어 나간다
    }
    if (z.mode === 'free') {
      if (touching) {
        steer(z.vel, wantV.set(input.x * z.speed, input.y * z.speed), ACCEL * dt);   // 조이스틱 오른쪽 = 바닥 오른쪽, 아래 = 카메라 쪽
        z.aim = ready;                             // 지금 손을 떼면 덮칠 시민 → 빨간 테두리
      } else if (z !== me && (jump = pounceable(z))) {   // 동료: 덮칠 수 있으면 무조건 먼저 (복귀 명령 중이어도)
        unclaim(z);
        z.phase = 'track';
        z.mode = 'pounce'; z.target = jump; z.pounceT = 1; jump.marked = true;
      } else if (z !== me && z.recall) {
        unclaim(z);
        goSlot(z, dt);                             // 복귀 명령 — 지배 거리 안에 들어올 때까지 유혹 무시
      } else {
        const t = aimed && aimed.kind === 'citizen' && !aimed.marked && aimed.space === z.space ? aimed : ready;   // 테두리가 떠 있던 시민은 무조건 노린다 (문 밖으로 나가 버렸으면 빼고)
        const prey = huntable(z, p) ? p : null;
        const go = t || prey;
        if (z !== me) {
          if (go) z.phase = 'track';               // 동료 좀비: 사냥이 끝나면 자기 자리로 간 다음 배회
          if (prey && !t && prey.hp <= 0) claimPrey(z, prey); else unclaim(z);   // HP 0 시민을 쫓는 동안 찜 (덮치면 marked가 대신한다)
        }
        if (go && go.hp > 0) fight(z, go, dt);     // HP가 남았으면 가서 때린다
        else if (t && dashOk(z, t)) { z.mode = 'pounce'; z.target = t; z.pounceT = 1; t.marked = true; }
        else if (prey || t) { const q = prey || t; steer(z.vel, toward(z, q.foot.x, q.foot.z, z.speed), ACCEL * dt); }   // 타겟이 인지거리 안 → 자동으로 달려간다 (방금 덮쳐서 못 닿은 시민이면 1초 동안은 덮치지 않고 다가간다)
        else if (z === me) steer(z.vel, wantV.set(0, 0), ACCEL * dt);   // 나는 타겟이 없으면 살짝 미끄러지며 선다
        else allyIdle(z, dt);
      }
    }
  }

  // 겹친 둘을 떼어 놓는다. 무는 중인 둘은 꿈쩍 않고, 부딪힌 쪽만 밀려난다.
  // 무게: 밀고 들어간 쪽(상대 쪽으로 움직이던 쪽)이 거의 다 물러나고, 밀린 쪽은 조금만 밀려난다. 둘 다 같은 빠르기로 마주 오면 반반.
  // 미는 힘(force): 센 쪽이 밀면 상대가 그만큼 더 비켜나고, 약한 쪽이 밀면 센 쪽은 그만큼 덜 밀린다 (나만 MY_FORCE배)
  // 덮치는 중인 좀비는 다른 몸을 통과한다 (벽은 그대로 막힌다)
  function collide(dt) {
    const give = 0.5 / WEIGHT;                 // 밀린 쪽이 비켜 주는 몫 (WEIGHT 1 = 반반 = 예전) — 힘이 같을 때
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        if (a.fixed && b.fixed) continue;
        if (a.target === b || b.target === a) continue;   // 덮치는 중·무는 중엔 둘이 겹친다
        if (a.mode === 'pounce' || b.mode === 'pounce') continue;   // 덮치는 동안은 아무 몸이나 통과
        const dx = b.foot.x - a.foot.x, dz = b.foot.z - a.foot.z, d = Math.hypot(dx, dz), min = a.r + b.r;
        if (d >= min) continue;
        const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0;
        let push = min - d;
        if (a.split === b) push = Math.min(push, SPLIT * dt);   // 물기가 끝난 둘은 천천히 떨어진다
        let ka = 0.5;                            // a가 물러나는 몫 (나머지는 b)
        if (a.fixed) ka = 0;
        else if (b.fixed) ka = 1;
        else {
          const pa = Math.max(0, a.vel.x * nx + a.vel.y * nz), pb = Math.max(0, -(b.vel.x * nx + b.vel.y * nz));   // 서로 상대 쪽으로 움직이던 빠르기
          const yb = Math.min(1, give * a.force / b.force), ya = Math.min(1, give * b.force / a.force);   // a가 밀 때 b가 비켜나는 몫, b가 밀 때 a가 비켜나는 몫
          if (pa + pb > 1e-6) ka = (pa * (1 - yb) + pb * ya) / (pa + pb);
        }
        const kb = 1 - ka;
        a.foot.x -= nx * push * ka;
        a.foot.z -= nz * push * ka;
        b.foot.x += nx * push * kb;
        b.foot.z += nz * push * kb;
      }
    }
  }

  // ── 시야 — 좀비마다 자기 인지거리만큼 둥글게 보이고, 벽에 가린 곳은 안 보인다. 모든 좀비 시야를 합쳐서 보여 준다.
  //    시야 밖은 어둡게 덮고, 거기 있는 시민·경찰은 안 그린다. 지붕이 덮인 건물(좀비가 없는 건물) 안 사람도 안 보인다 ──
  const FOG = 0.85;            // 시야 밖 어둠 진하기 (1 = 완전 검정)
  const VIEW_RAYS = 120;       // 시야 둘레를 이만큼 나눠 벽까지 거리를 잰다 (벽 끝 모서리 쪽은 따로 더 쏜다)
  const MAX_TRI = 60000;
  const visGeo = new THREE.BufferGeometry();
  const visPos = new Float32Array(MAX_TRI * 9);
  visGeo.setAttribute('position', new THREE.BufferAttribute(visPos, 3));
  const visMask = new THREE.Mesh(visGeo, new THREE.MeshBasicMaterial({   // 시야 자리에 스텐실 1을 찍는다 (색은 안 칠한다)
    colorWrite: false, depthWrite: false, depthTest: false, side: THREE.DoubleSide,
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.AlwaysStencilFunc, stencilZPass: THREE.ReplaceStencilOp,
  }));
  visMask.frustumCulled = false;
  visMask.renderOrder = -5;
  scene.add(visMask);
  const fog = new THREE.Mesh(new THREE.PlaneGeometry(GROUND, GROUND).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({   // 스텐실 1이 아닌 곳만 어둡게
    color: 0x0b0b0d, transparent: true, opacity: FOG, depthWrite: false, depthTest: false,
    stencilWrite: true, stencilRef: 1, stencilFunc: THREE.NotEqualStencilFunc, stencilFail: THREE.KeepStencilOp, stencilZFail: THREE.KeepStencilOp, stencilZPass: THREE.KeepStencilOp,
  }));
  fog.renderOrder = -0.52;     // 바닥·지붕·벽 위, 캐릭터 밑
  fog.frustumCulled = false;
  scene.add(fog);
  // 시야를 막는 벽 = 건물마다 벽 두께까지 친 바깥 네모와 안쪽 네모 (문도 시야는 막는다 — 밖에서 안, 안에서 밖이 안 보인다)
  const sightWalls = [], sightCorners = [];
  for (const B of buildings) for (const k of [WALL / 2, -WALL / 2]) {
    const x0 = B.x0 - k, x1 = B.x1 + k, z0 = B.z0 - k, z1 = B.z1 + k;
    sightWalls.push([x0, z0, x1, z0], [x1, z0, x1, z1], [x0, z1, x1, z1], [x0, z0, x0, z1]);
    sightCorners.push([x0, z0], [x1, z0], [x1, z1], [x0, z1]);
  }
  const rayAngles = [];
  function drawVision(eyes) {
    let n = 0;
    for (const z of eyes) {
      const x = z.foot.x, y = z.foot.z, R = z.sense;
      rayAngles.length = 0;
      for (let k = 0; k < VIEW_RAYS; k++) rayAngles.push(k / VIEW_RAYS * Math.PI * 2);
      for (const [ex, ez] of sightCorners) {      // 벽 끝을 스치는 방향 — 가장자리가 반듯하게
        if (Math.hypot(ex - x, ez - y) > R + 0.5) continue;
        const a = (Math.atan2(ez - y, ex - x) + Math.PI * 2) % (Math.PI * 2);   // 0~2π로 맞춰야 순서대로 이어진다
        rayAngles.push(a - 1e-4, a + 1e-4);
      }
      rayAngles.sort((a, b) => a - b);
      let px = 0, pz = 0, fx = 0, fz = 0;
      for (let i = 0; i <= rayAngles.length; i++) {
        let qx, qz;
        if (i < rayAngles.length) {
          const a = rayAngles[i], dx = Math.cos(a), dz = Math.sin(a), hit = wallRay(x, y, dx, dz, R, sightWalls);
          const d = hit;
          qx = x + dx * d; qz = y + dz * d;
        } else { qx = fx; qz = fz; }
        if (i === 0) { fx = qx; fz = qz; }
        else if (n < MAX_TRI) {
          const o = n * 9;
          visPos[o] = x; visPos[o + 1] = 0.04; visPos[o + 2] = y;
          visPos[o + 3] = px; visPos[o + 4] = 0.04; visPos[o + 5] = pz;
          visPos[o + 6] = qx; visPos[o + 7] = 0.04; visPos[o + 8] = qz;
          n++;
        }
        px = qx; pz = qz;
      }
    }
    visGeo.attributes.position.needsUpdate = true;
    visGeo.setDrawRange(0, n * 3);
    fog.position.set(Math.round(me.foot.x), 0.04, Math.round(me.foot.z));
  }
  function seen(b, eyes) {                    // 좀비 하나라도 인지거리 안에서 벽에 안 가리고 보고 있나 (지붕 덮인 건물 안이면 안 보인다)
    if (b.space && !b.space.open) return false;
    for (const z of eyes) {
      if (Math.hypot(b.foot.x - z.foot.x, b.foot.z - z.foot.z) > z.sense + RADIUS) continue;
      if (!sightWalls.some((w) => crosses(z.foot.x, z.foot.z, b.foot.x, b.foot.z, w))) return true;
    }
    return false;
  }

  function draw(dt) {
    const eyes = bodies.filter((b) => isZombie(b) || b === me);   // 시야 = 나 + 동료 좀비 전부 (내가 죽어도 마지막 자리 시야는 남는다)
    for (const B of buildings) {              // 좀비가 하나라도 들어간 건물만 지붕이 열린다
      B.open = eyes.some((z) => z.space === B);
      B.roof.visible = !B.open;
    }
    drawVision(eyes);
    for (const b of bodies) {
      const hide = !(b === me || isZombie(b) || seen(b, eyes));   // 시민·경찰은 좀비 시야 안에 있을 때만 보인다
      b.mesh.visible = !hide;
      b.mesh.position.copy(b.foot).addScaledVector(UP, RADIUS);   // 원 아랫끝이 바닥에 닿는다
      if (b.lungeT >= 0) {                    // 때리는 모션: 상대 쪽으로 빠르게 붙었다가 돌아온다 (그림만)
        const k = b.lungeT < LUNGE_IN ? b.lungeT / LUNGE_IN : Math.max(0, 1 - (b.lungeT - LUNGE_IN) / LUNGE_OUT);
        b.mesh.position.x += b.lungeX * LUNGE * k;
        b.mesh.position.z += b.lungeZ * LUNGE * k;
      }
      let barUp = false;                      // 체력바가 떠 있으면 ? ! !!!를 그 위로
      if (b.hpBar) {
        b.hpDisp += (b.hp - b.hpDisp) * Math.min(1, dt * 12);   // 깎이는 게 보이게 빠르게 따라 줄어든다
        barUp = b.hp < b.maxHp;               // 깎여 있으면 뜬다 (회복이 없어서 한 번 뜨면 계속) — HP 0이면 빈 바, 꽉 차 있으면 안 보인다
        b.hpBar.visible = barUp && !hide;
        if (barUp) {
          b.hpBar.position.copy(b.foot).addScaledVector(UP, RADIUS * 2 + 0.22 + (b === me ? GAUGE_H / 2 : 0));   // 내 바는 두 배 두꺼워서 아래 끝이 같게 조금 올린다
          b.hpFill.scale.x = Math.max(0.001, b.hpDisp / b.maxHp);
        }
      }
      if (b.kind !== 'citizen') continue;
      if (b.tracer) {                         // 경찰이 쏜 노란 선 — 두 원 가운데를 잇고, 흐려지며 사라진다
        b.tracer.visible = b.shotT >= 0 && !hide;
        if (b.shotT >= 0) {
          const t = b.shotAt.foot, dx = t.x - b.foot.x, dz = t.z - b.foot.z;
          b.tracer.position.set(b.foot.x + dx / 2, 0, b.foot.z + dz / 2).addScaledVector(UP, RADIUS);
          b.tracer.rotation.y = -Math.atan2(dz, dx);
          b.tracer.scale.x = Math.hypot(dx, dz) || 1e-3;
          b.tracer.material.opacity = 1 - b.shotT / SHOT_FLASH;
          if ((b.shotT += dt) >= SHOT_FLASH) b.shotT = -1;
        }
      }
      b.arrow.visible = b.vel.length() > 0.15;
      b.arrow.rotation.z = Math.atan2(-b.vel.y * SIN_P, b.vel.x);   // 바닥 위 방향 → 화면 위 방향
      const gauged = b.state === 'held' && b.biter === me;   // 감염 게이지는 내가 물 때만 (동료가 물 땐 안 뜬다)
      b.gauge.visible = gauged && !hide;
      if (gauged) {
        b.gauge.position.copy(b.foot).addScaledVector(UP, RADIUS * 2 + 0.22 + (barUp ? BAR_STEP : 0));   // 체력바가 떠 있으면 그 위에 쌓는다
        b.gaugeFill.scale.x = Math.min(1, Math.max(0.001, 1 - b.biter.biteT / b.biter.biteLen));
      }
      const kind = b.marked ? '!!!' : b.state === 'super' ? '!!' : b.state === 'alert' ? '?' : (b.state === 'panic' || b.state === 'fight') && b.notice > 0 ? '!' : '';
      if (kind !== b.iconKind) {
        b.iconKind = kind;
        b.iconT = 0;
        if (kind) b.icon.material.map = ICONS[kind];
      }
      b.icon.visible = kind !== '' && !hide;
      if (!kind) continue;
      b.iconT += dt;
      const k = Math.min(1, b.iconT / 0.12), s = ICON_H * (0.6 + 0.4 * (1 - (1 - k) * (1 - k)));   // 뜰 때 살짝 튀어나온다
      b.icon.scale.set(s * 2, s, 1);
      b.icon.position.copy(b.foot).addScaledVector(UP, RADIUS * 2 + ICON_H * 0.6 + (gauged || barUp ? 0.35 : 0) + (gauged && barUp ? BAR_STEP : 0));   // 게이지·체력바가 있으면 그 위로
    }
    if (me.aim) { me.aim.mesh.add(aimRing); aimRing.visible = true; }
    else aimRing.visible = false;
  }

  function place() {
    camera.position.copy(me.foot).addScaledVector(UP, RADIUS).addScaledVector(BACK, DIST);   // 카메라는 나를 정면으로 겨눈다 (때리는 모션엔 안 흔들린다)
    ground.position.set(Math.round(me.foot.x), 0, Math.round(me.foot.z));  // 1칸 단위로만 옮겨서 격자는 제자리
    nearRing.position.set(me.foot.x, 0.012, me.foot.z);
    domainRing.position.set(me.foot.x, 0.012, me.foot.z);
  }

  function resize() {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.setViewOffset(w, h, 0, (0.5 - SCREEN_Y) * h, w, h);   // 화면을 아래로 밀어 내가 위에서 40% 자리에 오게
  }

  // ── 조이스틱: 화면 아무 데나 누르면 그 자리에 생기고, 떼면 사라진다 ──
  let pid = null, bx = 0, by = 0;
  const move = new THREE.Vector2();     // 조이스틱 방향 (길이 1, 멈추면 0)
  function local(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }

  stage.addEventListener('pointerdown', (e) => {
    if (pid !== null) return;
    pid = e.pointerId;
    try { stage.setPointerCapture(pid); } catch (_) {}
    [bx, by] = local(e);
    joy.style.transform = `translate(${bx}px, ${by}px)`;
    knob.style.transform = 'translate(0px, 0px)';
    joy.hidden = false;
    move.set(0, 0);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', (e) => {
    if (e.pointerId !== pid) return;
    const [x, y] = local(e);
    const dx = x - bx, dy = y - by, len = Math.hypot(dx, dy);
    const k = len > JOY_R ? JOY_R / len : 1;
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    if (len > DEAD) move.set(dx / len, dy / len); else move.set(0, 0);   // 방향만 본다 — 속도는 늘 같음
  });
  function release(e) {
    if (e.pointerId !== pid) return;
    pid = null;
    joy.hidden = true;
    move.set(0, 0);
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('lostpointercapture', release);
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  // ── 판 깔기: 나는 가운데, 활동 영역마다 시민 몇 명, 건물마다 안에 사람들 ──
  function spawn() {
    for (const b of bodies) {
      scene.remove(b.mesh);
      b.mesh.material.dispose();
      if (b.icon) { scene.remove(b.icon); b.icon.material.dispose(); }
      if (b.gauge) scene.remove(b.gauge);
      if (b.hpBar) scene.remove(b.hpBar);
      if (b.tracer) { scene.remove(b.tracer); b.tracer.material.dispose(); }
    }
    bodies.length = 0;
    dying.length = 0;
    infected = policeOut = policeHeld = 0;
    for (const r of rings) scene.remove(r);
    rings.length = 0;
    note.hidden = true;

    me = addBody('me', 0, 0);
    me.mode = 'free';
    me.target = null;
    me.hp = me.maxHp = MY_HP;
    me.r = MY_BODY;                          // 내 부딪힘은 작고 미는 힘은 세다 — 동료들 사이에 덜 갇히게
    me.force = MY_FORCE;
    addHpBar(me, hpOurMat);
    me.hpBar.scale.y = 2;                    // 내 체력바는 두 배 두껍고, 다른 바·표시보다 늘 위에 그린다 (섞여도 보이게)
    for (const m of me.hpBar.children) m.renderOrder += 10;
    me.sense = SIGHT * rand(0.9, 1.1);       // 좀비 인지거리 = 시민의 시야
    me.speed = MY_SPEED;                     // 이동 속도는 나만 더 빠르다
    me.attack = ATTACK;
    me.tick = 0;
    me.pick = null;
    GROUPS.forEach((kinds, i) => {
      const a = i / GROUPS.length * Math.PI * 2, cx = Math.sin(a) * GROUP_DIST, cz = -Math.cos(a) * GROUP_DIST;   // 북쪽(-z)부터 시계 방향
      const area = square(cx, cz);
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.set(cx, 0.01, cz);
      ring.renderOrder = -1;
      scene.add(ring);
      rings.push(ring);
      for (const k of kinds) {
        let g = pickGoal(area);
        for (let n = 0; n < 30 && bodies.some((b) => Math.hypot(b.foot.x - g.x, b.foot.z - g.y) < 1.2); n++) g = pickGoal(area);
        addCitizen(g.x, g.y, area, GROUP_TYPE[k]);
      }
    });
    for (const B of buildings) {             // 건물 사람들 — 활동 영역 = 그 건물 안
      for (const [k, n] of Object.entries(B.kinds)) for (let i = 0; i < n; i++) {
        let g = pickGoal(B);
        for (let t = 0; t < 30 && bodies.some((b) => Math.hypot(b.foot.x - g.x, b.foot.z - g.y) < 1.2); t++) g = pickGoal(B);
        addCitizen(g.x, g.y, B, GROUP_TYPE[k]).home = B;
      }
    }
  }
  document.getElementById('reset').addEventListener('click', spawn);

  function stepWorld(dt) {
    const moving = me.vel.length() > 0.3;
    if (meMoving && !moving) for (const b of bodies) if (b.kind === 'ally') { freshSlot(b); b.phase = 'track'; }   // 내가 멈추면 동료는 자리를 새로 뽑고 그리로 간다
    meMoving = moving;
    for (const b of bodies) {                 // 걸음 전 자리·공간 — 건물 사람이 문 밖으로 나가면 그때부터 활동 영역 제한이 풀린다
      b.px = b.foot.x; b.pz = b.foot.z;
      b.space = spaceOf(b.foot.x, b.foot.z);
      if (b.home && b.space !== b.home) b.freed = true;
    }
    for (const b of bodies) if (isZombie(b)) updateZombie(b, dt);
    for (const b of bodies) if (b.kind === 'citizen') updateCitizen(b, dt);
    for (const b of bodies) {
      if (!b.fixed) { b.foot.x += b.vel.x * dt; b.foot.z += b.vel.y * dt; }
      if (b.split && (b.splitT -= dt) <= 0) b.split = null;
      if (b.lungeT >= 0) {                    // 때리는 모션 시간 — 붙는 순간 데미지
        const before = b.lungeT;
        b.lungeT += dt;
        if (before < LUNGE_IN && b.lungeT >= LUNGE_IN && b.lungeVictim) { landHit(b, b.lungeVictim, b === me ? MY_DAMAGE : DAMAGE); b.lungeVictim = null; }
        if (b.lungeT >= LUNGE_IN + LUNGE_OUT) b.lungeT = -1;
      }
    }
    for (const z of dying) killZombie(z);    // HP 0이 된 좀비 처리 (목록을 돌고 난 뒤에 지운다)
    dying.length = 0;
    collide(dt);
    for (const b of bodies) if (!b.fixed) wallCollide(b);   // 벽은 마지막에 — 서로 밀다가 벽을 넘지 않게
    draw(dt);
    place();
    renderer.render(scene, camera);
  }

  let last = 0;
  function frame(now) {
    const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
    last = now;
    stepWorld(dt);
    requestAnimationFrame(frame);
  }

  function start() {
    spawn();
    new ResizeObserver(resize).observe(canvas);
    resize();
    requestAnimationFrame(frame);
    window.__rdReady = true;
  }

  window.__rd = { get me() { return me; }, bodies, spawn, fleeDir, step: stepWorld };   // 확인용 (콘솔에서 상태 보기·한 걸음씩 돌리기)
  // 내가 고쳐 올리면 열려 있는 화면이 저절로 바뀐다 — 새 버전은 판을 새로 깐다
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>

</body></html>
